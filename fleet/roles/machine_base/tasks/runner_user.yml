---
# Phase 1: wrap the existing, unmodified script rather than reimplementing
# its sudoers-generation logic. RUNNER_COUNT is passed through so a host
# with a different number of registered runner instances can override it
# via fleet/inventory group_vars/host_vars (see fleet/inventory/group_vars/all.yml).
#
# osac-hosts-entry is installed separately (native copy, not via the
# script) because ansible.builtin.script only copies the one script file
# to the remote host -- create_runner_user()'s own install of its sibling
# osac-hosts-entry file (for the direct/manual-invocation path) would
# silently no-op here otherwise.
- name: Install osac-hosts-entry helper for /etc/hosts management
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/osac-hosts-entry"
    dest: /usr/local/sbin/osac-hosts-entry
    owner: root
    group: root
    mode: "0755"

- name: Run machine-init.sh runner-user
  ansible.builtin.script: "{{ playbook_dir }}/../../scripts/machine-init.sh runner-user"
  environment:
    RUNNER_COUNT: "{{ runner_count }}"
  register: _runner_user_result
  changed_when: true
  failed_when: _runner_user_result.rc != 0
