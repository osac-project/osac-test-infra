---
# Phase 1: wrap as-is -- already idempotent (skips install if the pinned
# version is present).
- name: Run machine-init.sh go
  ansible.builtin.script: "{{ playbook_dir }}/../../scripts/machine-init.sh go"
  register: _go_result
  changed_when: "'already installed' not in _go_result.stdout"
  failed_when: _go_result.rc != 0
