---
# Native from day one (trivial, no wrapping benefit) -- mirrors
# scripts/machine-init.sh's install_packages(). The AGENT_STORAGE dir and
# osac-hosts-entry install that used to also live in install_packages()
# moved to create_runner_user() (see runner_user.yml, which wraps that step
# as-is) -- they're chowned/associated with RUNNER_USER, which doesn't
# exist yet at packages-install time.
- name: Install system packages
  ansible.builtin.dnf:
    name:
      - libvirt
      - qemu-kvm
      - podman
      - podman-docker
      - pigz
      - haproxy
      - skopeo
      - zstd
      - jq
      - git
      - dnf-plugins-core
      - dnsmasq
      - python3
      - python3-pip
      - virt-install
    state: present

- name: Install ansible-builder (needed for AAP execution-environment images)
  ansible.builtin.pip:
    name: ansible-builder
    extra_args: --quiet
