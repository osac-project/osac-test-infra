---
# Delete the named cluster via the OSAC CLI. BMaaS hosts are retained for reuse;
# OSAC owns the per-order Agents and InfraEnv.

- name: Resolve OSAC namespace for destroy
  ansible.builtin.set_fact:
    _destroy_osac_ns: "{{ snapshot_osac_namespace | default(osac_namespace) }}"

- name: Get fulfillment internal API host
  ansible.builtin.shell:
    cmd: >-
      oc get route fulfillment-internal-api -n {{ _destroy_osac_ns }}
      -o jsonpath='{.status.ingress[0].host}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _destroy_ful_host
  changed_when: false
  failed_when: _destroy_ful_host.rc != 0 or (_destroy_ful_host.stdout | trim | length) == 0

- name: Ensure osac CLI config directory exists
  ansible.builtin.file:
    path: /root/.config/osac
    state: directory
    mode: "0700"

- name: Log in osac CLI (admin token)
  ansible.builtin.shell: |
    set -euo pipefail
    rm -f /root/.config/osac/secrets.json
    osac logout >/dev/null 2>&1 || true
    osac login --insecure --private \
      --token-script "oc create token -n {{ _destroy_osac_ns }} admin --duration 1h" \
      --address "https://{{ _destroy_ful_host.stdout | trim }}"
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: true

- name: Resolve cluster ID and deletion state for {{ caas_cluster_name }}
  ansible.builtin.shell: |
    set -euo pipefail
    osac --tenant "{{ osac_test_tenant_name }}" get clusters -o json | python3 -c '
    import json, sys
    raw = json.load(sys.stdin)
    clusters = raw if isinstance(raw, list) else (raw.get("items") or [raw])
    name = sys.argv[1]

    def cluster_name(c):
        if not isinstance(c, dict):
            return ""
        # Table "NAME" column is metadata.name; top-level name is often unset.
        meta = c.get("metadata") if isinstance(c.get("metadata"), dict) else {}
        return (meta.get("name") or c.get("name") or "")

    matches = [c for c in clusters if cluster_name(c) == name]
    if len(matches) > 1:
        sys.exit("Multiple clusters match the configured name; refusing deletion")
    cluster = matches[0] if matches else {}
    if matches and not cluster.get("id"):
        sys.exit("The matching cluster has no ID; refusing deletion")
    print(json.dumps({
        "id": cluster.get("id", ""),
        "deleting": bool((cluster.get("metadata") or {}).get("deletion_timestamp")),
    }))
    ' "{{ caas_cluster_name }}"
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /root/.kube/config
  register: _destroy_cluster_lookup
  changed_when: false

- name: Set cluster deletion target
  ansible.builtin.set_fact:
    _destroy_cluster: "{{ _destroy_cluster_lookup.stdout | from_json }}"

- name: Report when named cluster is already absent
  ansible.builtin.debug:
    msg: "No osac cluster named '{{ caas_cluster_name }}' — skip osac delete"
  when: _destroy_cluster.id | length == 0

- name: Report when cluster deletion is already pending
  ansible.builtin.debug:
    msg: "OSAC cluster '{{ caas_cluster_name }}' is already deleting — skip duplicate request"
  when: _destroy_cluster.deleting

- name: Delete cluster via osac CLI
  ansible.builtin.command:
    cmd: osac --tenant "{{ osac_test_tenant_name }}" delete cluster {{ _destroy_cluster.id }}
  environment:
    KUBECONFIG: /root/.kube/config
  register: _osac_delete
  when:
    - _destroy_cluster.id | length > 0
    - not _destroy_cluster.deleting
  changed_when: _osac_delete.rc == 0

- name: Confirm OSAC deletion is recorded before returning
  ansible.builtin.shell: |
    set -euo pipefail
    osac --tenant "{{ osac_test_tenant_name }}" get clusters -o json | python3 -c '
    import json, sys
    raw = json.load(sys.stdin)
    clusters = raw if isinstance(raw, list) else (raw.get("items") or [raw])
    matches = [c for c in clusters if isinstance(c, dict) and c.get("id") == sys.argv[1]]
    print("absent" if not matches else (
        "deleting" if (matches[0].get("metadata") or {}).get("deletion_timestamp") else "active"
    ))
    ' "{{ _destroy_cluster.id }}"
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /root/.kube/config
  register: _destroy_cluster_state
  until: _destroy_cluster_state.rc == 0 and (_destroy_cluster_state.stdout | trim) in ['absent', 'deleting']
  retries: 5
  delay: 2
  changed_when: false
  when: _destroy_cluster.id | length > 0
