---
# Post-ClusterOrder agent setup for cluster-namespace mode (Option C).
#
# Included by create-caas (via include_role) immediately after
# ClusterOrder namespace discovery and before the readiness wait.
# Creates InfraEnv in that namespace, downloads the discovery ISO,
# boots VMs, waits for agents, and labels them.
# Does NOT approve agents — osac.service.cluster_infra ci_create
# owns approval in Option C.
#
# Requires:
#   caas_cluster_order_namespace  — set by create-caas
#   caas_discovery_vm_patterns    — from group_vars (VM name globs)
#   pull_secret_path              — credential path
#   ssh_public_key_path           — SSH public key path

# ── Rediscover VM names from patterns ─────────────────────────────
# discover-caas sets caas_discovery_vms via set_fact, but that fact
# does not survive across separate ansible-playbook invocations.
# Reconstruct the list from the same patterns so this role is
# self-contained.
- name: Find discovery VMs by pattern
  ansible.builtin.shell:
    cmd: set -o pipefail && virsh list --all --name | grep "{{ item }}"
    executable: /bin/bash
  register: _setup_vm_lookup
  changed_when: false
  failed_when: _setup_vm_lookup.rc != 0 or _setup_vm_lookup.stdout_lines | length == 0
  loop: "{{ caas_discovery_vm_patterns }}"
  loop_control:
    label: "pattern {{ ansible_loop.index0 }}"
    extended: true
  no_log: true

- name: Build VM name list
  ansible.builtin.set_fact:
    caas_discovery_vms: "{{ _setup_vm_lookup.results | map(attribute='stdout_lines') | map('first') | list }}"

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - caas_cluster_order_namespace is defined
      - caas_cluster_order_namespace | length > 0
      - caas_discovery_vms | length > 0
    fail_msg: >-
      setup-caas-agents requires caas_cluster_order_namespace (from
      create-caas) and at least one VM matching caas_discovery_vm_patterns.
      Found {{ caas_discovery_vms | default([]) | length }} VMs.

# ── InfraEnv in ClusterOrder namespace ──────────────────────────────

- name: Read pull secret
  ansible.builtin.slurp:
    src: "{{ pull_secret_path }}"
  register: _pull_secret
  no_log: true

- name: Read SSH public key
  ansible.builtin.slurp:
    src: "{{ ssh_public_key_path }}"
  register: _ssh_pub_key

- name: Ensure pull-secret exists in ClusterOrder namespace
  ansible.builtin.shell:
    cmd: >
      oc get secret pull-secret -n {{ caas_cluster_order_namespace }} ||
      oc create secret generic pull-secret -n {{ caas_cluster_order_namespace }}
      --from-literal=.dockerconfigjson='{{ _pull_secret.content | b64decode | trim }}'
      --type=kubernetes.io/dockerconfigjson
  environment:
    KUBECONFIG: /root/.kube/config
  no_log: true
  register: _pull_secret_result
  changed_when: "'created' in _pull_secret_result.stdout"
  until: _pull_secret_result.rc == 0
  retries: 10
  delay: 15

- name: Create InfraEnv CR in ClusterOrder namespace
  ansible.builtin.copy:
    content: |
      apiVersion: agent-install.openshift.io/v1beta1
      kind: InfraEnv
      metadata:
        name: {{ caas_discovery_infraenv_name }}
        namespace: {{ caas_cluster_order_namespace }}
      spec:
        osImageVersion: "{{ ocp_version }}"
        pullSecretRef:
          name: pull-secret
        sshAuthorizedKey: {{ _ssh_pub_key.content | b64decode | trim }}
        nmStateConfigLabelSelector:
          matchLabels: {}
    dest: /tmp/caas-infraenv-cluster-ns.yml
    mode: "0600"

- name: Delete existing InfraEnv in ClusterOrder namespace
  ansible.builtin.command:
    cmd: >-
      oc delete infraenv {{ caas_discovery_infraenv_name }}
      -n {{ caas_cluster_order_namespace }} --ignore-not-found
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: true

- name: Apply InfraEnv CR in ClusterOrder namespace
  ansible.builtin.command:
    cmd: oc apply -f /tmp/caas-infraenv-cluster-ns.yml
  environment:
    KUBECONFIG: /root/.kube/config
  register: _infraenv_apply
  changed_when: "'created' in _infraenv_apply.stdout or 'configured' in _infraenv_apply.stdout"
  until: _infraenv_apply.rc == 0
  retries: 10
  delay: 15

- name: Wait for discovery ISO URL
  ansible.builtin.shell:
    cmd: >-
      oc get infraenv {{ caas_discovery_infraenv_name }}
      -n {{ caas_cluster_order_namespace }}
      -o jsonpath='{.status.isoDownloadURL}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _iso_url
  until: _iso_url.stdout | length > 0
  retries: 60
  delay: 10
  changed_when: false
  no_log: true

# validate_certs: false — the ISO URL points to assisted-image-service
# behind the OCP cluster's ingress route. The route certificate is signed
# by the cluster's self-signed ingress CA, which is not in the Ansible
# controller's trust store. This matches every other cluster-facing
# get_url/uri call in infra/netris (see discover-caas, setup-caas, etc.).
- name: Download discovery ISO
  ansible.builtin.get_url:
    url: "{{ _iso_url.stdout }}"
    dest: /var/lib/libvirt/images/caas-discovery.iso
    mode: "0644"
    validate_certs: false
  register: _iso_download
  until: _iso_download is success
  retries: 30
  delay: 10
  no_log: true

# ── Boot discovery VMs ──────────────────────────────────────────────
# VMs were already prepared (sized, disks created) by discover-caas.
# Attach the ISO and start them.

- name: Check if discovery ISO is attached
  ansible.builtin.shell:
    cmd: set -o pipefail && virsh domblklist {{ item }} | grep -q 'caas-discovery.iso'
    executable: /bin/bash
  register: _iso_attached
  failed_when: false
  changed_when: false
  loop: "{{ caas_discovery_vms }}"
  loop_control:
    label: "vm {{ ansible_loop.index0 }}"
    extended: true
  no_log: true

- name: Attach discovery ISO as cdrom
  ansible.builtin.command:
    cmd: virsh attach-disk {{ item.item }} /var/lib/libvirt/images/caas-discovery.iso sda --type cdrom --config
  when: item.rc != 0
  loop: "{{ _iso_attached.results }}"
  loop_control:
    label: "vm {{ ansible_loop.index0 }}"
    extended: true
  changed_when: true
  no_log: true

- name: Set boot order to disk then cdrom
  ansible.builtin.command:
    cmd: virt-xml {{ item }} --edit --boot hd,cdrom
  loop: "{{ caas_discovery_vms }}"
  loop_control:
    label: "vm {{ ansible_loop.index0 }}"
    extended: true
  register: _boot_order
  changed_when: "'--boot' not in _boot_order.stderr | default('')"
  no_log: true

- name: Start discovery VMs
  ansible.builtin.command:
    cmd: virsh start {{ item }}
  loop: "{{ caas_discovery_vms }}"
  loop_control:
    label: "vm {{ ansible_loop.index0 }}"
    extended: true
  register: _vm_start
  failed_when: _vm_start.rc != 0 and 'already active' not in _vm_start.stderr
  changed_when: _vm_start.rc == 0
  no_log: true

- name: Report VMs booted for cluster-namespace agent registration
  ansible.builtin.debug:
    msg: >-
      {{ caas_discovery_vms | length }} VMs booted with discovery ISO
      for cluster-namespace agent registration

# ── Wait for agents + label (no approval) ──────────────────────────

- name: Wait for expected number of agents in ClusterOrder namespace
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      oc get agent -n {{ caas_cluster_order_namespace }}
      --no-headers 2>/dev/null | wc -l
    executable: /bin/bash
  environment:
    KUBECONFIG: /root/.kube/config
  register: _agent_count
  until: _agent_count.stdout | int >= caas_agents | length
  retries: 120
  delay: 15
  changed_when: false

- name: Get agent names in ClusterOrder namespace
  ansible.builtin.shell:
    cmd: >-
      oc get agent -n {{ caas_cluster_order_namespace }}
      -o jsonpath='{.items[*].metadata.name}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _agent_names
  changed_when: false
  until: _agent_names.rc == 0 and _agent_names.stdout | length > 0
  retries: 10
  delay: 15

- name: Set agent name list
  ansible.builtin.set_fact:
    caas_agent_names: "{{ _agent_names.stdout.split() }}"

- name: Get agent hostnames
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      oc get agent -n {{ caas_cluster_order_namespace }} -o json | python3 -c '
      import json, sys
      agents = json.load(sys.stdin).get("items") or []
      expected = {{ caas_agents | length }}
      if len(agents) < expected:
          raise SystemExit(f"only {len(agents)}/{expected} agents present")
      missing = [
          a["metadata"]["name"]
          for a in agents
          if not ((a.get("status") or {}).get("inventory") or {}).get("hostname")
      ]
      if missing:
          raise SystemExit("inventory hostname missing for: " + ",".join(missing))
      print(json.dumps({
          a["metadata"]["name"]: a["status"]["inventory"]["hostname"]
          for a in agents
      }))
      '
    executable: /bin/bash
  environment:
    KUBECONFIG: /root/.kube/config
  register: _agent_hostnames_raw
  until: _agent_hostnames_raw.rc == 0
  retries: 40
  delay: 15
  changed_when: false
  no_log: true

- name: Build agent-to-hostname map
  ansible.builtin.set_fact:
    _agent_hostname_map: "{{ _agent_hostnames_raw.stdout | from_json }}"
  no_log: true

- name: Build resource_class agent allow-list by hostname
  ansible.builtin.set_fact:
    _agents_for_resource_class: >-
      {{
        caas_agent_names
        if (caas_resource_class_hostnames | default([]) | length) == 0 else
        (
          _agent_hostname_map
          | dict2items
          | selectattr('value', 'in', caas_resource_class_hostnames)
          | map(attribute='key')
          | list
        )
      }}

- name: Label agent with resource class
  ansible.builtin.command:
    cmd: >-
      oc label agent/{{ item }} -n {{ caas_cluster_order_namespace }}
      osac.openshift.io/resource_class={{ caas_host_type_id }}
      --overwrite
  environment:
    KUBECONFIG: /root/.kube/config
  loop: "{{ _agents_for_resource_class }}"
  loop_control:
    label: "agent {{ ansible_loop.index0 }}"
    extended: true
  register: _label_rc
  changed_when: "'labeled' in _label_rc.stdout and 'not labeled' not in _label_rc.stdout"
  until: _label_rc.rc == 0
  retries: 5
  delay: 10

- name: Label agent with netris server name
  ansible.builtin.command:
    cmd: >-
      oc label agent/{{ item.key }} -n {{ caas_cluster_order_namespace }}
      netris.server/name={{ (caas_agents | selectattr('vm_pattern', 'search', item.value) | first).netris_server_name }}
      --overwrite
  environment:
    KUBECONFIG: /root/.kube/config
  loop: "{{ _agent_hostname_map | dict2items }}"
  loop_control:
    label: "agent {{ ansible_loop.index0 }}"
    extended: true
  register: _label_ns
  changed_when: "'labeled' in _label_ns.stdout and 'not labeled' not in _label_ns.stdout"
  until: _label_ns.rc == 0
  retries: 5
  delay: 10

- name: Report agents labeled in ClusterOrder namespace (no approval)
  ansible.builtin.debug:
    msg: >-
      {{ _agents_for_resource_class | length }} agents labeled with
      resource_class={{ caas_host_type_id }} in the ClusterOrder
      namespace. Approval is owned by osac.service.cluster_infra
      ci_create.
