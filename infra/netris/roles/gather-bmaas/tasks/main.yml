---
- name: Set gather directory
  ansible.builtin.set_fact:
    _gather_dir: "{{ lookup('env', 'ARTIFACT_DIR') | default(playbook_dir + '/../logs', true) }}"

- name: Create gather subdirectory
  ansible.builtin.file:
    path: "{{ _gather_dir }}/mgmt-cluster/bmaas"
    state: directory
    mode: "0755"

# Without the last-applied annotation and with the BMC Secret name replaced: the redaction pass otherwise
# matches inside those lines and leaves YAML that does not parse. The name is not a secret, only noise.
- name: Gather BMH status
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      oc get bmh -n {{ bmaas_bmh_namespace }} -o json
      | python3 -c 'import json, sys;
      d = json.load(sys.stdin);
      [(h["metadata"].get("annotations", {}).pop("kubectl.kubernetes.io/last-applied-configuration", None),
      h.get("spec", {}).get("bmc", {}).update(credentialsName="<bmc-secret>") if h.get("spec", {}).get("bmc") else None)
      for h in d.get("items", [])];
      json.dump(d, sys.stdout, indent=1)'
      > {{ _gather_dir }}/mgmt-cluster/bmaas/bmh-status.json
    executable: /bin/bash
  environment:
    KUBECONFIG: /root/.kube/config
  failed_when: false
  changed_when: false

- name: Gather BareMetalInstance CRs
  ansible.builtin.shell:
    cmd: oc get baremetalinstances -A -o yaml > {{ _gather_dir }}/mgmt-cluster/bmaas/baremetalinstances.yaml
  environment:
    KUBECONFIG: /root/.kube/config
  failed_when: false
  changed_when: false

- name: Gather Ironic pod logs
  ansible.builtin.shell:
    cmd: >-
      oc logs -n openshift-machine-api
      -l baremetal.openshift.io/cluster-baremetal-operator=metal3-state
      --all-containers --timestamps --since=4h --tail=40000
      > {{ _gather_dir }}/mgmt-cluster/bmaas/ironic-logs.txt 2>&1
  environment:
    KUBECONFIG: /root/.kube/config
  failed_when: false
  changed_when: false

- name: Gather BMF operator logs
  ansible.builtin.shell:
    cmd: >-
      oc logs -n {{ osac_namespace }}
      -l app.kubernetes.io/name=bmf
      --all-containers --timestamps --tail=100000
      > {{ _gather_dir }}/mgmt-cluster/bmaas/bmf-operator-logs.txt 2>&1
  environment:
    KUBECONFIG: /root/.kube/config
  failed_when: false
  changed_when: false

- name: Gather sushy-tools logs
  ansible.builtin.shell:
    cmd: cp {{ sushy_tools_config_dir }}/sushy.log {{ _gather_dir }}/mgmt-cluster/bmaas/sushy-tools.log 2>/dev/null || true
  failed_when: false
  changed_when: false

- name: Gather fulfillment BMI data
  ansible.builtin.shell:
    cmd: |
      TOKEN=$(oc create token -n {{ osac_namespace }} admin 2>/dev/null)
      HOST=$(oc get route fulfillment-internal-api -n {{ osac_namespace }} -o jsonpath='{.status.ingress[0].host}' 2>/dev/null)
      if [ -n "$TOKEN" ] && [ -n "$HOST" ]; then
        curl -sk -H "Authorization: Bearer $TOKEN" "https://${HOST}/api/private/v1/bare_metal_instance_types" > {{ _gather_dir }}/mgmt-cluster/bmaas/bmi-instance-types.json 2>/dev/null
        curl -sk -H "Authorization: Bearer $TOKEN" "https://${HOST}/api/private/v1/baremetal_instance_templates" > {{ _gather_dir }}/mgmt-cluster/bmaas/bmi-templates.json 2>/dev/null
        curl -sk -H "Authorization: Bearer $TOKEN" "https://${HOST}/api/private/v1/baremetal_instance_catalog_items" > {{ _gather_dir }}/mgmt-cluster/bmaas/bmi-catalog-items.json 2>/dev/null
        curl -sk -H "Authorization: Bearer $TOKEN" "https://${HOST}/api/private/v1/baremetal_instances" | python3 -c 'import sys,json; d=json.load(sys.stdin); [i.pop("template_parameters",None) for i in d.get("items",[])]; json.dump(d,sys.stdout,indent=2)' > {{ _gather_dir }}/mgmt-cluster/bmaas/bmi-instances.json 2>/dev/null
      fi
  environment:
    KUBECONFIG: /root/.kube/config
  failed_when: false
  changed_when: false
