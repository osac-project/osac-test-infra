---
- name: Load netris-lab variables
  ansible.builtin.include_vars:
    file: "{{ netris_lab_dir }}/group_vars/all.yml"

- name: Pre-flight checks
  ansible.builtin.include_tasks: "{{ role_path }}/../deploy-infra/tasks/preflight.yml"

- name: Remove stale collections left by rsync
  ansible.builtin.file:
    path: "{{ netris_lab_dir }}/collections/ansible_collections"
    state: absent

- name: Install Ansible collections
  ansible.builtin.command:
    cmd: ansible-galaxy collection install -r requirements.yml -p collections --force
    chdir: "{{ netris_lab_dir }}"
  changed_when: false

# Local BM install (no deploy-jump): same bootstrap as scripts/deploy-jump.sh.
# ansible-core / ansible must already be present to run this playbook; the rest
# is filled in here so `make setup` works after a minimal host bootstrap.
- name: Install BM bootstrap packages
  ansible.builtin.dnf:
    name:
      - git
      - make
      - ansible-core
      - python3-pip
      - sshpass
      - tmux
      - policycoreutils-python-utils
    state: present

# RHEL has no epel-release in base repos; netris-lab prerequisites does
# `dnf install epel-release` which fails without this URL install first.
- name: Pre-install EPEL from URL (RHEL has no epel-release in base repos)
  ansible.builtin.shell:
    cmd: |
      if rpm -q epel-release &>/dev/null; then
        echo "already_installed"
      else
        dnf install -y "https://dl.fedoraproject.org/pub/epel/epel-release-latest-$(rpm -E %rhel).noarch.rpm"
        echo "installed"
      fi
  register: _epel_install
  changed_when: "'installed' == _epel_install.stdout | trim"
  when: ansible_os_family == "RedHat"

- name: Run prerequisites
  ansible.builtin.include_role:
    name: prerequisites

# kubernetes.core.k8s (caas_setup) needs the Python kubernetes client; not installed by
# netris-lab prerequisites (only bcrypt/netaddr).
- name: Install Python kubernetes client
  ansible.builtin.pip:
    name: kubernetes
    state: present

# netris-lab's own prerequisites role drags in an openssl-libs upgrade as a
# side effect of its package installs, and that OpenSSL version breaks
# Python's ssl.SSLContext.load_verify_locations(cadata=...) bytes-based
# multi-certificate loading path -- the exact path ansible.builtin.get_url
# always uses for CA validation, breaking both downloads in the vendored
# cache role's very next task.
#
# Two other fixes were rejected: excluding openssl-libs from dnf entirely
# breaks installing libvirt/qemu-kvm (systemd-container, required by
# libvirt-daemon-driver-qemu, hard-requires a systemd build that itself
# requires libcrypto.so.3(OPENSSL_3.4.0)); disabling get_url's
# validate_certs was rejected as an unnecessary security trade-off.
#
# Sidestep get_url's broken code path entirely instead: pre-fetch both
# files ourselves via curl (unaffected by this bug -- never goes through
# Python's cadata-based loading), then inject a matching checksum via
# module_defaults (see playbooks/setup.yml) so the vendored cache role's
# own get_url task takes its "file already exists" shortcut and exits
# before ever calling url_get()/open_url()/make_context(). Full certificate
# validation is preserved throughout (curl does its own TLS validation
# normally); nothing here weakens security.
- name: Ensure cloud image cache directory exists
  ansible.builtin.file:
    path: "{{ k3s_image_cache_dir }}/../cloud-images"
    state: directory
    mode: '0755'

# Bypasses get_url's broken CA-cert loading — see comment above
- name: Pre-fetch cloud images via curl
  ansible.builtin.command:
    cmd: >-
      curl -fSL --retry 5 --retry-delay 5
      -o "{{ k3s_image_cache_dir }}/../cloud-images/{{ item.name }}"
      "{{ item.url }}"
    creates: "{{ k3s_image_cache_dir }}/../cloud-images/{{ item.name }}"
  loop:
    - { url: "{{ cumulus_image_url }}", name: "{{ cumulus_image_name }}" }
    - { url: "{{ ubuntu_image_url }}", name: "{{ ubuntu_image_name }}" }

- name: Compute checksums of pre-fetched cloud images
  ansible.builtin.stat:
    path: "{{ k3s_image_cache_dir }}/../cloud-images/{{ item }}"
    checksum_algorithm: sha256
  loop:
    - "{{ cumulus_image_name }}"
    - "{{ ubuntu_image_name }}"
  register: _cloud_image_stats

- name: Record checksums for get_url's module_defaults shortcut
  ansible.builtin.set_fact:
    cache_role_checksums: "{{ cache_role_checksums | default({}) | combine({item.item: 'sha256:' + item.stat.checksum}) }}"
  loop: "{{ _cloud_image_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Cache container and cloud images
  ansible.builtin.include_role:
    name: cache

- name: Install OCP and OSAC dependencies
  ansible.builtin.dnf:
    name:
      - podman
      - dnsmasq
      - zstd
      - pigz
    state: present

- name: Install awscli
  ansible.builtin.pip:
    name:
      - awscli
    state: present

- name: Install oc CLI
  ansible.builtin.shell:
    cmd: |
      curl -fsSL https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/stable/openshift-client-linux.tar.gz \
        | tar xzf - -C /usr/local/bin oc kubectl
    creates: /usr/local/bin/oc

- name: Install helm
  ansible.builtin.command:
    cmd: bash -c "curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash"
    creates: /usr/local/bin/helm

- name: Install Go toolchain
  ansible.builtin.shell:
    cmd: |
      curl -fsSL https://go.dev/dl/go1.24.4.linux-amd64.tar.gz \
        | tar xzf - -C /usr/local
    creates: /usr/local/go/bin/go

# Job-scoped, non-root checkout: this role only ever runs on a freshly
# provisioned, single-job EC2 instance (e2e-caas-netris.yml's "test" job),
# so there's no actual concurrent-job interference on /opt today -- but
# root-owning the source tree contradicts the rest of this change (job-
# scoped, non-root osac tooling), and a non-root build step reading from a
# root-owned checkout is an assumption, not something to keep relying on.
#
# lookup('env', 'HOME'), not ansible_env.HOME: this play sets gather_facts:
# true + become: true, and Ansible's implicit fact-gathering task inherits
# that become setting -- so ansible_env reflects root's environment
# (HOME=/root), not the unprivileged connecting user's. lookup() evaluates
# in the controller process's own environment instead (the same
# unprivileged process ansible-playbook itself was invoked from), which is
# correct here since ansible_connection: local makes controller and target
# the same machine.
- name: Clone osac
  ansible.builtin.git:
    repo: "{{ osac_repo }}"
    dest: "{{ lookup('env', 'HOME') }}/.local/src/osac"
    version: "{{ osac_branch }}"
    force: true
  become: false

- name: Ensure non-root install directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/bin"
    state: directory
    mode: "0755"
  become: false

- name: Build osac CLI
  ansible.builtin.command:
    cmd: /usr/local/go/bin/go build -o "{{ lookup('env', 'HOME') }}/.local/bin/osac" ./fulfillment-service/cmd/osac
    chdir: "{{ lookup('env', 'HOME') }}/.local/src/osac"
  # No creates: guard -- always rebuild so a different osac_branch
  # actually takes effect instead of reusing whatever was built first.
  become: false
  environment:
    GOPATH: "{{ lookup('env', 'HOME') }}/go"
    GOCACHE: "{{ lookup('env', 'HOME') }}/.cache/go-build"

- name: Cache snapshot flavor image
  ansible.builtin.include_role:
    name: cache-snapshot
