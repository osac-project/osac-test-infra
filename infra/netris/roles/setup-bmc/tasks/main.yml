---
# Shared lab infrastructure: BMC network + sushy-tools BMC emulator.
# Creates a dedicated libvirt network (bmc-net) for Ironic ↔ sushy-tools
# communication, avoiding the br-mgmt VPN route conflict.

# ── Phase 1: BMC network ─────────────────────────────────────────────

- name: Enable libvirt modular daemon sockets
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - virtqemud.socket
    - virtstoraged.socket
    - virtnetworkd.socket

- name: Check if bmc-net exists
  ansible.builtin.command:
    cmd: virsh net-info {{ bmc_net_name }}
  register: _bmc_net_check
  failed_when: false
  changed_when: false

- name: Get OCP VM MAC on bmc-net (if already attached)
  ansible.builtin.shell:
    cmd: virsh domiflist {{ ocp_vm_name_pattern }} | grep {{ bmc_net_name }} | awk '{print $5}'
  register: _ocp_bmc_mac_existing
  failed_when: false
  changed_when: false
  when: _bmc_net_check.rc == 0

- name: Create bmc-net libvirt network
  when: _bmc_net_check.rc != 0
  block:
    - name: Write bmc-net XML
      ansible.builtin.copy:
        content: |
          <network>
            <name>{{ bmc_net_name }}</name>
            <bridge name="{{ bmc_net_bridge }}"/>
            <ip address="{{ bmc_net_host_ip }}" netmask="255.255.255.0">
              <dhcp>
                <range start="{{ bmc_net_dhcp_start }}" end="{{ bmc_net_dhcp_end }}"/>
              </dhcp>
            </ip>
          </network>
        dest: /tmp/bmc-net.xml
        mode: "0644"

    - name: Define bmc-net
      ansible.builtin.command:
        cmd: virsh net-define /tmp/bmc-net.xml

    - name: Start bmc-net
      ansible.builtin.command:
        cmd: virsh net-start {{ bmc_net_name }}

    - name: Autostart bmc-net
      ansible.builtin.command:
        cmd: virsh net-autostart {{ bmc_net_name }}

- name: Attach bmc-net NIC to OCP VM
  when: _bmc_net_check.rc != 0 or (_ocp_bmc_mac_existing.stdout | default('') | trim) == ''
  block:
    - name: Attach NIC
      ansible.builtin.command:
        cmd: >-
          virsh attach-interface {{ ocp_vm_name_pattern }}
          network {{ bmc_net_name }} --model virtio --live --config

    - name: Get new NIC MAC
      ansible.builtin.shell:
        cmd: virsh domiflist {{ ocp_vm_name_pattern }} | grep {{ bmc_net_name }} | awk '{print $5}'
      register: _ocp_bmc_mac_new
      until: _ocp_bmc_mac_new.stdout | trim | length > 0
      retries: 5
      delay: 3

    - name: Add static DHCP reservation for OCP VM
      ansible.builtin.shell:
        cmd: >-
          virsh net-update {{ bmc_net_name }} add ip-dhcp-host
          '<host mac="{{ _ocp_bmc_mac_new.stdout | trim }}" ip="{{ bmc_net_ocp_ip }}"/>'
          --live --config

    - name: Reconnect OCP NIC to pick up static lease
      ansible.builtin.shell:
        cmd: |
          MAC="{{ _ocp_bmc_mac_new.stdout | trim }}"
          virsh detach-interface {{ ocp_vm_name_pattern }} network --mac $MAC --live 2>/dev/null || true
          sleep 2
          virsh attach-interface {{ ocp_vm_name_pattern }} network {{ bmc_net_name }} --model virtio --mac $MAC --live --config

- name: Wait for OCP VM to get bmc-net IP
  ansible.builtin.shell:
    cmd: virsh net-dhcp-leases {{ bmc_net_name }} | grep {{ bmc_net_ocp_ip }}
  register: _bmc_lease
  until: _bmc_lease.rc == 0
  retries: 30
  delay: 5
  changed_when: false

# ── Phase 2: sushy-tools ─────────────────────────────────────────────

- name: Install sushy-tools and libvirt-python
  ansible.builtin.pip:
    name:
      - sushy-tools
      - libvirt-python
    state: present

- name: Create sushy-tools disk directory
  ansible.builtin.file:
    path: "{{ sushy_tools_disk_dir }}"
    state: directory
    mode: "0777"

- name: Check if libvirt storage pool exists
  ansible.builtin.shell:
    cmd: virsh pool-info {{ sushy_tools_storage_pool }} 2>/dev/null
  register: _pool_check
  failed_when: false
  changed_when: false

- name: Define libvirt storage pool
  ansible.builtin.command:
    cmd: virsh pool-define-as {{ sushy_tools_storage_pool }} dir --target {{ sushy_tools_disk_dir }}
  when: _pool_check.rc != 0

- name: Start libvirt storage pool
  ansible.builtin.command:
    cmd: virsh pool-start {{ sushy_tools_storage_pool }}
  when: _pool_check.rc != 0
  register: _pool_start
  failed_when: _pool_start.rc != 0 and 'already active' not in _pool_start.stderr

- name: Detect OVMF firmware path
  ansible.builtin.stat:
    path: "{{ item }}"
  register: _ovmf_check
  loop:
    - /usr/share/OVMF/OVMF_CODE.secboot.fd
    - /usr/share/edk2/ovmf/OVMF_CODE.secboot.fd
    - /usr/share/OVMF/OVMF_CODE.fd
    - /usr/share/edk2/ovmf/OVMF_CODE.fd

- name: Set OVMF firmware path
  ansible.builtin.set_fact:
    _ovmf_code_path: "{{ (_ovmf_check.results | selectattr('stat.exists') | first).item }}"

- name: Create sushy-tools config directory
  ansible.builtin.file:
    path: "{{ sushy_tools_config_dir }}"
    state: directory
    mode: "0755"

- name: Write sushy-tools config
  ansible.builtin.copy:
    content: |
      SUSHY_EMULATOR_LISTEN_IP = "{{ sushy_tools_ip }}"
      SUSHY_EMULATOR_LISTEN_PORT = {{ sushy_tools_port }}
      SUSHY_EMULATOR_SSL_CERT = None
      SUSHY_EMULATOR_SSL_KEY = None
      SUSHY_EMULATOR_LIBVIRT_URI = "qemu:///system"
      SUSHY_EMULATOR_IGNORE_BOOT_DEVICE = False
      SUSHY_EMULATOR_STORAGE_POOL = "{{ sushy_tools_storage_pool }}"
      SUSHY_EMULATOR_BOOT_LOADER_MAP = {
          "UEFI": {
              "x86_64": "{{ _ovmf_code_path }}"
          },
          "Legacy": {
              "x86_64": None
          }
      }
    dest: "{{ sushy_tools_config_dir }}/sushy-emulator.conf"
    mode: "0644"
  register: _sushy_config

- name: Check if sushy-emulator is already running
  ansible.builtin.shell:
    cmd: pgrep -f sushy-emulator
  register: _sushy_running
  failed_when: false
  changed_when: false

- name: Stop existing sushy-emulator if config changed
  ansible.builtin.shell:
    cmd: pkill -f sushy-emulator || true
  when: _sushy_config is changed and _sushy_running.rc == 0

- name: Start sushy-emulator
  ansible.builtin.shell:
    cmd: |
      nohup sushy-emulator --config {{ sushy_tools_config_dir }}/sushy-emulator.conf \
        > {{ sushy_tools_config_dir }}/sushy.log 2>&1 &
      echo $!
  register: _sushy_start
  when: _sushy_running.rc != 0 or _sushy_config is changed

- name: Wait for sushy-emulator to respond
  ansible.builtin.uri:
    url: "http://{{ sushy_tools_ip }}:{{ sushy_tools_port }}/redfish/v1/"
    method: GET
    status_code: 200
  register: _sushy_health
  until: _sushy_health.status == 200
  retries: 15
  delay: 2

- name: Report setup-bmc status
  ansible.builtin.debug:
    msg: >-
      setup-bmc complete: {{ bmc_net_name }} ({{ bmc_net_bridge }}) with OCP at {{ bmc_net_ocp_ip }},
      sushy-tools on {{ sushy_tools_ip }}:{{ sushy_tools_port }}
