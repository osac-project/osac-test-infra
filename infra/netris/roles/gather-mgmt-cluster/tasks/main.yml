---
- name: Detect effective OSAC namespace
  ansible.builtin.shell:
    cmd: oc get namespace {{ snapshot_osac_namespace }} >/dev/null 2>&1 && echo {{ snapshot_osac_namespace }} || echo {{ osac_namespace }}
  environment:
    KUBECONFIG: /root/.kube/config
  register: _detected_osac_ns
  changed_when: false
  failed_when: false

- name: Set effective OSAC namespace
  ansible.builtin.set_fact:
    _osac_namespace: "{{ _detected_osac_ns.stdout | default(osac_namespace) }}"

- name: Set management cluster diagnostic namespaces
  ansible.builtin.set_fact:
    _diagnostic_namespaces: >-
      {{ [
        _osac_namespace | default('osac-e2e-ci', true),
        bmaas_bmh_namespace | default('host-inventory'),
        caas_agent_namespace | default('hardware-inventory'),
        'keycloak',
        'ansible-aap',
        'osac-operators',
        'osac-prereqs',
        'osac-kafka',
        'multicluster-engine',
        'cert-manager',
        'cert-manager-operator',
        'metallb-system',
        'openshift-cnv',
        'openshift-machine-api',
        'openshift-marketplace',
        'openshift-operators',
        'openshift-operators-redhat',
        'openshift-storage'
      ] | unique | list }}

- name: Create mgmt-cluster gather subdirectories
  ansible.builtin.file:
    path: "{{ _gather_dir }}/mgmt-cluster/{{ item }}"
    state: directory
    mode: "0755"
  failed_when: false
  loop:
    - node

# ── SNO VM node-level diagnostics (via SSH) ──
- name: Set SNO VM SSH command
  ansible.builtin.set_fact:
    _sno_ssh: "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i {{ snapshot_flavor_dir }}/crypto/cluster-tool.key core@{{ ocp_dnat_ip }}"

- name: Gather kubelet journal from SNO VM
  ansible.builtin.shell: "{{ _sno_ssh }} 'sudo journalctl -u kubelet --no-pager -n 200' > {{ _gather_dir }}/mgmt-cluster/node/kubelet-journal 2>&1 || echo 'SSH unreachable' > {{ _gather_dir }}/mgmt-cluster/node/kubelet-journal"
  changed_when: false
  failed_when: false

- name: Gather crio journal from SNO VM
  ansible.builtin.shell: "{{ _sno_ssh }} 'sudo journalctl -u crio --no-pager -n 200' > {{ _gather_dir }}/mgmt-cluster/node/crio-journal 2>&1 || echo 'SSH unreachable' > {{ _gather_dir }}/mgmt-cluster/node/crio-journal"
  changed_when: false
  failed_when: false

- name: Gather boot-time service status from SNO VM
  ansible.builtin.shell: |
    {{ _sno_ssh }} '
      for svc in snapshot-recert ovs-configuration nodeip-configuration NetworkManager; do
        echo "=== $svc ==="
        sudo systemctl status "$svc" --no-pager 2>&1
        echo
      done
    ' > {{ _gather_dir }}/mgmt-cluster/node/boot-services 2>&1 || echo 'SSH unreachable' > {{ _gather_dir }}/mgmt-cluster/node/boot-services
  changed_when: false
  failed_when: false

- name: Gather snapshot-recert service journal from SNO VM
  ansible.builtin.shell: "{{ _sno_ssh }} 'sudo journalctl -u snapshot-recert.service --no-pager' > {{ _gather_dir }}/mgmt-cluster/node/snapshot-recert-journal 2>&1 || echo 'SSH unreachable' > {{ _gather_dir }}/mgmt-cluster/node/snapshot-recert-journal"
  changed_when: false
  failed_when: false

- name: Gather snapshot-recert markers from SNO VM
  ansible.builtin.shell: "{{ _sno_ssh }} 'ls -la /var/lib/snapshot-recert/markers/ 2>&1 || echo \"(no markers)\"' > {{ _gather_dir }}/mgmt-cluster/node/snapshot-recert-markers 2>&1 || echo 'SSH unreachable' > {{ _gather_dir }}/mgmt-cluster/node/snapshot-recert-markers"
  changed_when: false
  failed_when: false

- name: Gather recert summary from SNO VM
  ansible.builtin.shell: |
    {{ _sno_ssh }} 'sudo cat /var/tmp/recert-summary.yaml 2>/dev/null || echo "(not found)"' \
      | sed -E \
        -e '/BEGIN (RSA |EC )?PRIVATE KEY/,/END (RSA |EC )?PRIVATE KEY/c\<PRIVATE KEY REDACTED>' \
        -e 's/("\.dockerconfigjson"|"pull-secret"|"password"|"token"|"secret"):[[:space:]]*"[^"]*"/\1: "<REDACTED>"/g' \
      > {{ _gather_dir }}/mgmt-cluster/node/recert-summary 2>&1 || echo 'SSH unreachable' > {{ _gather_dir }}/mgmt-cluster/node/recert-summary
  changed_when: false
  failed_when: false

- name: Gather crictl pods from SNO VM
  ansible.builtin.shell: "{{ _sno_ssh }} 'sudo crictl pods' > {{ _gather_dir }}/mgmt-cluster/node/crictl-pods 2>&1 || echo 'SSH unreachable' > {{ _gather_dir }}/mgmt-cluster/node/crictl-pods"
  changed_when: false
  failed_when: false

- name: Gather crictl containers from SNO VM
  ansible.builtin.shell: "{{ _sno_ssh }} 'sudo crictl ps -a' > {{ _gather_dir }}/mgmt-cluster/node/crictl-containers 2>&1 || echo 'SSH unreachable' > {{ _gather_dir }}/mgmt-cluster/node/crictl-containers"
  changed_when: false
  failed_when: false

- name: Gather systemd failed units from SNO VM
  ansible.builtin.shell: "{{ _sno_ssh }} 'sudo systemctl --failed --no-pager' > {{ _gather_dir }}/mgmt-cluster/node/failed-units 2>&1 || echo 'SSH unreachable' > {{ _gather_dir }}/mgmt-cluster/node/failed-units"
  changed_when: false
  failed_when: false

# ── Management cluster must-gather + inspect ──
- name: Run oc adm must-gather on management cluster
  ansible.builtin.shell: |
    oc adm must-gather \
      --dest-dir={{ _gather_dir }}/mgmt-cluster/must-gather \
      2>&1 || echo "must-gather failed or cluster unreachable"
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: false
  failed_when: false

- name: Run oc adm inspect on diagnostic namespaces
  ansible.builtin.shell: |
    oc adm inspect \
      {% for namespace in _diagnostic_namespaces %}
      ns/{{ namespace }} \
      {% endfor %}
      --dest-dir={{ _gather_dir }}/mgmt-cluster/inspect \
      2>&1 || echo "inspect failed or cluster unreachable"
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: false
  failed_when: false

- name: Create namespace log directory
  ansible.builtin.file:
    path: "{{ _gather_dir }}/mgmt-cluster/namespaces"
    state: directory
    mode: "0755"
  failed_when: false

- name: Gather management cluster namespace resources
  ansible.builtin.shell: |
    base="{{ _gather_dir }}/mgmt-cluster/namespaces"
    for ns in {% for namespace in _diagnostic_namespaces %}{{ namespace }} {% endfor %}; do
      if ! oc get namespace "$ns" >/dev/null 2>&1; then
        continue
      fi
      out="$base/$ns"
      mkdir -p "$out"
      oc get pods -n "$ns" -o wide > "$out/pods.txt" 2>&1 || true
      oc get events -n "$ns" --sort-by=.lastTimestamp > "$out/events.txt" 2>&1 || true
      oc describe pods -n "$ns" > "$out/pods-describe.txt" 2>&1 || true
      oc get deployments -n "$ns" -o wide > "$out/deployments.txt" 2>&1 || true
      oc get jobs -n "$ns" -o wide > "$out/jobs.txt" 2>&1 || true
      oc get statefulsets -n "$ns" -o wide > "$out/statefulsets.txt" 2>&1 || true
      oc get daemonsets -n "$ns" -o wide > "$out/daemonsets.txt" 2>&1 || true
    done
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: false
  failed_when: false

- name: Gather management cluster namespace pod logs
  ansible.builtin.shell: |
    base="{{ _gather_dir }}/mgmt-cluster/namespaces"

    collect_logs() {
      local pod="$1"
      local container="$2"
      local prefix="$3"
      oc logs "$pod" -n "$ns" -c "$container" --timestamps --tail=5000 \
        > "$out/${pod}-${prefix}-${container}.log" 2>&1 || true
      oc logs "$pod" -n "$ns" -c "$container" --previous --timestamps --tail=5000 \
        > "$out/${pod}-${prefix}-${container}-previous.log" 2>&1 || true
    }

    for ns in {% for namespace in _diagnostic_namespaces %}{{ namespace }} {% endfor %}; do
      if ! oc get namespace "$ns" >/dev/null 2>&1; then
        continue
      fi
      out="$base/$ns/pods"
      mkdir -p "$out"
      for pod in $(oc get pods -n "$ns" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
        for container in $(oc get pod "$pod" -n "$ns" -o jsonpath='{.spec.containers[*].name}' 2>/dev/null); do
          collect_logs "$pod" "$container" app
        done
        for container in $(oc get pod "$pod" -n "$ns" -o jsonpath='{.spec.initContainers[*].name}' 2>/dev/null); do
          collect_logs "$pod" "$container" init
        done
      done
    done
  environment:
    KUBECONFIG: /root/.kube/config
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
