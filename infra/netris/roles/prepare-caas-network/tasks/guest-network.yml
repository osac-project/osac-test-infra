---
# Keep guest OVN host routing for ingress on the secondary worker network.
- name: Wait for this cluster's OSAC order
  kubernetes.core.k8s_info:
    kubeconfig: /root/.kube/config
    api_version: osac.openshift.io/v1alpha1
    kind: ClusterOrder
    namespace: "{{ osac_namespace }}"
    label_selectors:
      - "osac.openshift.io/clusterorder-uuid={{ caas_cluster_id }}"
  register: _caas_network_order
  until: _caas_network_order.resources | length == 1
  retries: 60
  delay: 5

- name: Set the cluster's order name
  ansible.builtin.set_fact:
    _caas_network_order_name: "{{ _caas_network_order.resources[0].metadata.name }}"

- name: Wait for this order's HostedCluster
  kubernetes.core.k8s_info:
    kubeconfig: /root/.kube/config
    api_version: hypershift.openshift.io/v1beta1
    kind: HostedCluster
  register: _caas_network_hosted_clusters
  until: >-
    (_caas_network_hosted_clusters.resources | default([])
     | selectattr('metadata.name', 'equalto', _caas_network_order_name) | list | length) == 1
  retries: 60
  delay: 5

- name: Set this cluster's HostedCluster namespace
  ansible.builtin.set_fact:
    _caas_network_hc_namespace: >-
      {{ (_caas_network_hosted_clusters.resources
          | selectattr('metadata.name', 'equalto', _caas_network_order_name)
          | first).metadata.namespace }}

- name: Create temporary guest kubeconfig path
  ansible.builtin.tempfile:
    state: file
    prefix: caas-network-
    suffix: .kubeconfig
  register: _caas_network_kubeconfig
  no_log: true

- name: Configure the hosted cluster guest network
  block:
    - name: Wait for this HostedCluster's admin kubeconfig
      ansible.builtin.shell: |
        set -euo pipefail
        oc get secret admin-kubeconfig \
          -n "{{ _caas_network_hc_namespace }}-{{ _caas_network_order_name }}" \
          -o jsonpath='{.data.kubeconfig}' \
          | base64 -d > "{{ _caas_network_kubeconfig.path }}"
        test -s "{{ _caas_network_kubeconfig.path }}"
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /root/.kube/config
      register: _caas_network_kubeconfig_result
      until: _caas_network_kubeconfig_result.rc == 0
      retries: 60
      delay: 10
      changed_when: false
      no_log: true

    - name: Wait for the guest Network operator configuration
      ansible.builtin.command:
        argv:
          - oc
          - --kubeconfig
          - "{{ _caas_network_kubeconfig.path }}"
          - --request-timeout=10s
          - get
          - network.operator.openshift.io
          - cluster
          - -o
          - json
      register: _caas_network_guest_network
      until: _caas_network_guest_network.rc == 0
      retries: 60
      delay: 10
      changed_when: false

    - name: Restore default guest OVN egress routing when previously changed
      ansible.builtin.command: >-
        oc --kubeconfig {{ _caas_network_kubeconfig.path | quote }}
        patch network.operator.openshift.io cluster --type=merge
        -p '{"spec":{"defaultNetwork":{"ovnKubernetesConfig":{"gatewayConfig":{"routingViaHost":false}}}}}'
      when: >-
        (_caas_network_guest_network.stdout | from_json).get('spec', {})
        .get('defaultNetwork', {}).get('ovnKubernetesConfig', {})
        .get('gatewayConfig', {}).get('routingViaHost', false) | bool

    - name: Wait for the guest Network ClusterOperator to become healthy
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _caas_network_kubeconfig.path }}"
        api_version: config.openshift.io/v1
        kind: ClusterOperator
        name: network
      register: _caas_network_network_co
      until: >-
        (_caas_network_network_co.resources | default([]) | length == 1)
        and ((_caas_network_network_co.resources[0].status.conditions | default([])
              | selectattr('type', 'equalto', 'Available') | map(attribute='status')
              | first | default('False')) == 'True')
        and ((_caas_network_network_co.resources[0].status.conditions | default([])
              | selectattr('type', 'equalto', 'Degraded') | map(attribute='status')
              | first | default('True')) == 'False')
      retries: 80
      delay: 15
  always:
    - name: Remove temporary guest kubeconfig
      ansible.builtin.file:
        path: "{{ _caas_network_kubeconfig.path }}"
        state: absent
      no_log: true
