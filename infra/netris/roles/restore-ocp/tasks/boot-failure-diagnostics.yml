---
- name: Set OCP boot-failure diagnostics directory
  ansible.builtin.set_fact:
    _ocp_boot_failure_diag_dir: "{{ playbook_dir }}/../logs/ocp-boot-failure"

- name: Create OCP boot-failure diagnostics directory
  ansible.builtin.file:
    path: "{{ _ocp_boot_failure_diag_dir }}"
    state: directory
    mode: "0755"
  failed_when: false

- name: Record OCP boot-failure target details
  ansible.builtin.copy:
    dest: "{{ _ocp_boot_failure_diag_dir }}/target.txt"
    mode: "0644"
    content: |
      VM: {{ ocp_vm_name }}
      Selected SSH target: {{ _vm_ssh_ip | default('not selected') }}
      Selected SSH transport: {{ _vm_ssh_transport | default('not selected') }}
      Management interface: {{ caas_netris_mgmt_interface | default('ens4') }}
      Management bridge: {{ mgmt_bridge_name | default('br-mgmt') }}
      SSH fallback DNAT address: {{ ocp_dnat_ip }}
      Configured OCP node address: {{ ocp_node_ip }}
      Boot-time interfaces configured by this role: ens6 (default route) + {{ caas_netris_mgmt_interface | default('ens4') }} (address only, no default route)
      Runtime OCP external bridge to inspect: br-ex
      Expected guest default gateway: {{ ocp_gateway | ansible.utils.ipaddr('address') }}
  failed_when: false

- name: Save management-network SSH probe result
  ansible.builtin.copy:
    dest: "{{ _ocp_boot_failure_diag_dir }}/management-ssh-probe.txt"
    mode: "0644"
    content: |
      Interface: {{ caas_netris_mgmt_interface | default('ens4') }}
      Return code: {{ _mgmt_ssh_check.rc | default('unknown') }}
      Discovered address (if reachable): {{ _mgmt_ssh_check.stdout | default('') | trim }}
      Standard error:
      {{ _mgmt_ssh_check.stderr | default('') }}
  when: _mgmt_ssh_check is defined
  failed_when: false

- name: Save the latest SSH probe result
  ansible.builtin.copy:
    dest: "{{ _ocp_boot_failure_diag_dir }}/ssh-probe.txt"
    mode: "0644"
    content: |
      Attempts: {{ _ssh_check.attempts | default('unknown') }}
      Return code: {{ _ssh_check.rc | default('unknown') }}
      Message: {{ _ssh_check.msg | default('') }}
      Standard output:
      {{ _ssh_check.stdout | default('') }}
      Standard error:
      {{ _ssh_check.stderr | default('') }}
  failed_when: false

- name: Capture OCP VM libvirt state and interfaces
  ansible.builtin.shell:
    cmd: |
      set +e
      {
        echo "=== Captured at ==="
        date -Is
        echo
        echo "=== Domain state ==="
        virsh domstate "$OCP_VM_NAME"
        echo
        echo "=== Domain info ==="
        virsh dominfo "$OCP_VM_NAME"
        echo
        echo "=== Domain interfaces ==="
        virsh domiflist "$OCP_VM_NAME"
        echo
        echo "=== Guest addresses (libvirt available sources) ==="
        virsh domifaddr "$OCP_VM_NAME"
        echo
        echo "=== Domain disks ==="
        virsh domblklist "$OCP_VM_NAME"
      } > "{{ _ocp_boot_failure_diag_dir }}/libvirt.txt" 2>&1
  environment:
    OCP_VM_NAME: "{{ ocp_vm_name }}"
  changed_when: false
  failed_when: false

- name: Capture read-only guest-agent status, network interfaces, and routes
  ansible.builtin.shell:
    cmd: |
      set +e
      output="{{ _ocp_boot_failure_diag_dir }}/guest-agent.txt"
      {
        echo "Read-only queries through the QEMU guest agent."
        echo
        echo "=== Guest agent ping ==="
        timeout 5s virsh qemu-agent-command "$OCP_VM_NAME" '{"execute":"guest-ping"}' 2>&1
        echo "guest-ping exit code: $?"
        echo
        echo "=== Guest agent version and relevant command availability ==="
        guest_info=$(timeout 5s virsh qemu-agent-command "$OCP_VM_NAME" '{"execute":"guest-info"}' 2>&1)
        guest_info_rc=$?
        if [ "$guest_info_rc" -eq 0 ] && command -v jq >/dev/null 2>&1; then
          printf '%s\n' "$guest_info" | jq '.return | {version, supported_commands: [.supported_commands[]? | select(.name == "guest-network-get-interfaces" or .name == "guest-network-get-route" or .name == "guest-exec")]}'
        else
          printf '%s\n' "$guest_info"
          echo "guest-info exit code: $guest_info_rc"
        fi
        echo
        echo "=== Guest interface addresses and MAC addresses ==="
        guest_interfaces=$(timeout 5s virsh qemu-agent-command "$OCP_VM_NAME" '{"execute":"guest-network-get-interfaces"}' 2>&1)
        guest_interfaces_rc=$?
        if [ "$guest_interfaces_rc" -eq 0 ] && command -v jq >/dev/null 2>&1; then
          printf '%s\n' "$guest_interfaces" | jq '.return'
        else
          printf '%s\n' "$guest_interfaces"
          echo "guest-network-get-interfaces exit code: $guest_interfaces_rc"
        fi
        echo
        echo "=== Guest routes ==="
        guest_routes=$(timeout 5s virsh qemu-agent-command "$OCP_VM_NAME" '{"execute":"guest-network-get-route"}' 2>&1)
        guest_routes_rc=$?
        if [ "$guest_routes_rc" -eq 0 ] && command -v jq >/dev/null 2>&1; then
          printf '%s\n' "$guest_routes" | jq '.return'
        else
          printf '%s\n' "$guest_routes"
          echo "guest-network-get-route exit code: $guest_routes_rc"
        fi
      } > "$output" 2>&1
  environment:
    OCP_VM_NAME: "{{ ocp_vm_name }}"
  changed_when: false
  failed_when: false

- name: Read back Netris OCP VNet state after SSH probe failure
  ansible.builtin.uri:
    url: "{{ netris_controller_url }}/api/v2/vnet/{{ _ocp_configured_vnets[0].id }}"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: [200]
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(false) }}"
  register: _ocp_boot_failure_vnet_response
  when:
    - netris_controller_url is defined
    - netris_session_cookie is defined
    - _ocp_configured_vnets is defined
    - _ocp_configured_vnets | length > 0
  changed_when: false
  failed_when: false
  no_log: true

- name: Save relevant Netris OCP VNet state
  ansible.builtin.copy:
    dest: "{{ _ocp_boot_failure_diag_dir }}/netris-vnet.txt"
    mode: "0644"
    content: |
      Captured at: {{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}
      {% if _ocp_boot_failure_vnet_response.json.data is defined %}
      {{ {
        'name': _ocp_boot_failure_vnet_response.json.data.name | default(ocp_vnet_name),
        'state': _ocp_boot_failure_vnet_response.json.data.state | default('unknown'),
        'provisioning': _ocp_boot_failure_vnet_response.json.data.provisioning | default(none),
        'vpc': _ocp_boot_failure_vnet_response.json.data.vpc | default({}),
        'gateways': _ocp_boot_failure_vnet_response.json.data.gateways | default([]),
        'ports': _ocp_boot_failure_vnet_response.json.data.ports | default([])
      } | to_nice_json }}
      {% else %}
      Netris VNet readback unavailable (HTTP {{ _ocp_boot_failure_vnet_response.status | default('unknown') }}): {{ _ocp_boot_failure_vnet_response.msg | default('no response') }}
      {% endif %}
  when: _ocp_boot_failure_vnet_response is defined
  failed_when: false

- name: Read back Netris OCP DNAT state after SSH probe failure
  ansible.builtin.uri:
    url: "{{ netris_controller_url }}/api/v2/nat"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: [200]
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(false) }}"
  register: _ocp_boot_failure_nat_response
  when:
    - netris_controller_url is defined
    - netris_session_cookie is defined
  changed_when: false
  failed_when: false
  no_log: true

- name: Save the configured Netris OCP DNAT mapping
  ansible.builtin.copy:
    dest: "{{ _ocp_boot_failure_diag_dir }}/netris-dnat.txt"
    mode: "0644"
    content: |
      Captured at: {{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}
      {% set nat_data = _ocp_boot_failure_nat_response.json.data | default(_ocp_boot_failure_nat_response.json | default([])) %}
      {% set dnat_rules = nat_data | selectattr('name', 'equalto', ocp_vpc_name ~ '-dnat') | list %}
      {{ dnat_rules | to_nice_json }}
  when: _ocp_boot_failure_nat_response is defined
  failed_when: false

- name: Capture host routes and TCP reachability to guest and DNAT addresses
  ansible.builtin.shell:
    cmd: |
      set +e
      {
        echo "=== Captured at ==="
        date -Is
        echo
        echo "=== Public bridge state ==="
        ip -s link show dev "$PUBLIC_BRIDGE_NAME"
        echo
        echo "=== Public bridge neighbors ==="
        ip neigh show dev "$PUBLIC_BRIDGE_NAME"
        echo
        echo "=== Public bridge forwarding database ==="
        bridge fdb show br "$PUBLIC_BRIDGE_NAME" 2>&1
        for target in "{{ ocp_node_ip }}" "{{ ocp_dnat_ip }}"; do
          echo
          echo "=== Route to $target ==="
          route_output=$(ip -4 route get "$target" 2>&1)
          printf '%s\n' "$route_output"
          next_hop=$(printf '%s\n' "$route_output" | awk '{for (i=1; i<=NF; i++) if ($i == "via") {print $(i+1); exit}}')
          route_device=$(printf '%s\n' "$route_output" | awk '{for (i=1; i<=NF; i++) if ($i == "dev") {print $(i+1); exit}}')
          echo
          if [ -n "$next_hop" ]; then
            echo "=== Neighbor entry for next hop $next_hop on ${route_device:-unknown} ==="
            if [ -n "$route_device" ]; then
              ip neigh show to "$next_hop" dev "$route_device"
            else
              ip neigh show to "$next_hop"
            fi
          else
            echo "Route has no next-hop gateway; neighbor entry for destination $target:"
            ip neigh show to "$target"
          fi
          for port in 22 6443; do
            echo
            echo "=== TCP probe $target:$port ==="
            timeout 5s bash -c 'printf "" > /dev/tcp/$1/$2' _ "$target" "$port"
            echo "probe exit code: $?"
          done
        done
      } > "{{ _ocp_boot_failure_diag_dir }}/host-network-probes.txt" 2>&1
  changed_when: false
  failed_when: false
  environment:
    PUBLIC_BRIDGE_NAME: "{{ _netris_lab_public_bridge_name | default('br-public') }}"

- name: Capture packets on the public bridge during DNAT TCP probes
  ansible.builtin.shell:
    cmd: |
      set +e
      output="{{ _ocp_boot_failure_diag_dir }}/dnat-packet-probe.txt"
      if ! command -v tcpdump >/dev/null 2>&1; then
        echo "tcpdump is unavailable on the lab host; no packet capture was taken." > "$output"
        exit 0
      fi

      timeout -s INT 15s tcpdump -l -ni "$PUBLIC_BRIDGE_NAME" -e -vv -s 128 -c 40 \
        "host $OCP_DNAT_IP and (tcp port 22 or tcp port 6443)" > "$output" 2>&1 &
      capture_pid=$!
      sleep 1
      for port in 22 6443; do
        echo "=== TCP probe $OCP_DNAT_IP:$port ===" >> "$output"
        timeout 3s bash -c 'printf "" > /dev/tcp/$1/$2' _ "$OCP_DNAT_IP" "$port"
        echo "probe exit code: $?" >> "$output"
      done
      wait "$capture_pid"
      echo "tcpdump exit code: $?" >> "$output"
      exit 0
  environment:
    PUBLIC_BRIDGE_NAME: "{{ _netris_lab_public_bridge_name | default('br-public') }}"
    OCP_DNAT_IP: "{{ ocp_dnat_ip }}"
  changed_when: false
  failed_when: false

- name: Capture DNS and HTTP endpoint probes after failure
  ansible.builtin.shell:
    cmd: |
      set +e
      {
        echo "=== Captured at ==="
        date -Is
        for host in "$OCP_API_HOST" "$OCP_API_INT_HOST" "$OCP_CONSOLE_HOST"; do
          echo
          echo "=== DNS lookup $host ==="
          timeout 5s getent ahostsv4 "$host"
          echo "getent exit code: $?"
        done
        for url in \
          "https://$OCP_API_HOST:6443/healthz" \
          "https://$OCP_API_INT_HOST:6443/healthz" \
          "https://$OCP_CONSOLE_HOST/"; do
          echo
          echo "=== HTTP probe $url ==="
          timeout 12s curl --silent --show-error --insecure --noproxy '*' \
            --connect-timeout 5 --max-time 10 --output /dev/null \
            --write-out 'HTTP %{http_code}; remote %{remote_ip}\n' "$url"
          echo "curl exit code: $?"
        done
      } > "{{ _ocp_boot_failure_diag_dir }}/endpoint-probes.txt" 2>&1
  environment:
    OCP_API_HOST: "api.{{ ocp_cluster_name }}.{{ ocp_base_domain }}"
    OCP_API_INT_HOST: "api-int.{{ ocp_cluster_name }}.{{ ocp_base_domain }}"
    OCP_CONSOLE_HOST: >-
      {{ (_ocp_console_route_host.stdout | default('', true) | trim)
         or ('console-openshift-console.apps.' ~ ocp_cluster_name ~ '.' ~ ocp_base_domain) }}
  changed_when: false
  failed_when: false

- name: Capture OCP VM QEMU log tail
  ansible.builtin.shell:
    cmd: |
      set +e
      qemu_log="/var/log/libvirt/qemu/{{ ocp_vm_name }}.log"
      if [ -r "$qemu_log" ]; then
        tail -n 500 "$qemu_log"
      else
        echo "QEMU log is not readable at $qemu_log"
      fi
      exit 0
    executable: /bin/bash
  register: _ocp_qemu_log
  changed_when: false
  failed_when: false

- name: Save OCP VM QEMU log tail
  ansible.builtin.copy:
    dest: "{{ _ocp_boot_failure_diag_dir }}/qemu-log-tail.txt"
    content: "{{ _ocp_qemu_log.stdout | default('No QEMU log output was captured.') }}\n"
    mode: "0644"
  failed_when: false

- name: Capture OCP VM serial console output
  ansible.builtin.shell:
    cmd: |
      set +e
      {
        if command -v script >/dev/null 2>&1; then
          timeout 12s script -q -c 'timeout --signal=INT 10s virsh console --force --safe "$OCP_VM_NAME"' /dev/null
          echo "Console capture exit code: $?"
        else
          echo "Cannot capture serial console: util-linux script command is unavailable."
        fi
      } > "{{ _ocp_boot_failure_diag_dir }}/serial-console.txt" 2>&1
      exit 0
  environment:
    OCP_VM_NAME: "{{ ocp_vm_name }}"
  changed_when: false
  failed_when: false
