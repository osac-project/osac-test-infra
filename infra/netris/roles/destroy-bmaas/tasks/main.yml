---
# destroy-bmaas is the exact inverse of setup-bmaas: it undoes everything
# setup-bmaas creates, and nothing it doesn't. In particular it does NOT touch
# osac-inventory-config / osac-management-config (those are created by prep-osac,
# not setup-bmaas) and does NOT remove the shared osac CLI config
# (/root/.config/osac/config.json), which is a generic CLI convenience, not a
# BMaaS resource. Teardown runs in reverse order of creation: fulfillment-service
# API resources first, then BMHs/secrets/namespace, then the Provisioning CR,
# then the virtual BMH VMs and their disks.

# ── Phase 1: Fulfillment-service API teardown (reverse of setup Phase 7) ──
# Skipped gracefully if the fulfillment route is absent (e.g. osac already gone).
- name: Look up fulfillment internal API route
  ansible.builtin.command:
    cmd: oc get route fulfillment-internal-api -n {{ osac_namespace }} -o jsonpath='{.status.ingress[0].host}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _fulfillment_host
  changed_when: false
  failed_when: false

- name: Tear down fulfillment API resources
  when: _fulfillment_host.rc == 0 and (_fulfillment_host.stdout | length > 0)
  block:
    - name: Set fulfillment API URL
      ansible.builtin.set_fact:
        _fulfillment_api: "https://{{ _fulfillment_host.stdout }}"

    - name: Get service account token
      ansible.builtin.command:
        cmd: oc create token -n {{ osac_namespace }} admin
      environment:
        KUBECONFIG: /root/.kube/config
      register: _sa_token
      changed_when: false

    # Delete BMI catalog item (reverse of setup "Create BMI catalog item").
    # Resources are addressed by id; setup created it by metadata.name, so
    # resolve the id from the list first.
    - name: List BMI catalog items
      ansible.builtin.uri:
        url: "{{ _fulfillment_api }}/api/private/v1/baremetal_instance_catalog_items"
        method: GET
        headers:
          Authorization: "Bearer {{ _sa_token.stdout }}"
        validate_certs: false
        status_code: [200]
      register: _ci_list

    - name: Resolve catalog item id
      ansible.builtin.set_fact:
        _ci_id: >-
          {{ (_ci_list.json.get('items', [])
              | selectattr('metadata.name', 'equalto', bmaas_catalog_item)
              | map(attribute='id') | list | first) | default('') }}

    - name: Delete BMI catalog item
      ansible.builtin.uri:
        url: "{{ _fulfillment_api }}/api/private/v1/baremetal_instance_catalog_items/{{ _ci_id }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ _sa_token.stdout }}"
        validate_certs: false
        status_code: [200, 204, 404]
      when: _ci_id | length > 0

    - name: Resolve auto-EIP catalog item id
      ansible.builtin.set_fact:
        _auto_eip_ci_id: >-
          {{ (_ci_list.json.get('items', [])
              | selectattr('metadata.name', 'equalto', bmaas_auto_eip_catalog_item)
              | map(attribute='id') | list | first) | default('') }}

    - name: Delete auto-EIP BMI catalog item
      ansible.builtin.uri:
        url: "{{ _fulfillment_api }}/api/private/v1/baremetal_instance_catalog_items/{{ _auto_eip_ci_id }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ _sa_token.stdout }}"
        validate_certs: false
        status_code: [200, 204, 404]
      when: _auto_eip_ci_id | length > 0

    # Unlink the template from the host type (reverse of setup "Link BMI
    # template to host type"). Must happen before deleting the host type.
    - name: Unlink BMI template from host type
      ansible.builtin.uri:
        url: "{{ _fulfillment_api }}/api/private/v1/baremetal_instance_templates/{{ bmaas_bmi_template }}?update_mask=host_type"
        method: PATCH
        headers:
          Authorization: "Bearer {{ _sa_token.stdout }}"
          Content-Type: "application/json"
        body_format: json
        body:
          id: "{{ bmaas_bmi_template }}"
          host_type: ""
        validate_certs: false
        status_code: [200, 404]

    # Delete host type (reverse of setup "Create host type").
    - name: List host types
      ansible.builtin.uri:
        url: "{{ _fulfillment_api }}/api/private/v1/host_types"
        method: GET
        headers:
          Authorization: "Bearer {{ _sa_token.stdout }}"
        validate_certs: false
        status_code: [200]
      register: _ht_list

    - name: Resolve host type id
      ansible.builtin.set_fact:
        _ht_id: >-
          {{ (_ht_list.json.get('items', [])
              | selectattr('metadata.name', 'equalto', bmaas_host_type)
              | map(attribute='id') | list | first) | default('') }}

    - name: Delete host type
      ansible.builtin.uri:
        url: "{{ _fulfillment_api }}/api/private/v1/host_types/{{ _ht_id }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ _sa_token.stdout }}"
        validate_certs: false
        status_code: [200, 204, 404]
      when: _ht_id | length > 0

# ── Discover the virtual BMH VMs (shared by the phases below) ──
- name: Find BMaaS VMs
  ansible.builtin.shell:
    cmd: virsh list --all --name | grep "{{ item }}"
  register: _bmaas_vm_lookup
  changed_when: false
  failed_when: false
  loop: "{{ bmaas_vm_patterns }}"

- name: Build VM name list
  ansible.builtin.set_fact:
    bmaas_vms: "{{ _bmaas_vm_lookup.results | selectattr('stdout', 'ne', '') | map(attribute='stdout_lines') | map('first') | list }}"

# ── Phase 2: BMHs, secrets, namespace (reverse of setup Phases 3–5) ──
# Delete BMH CRs and wait for Metal3 to deprovision (host still powered on so
# IPA can run). Force-clear finalizers on anything that gets stuck so teardown
# always completes.
- name: Delete BareMetalHost CRs (wait for deprovision)
  ansible.builtin.command:
    cmd: oc delete bmh {{ item }} -n {{ bmaas_bmh_namespace }} --ignore-not-found --wait=true --timeout=600s
  environment:
    KUBECONFIG: /root/.kube/config
  loop: "{{ bmaas_vms }}"
  register: _bmh_delete
  failed_when: false
  changed_when: "'deleted' in _bmh_delete.stdout"

- name: Force-clear finalizers on any lingering BareMetalHost
  ansible.builtin.shell:
    cmd: |
      if oc get bmh {{ item }} -n {{ bmaas_bmh_namespace }} >/dev/null 2>&1; then
        oc patch bmh {{ item }} -n {{ bmaas_bmh_namespace }} --type=merge \
          -p '{"metadata":{"finalizers":[]}}'
        echo "force-cleared"
      else
        echo "gone"
      fi
  environment:
    KUBECONFIG: /root/.kube/config
  loop: "{{ bmaas_vms }}"
  register: _bmh_finalizer
  changed_when: "'force-cleared' in _bmh_finalizer.stdout"

- name: Delete BMC credential secrets
  ansible.builtin.command:
    cmd: oc delete secret {{ item }}-bmc-secret -n {{ bmaas_bmh_namespace }} --ignore-not-found
  environment:
    KUBECONFIG: /root/.kube/config
  loop: "{{ bmaas_vms }}"
  changed_when: true

- name: Delete BMH namespace
  ansible.builtin.command:
    cmd: oc delete namespace {{ bmaas_bmh_namespace }} --ignore-not-found
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: true

# ── Phase 3: Provisioning CR (reverse of setup Phase 1) ──
- name: Delete Provisioning CR
  ansible.builtin.command:
    cmd: oc delete provisioning provisioning-configuration --ignore-not-found
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: true

# ── Phase 4: Virtual BMH VMs and disks (reverse of setup Phase 2) ──
- name: Shut down BMaaS VMs
  ansible.builtin.command:
    cmd: virsh destroy {{ item }}
  loop: "{{ bmaas_vms }}"
  failed_when: false
  changed_when: true

- name: Remove BMaaS disks
  ansible.builtin.file:
    path: "{{ sushy_tools_disk_dir }}/{{ item }}-disk.qcow2"
    state: absent
  loop: "{{ bmaas_vms }}"

- name: Delete V-Net lock Lease for provisioning network
  kubernetes.core.k8s:
    state: absent
    api_version: coordination.k8s.io/v1
    kind: Lease
    name: "netris-vnet-lock-{{ bmaas_provisioning_vnet_name }}"
    namespace: "{{ osac_namespace }}"
  environment:
    KUBECONFIG: /root/.kube/config
  ignore_errors: true

# ── Phase 5: Netris BM provisioning V-Net teardown (reverse of setup "Set up BM provisioning V-Net") ──
# setup-bmaas creates the provisioning VPC/V-Net/IPAM/SNAT/DNATs, so destroy-bmaas
# removes them. Runs last: the BMH deprovision above needs the provisioning DNAT
# egress (IPA pulls its image) until it completes. Deletes run in reverse creation
# order: DNAT rules, SNAT rule, SNAT NAT pool, V-Net, provisioning IPAM, then the
# VPC. Every role delete is idempotent (find-by-name, skip if already gone).
- name: Tear down BM provisioning V-Net
  when: bmaas_provisioning_enabled | bool
  block:
    - name: Discover Netris controller URL (k3s)
      ansible.builtin.shell:
        cmd: kubectl get svc traefik -n kube-system -o jsonpath='{.spec.ports[?(@.name=="web")].nodePort}'
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: _provisioning_traefik_nodeport
      changed_when: false
      failed_when: false

    - name: Tear down provisioning Netris resources
      when: _provisioning_traefik_nodeport.rc == 0 and (_provisioning_traefik_nodeport.stdout | length > 0)
      block:
        - name: Set Netris controller URL
          ansible.builtin.set_fact:
            netris_controller_url: "http://localhost:{{ _provisioning_traefik_nodeport.stdout }}"

        - name: Authenticate to Netris controller
          ansible.builtin.include_role:
            name: netris.controller.auth

        - name: Get VPC list
          ansible.builtin.uri:
            url: "{{ netris_controller_url }}/api/v2/vpc"
            method: GET
            headers:
              Cookie: "connect.sid={{ netris_session_cookie }}"
            status_code: 200
            validate_certs: "{{ netris_validate_certs | default(false) }}"
          register: _provisioning_vpc_list
          no_log: true

        - name: Resolve provisioning VPC id
          ansible.builtin.set_fact:
            _provisioning_vpc_id: >-
              {{ (_provisioning_vpc_list.json.data | default([])
                  | selectattr('name', 'equalto', bmaas_provisioning_vpc_name)
                  | map(attribute='id') | list | first) | default('') }}

        - name: Delete per-host provisioning DNAT rules
          ansible.builtin.include_role:
            name: netris.controller.nat
          vars:
            nat_name: "{{ bmaas_provisioning_vnet_name }}-dnat-{{ idx }}"
            nat_state: absent
          loop: "{{ range(0, bmaas_vm_patterns | length) | list }}"
          loop_control:
            loop_var: idx
          ignore_errors: true

        - name: Delete legacy per-host provisioning SNAT rules
          ansible.builtin.include_role:
            name: netris.controller.nat
          vars:
            nat_name: "{{ bmaas_provisioning_vnet_name }}-snat-{{ idx }}"
            nat_state: absent
          loop: "{{ range(0, bmaas_vm_patterns | length) | list }}"
          loop_control:
            loop_var: idx
          ignore_errors: true

        - name: Delete provisioning SNAT rule
          ansible.builtin.include_role:
            name: netris.controller.nat
          vars:
            nat_name: "{{ bmaas_provisioning_vnet_name }}-snat"
            nat_state: absent
          ignore_errors: true

        - name: Delete provisioning SNAT pool IPAM subnet
          ansible.builtin.include_role:
            name: netris.controller.ipam
          vars:
            ipam_state: delete_subnet
            ipam_name: "{{ bmaas_provisioning_vnet_name }}-snat-pool"
            ipam_vpc_id: "{{ bmaas_provisioning_snat_vpc_id }}"
          ignore_errors: true

        - name: Delete provisioning SNAT pool IPAM allocation
          ansible.builtin.include_role:
            name: netris.controller.ipam
          vars:
            ipam_state: delete_allocation
            ipam_name: "{{ bmaas_provisioning_vnet_name }}-snat-allocation"
            ipam_vpc_id: "{{ bmaas_provisioning_snat_vpc_id }}"
          ignore_errors: true

        - name: Get V-Net list
          ansible.builtin.uri:
            url: "{{ netris_controller_url }}/api/v2/vnet"
            method: GET
            headers:
              Cookie: "connect.sid={{ netris_session_cookie }}"
            status_code: 200
            validate_certs: "{{ netris_validate_certs | default(false) }}"
          register: _provisioning_vnet_del_list
          no_log: true

        - name: Resolve provisioning V-Net id
          ansible.builtin.set_fact:
            _provisioning_vnet_id: >-
              {{ (_provisioning_vnet_del_list.json.data | default([])
                  | selectattr('name', 'equalto', bmaas_provisioning_vnet_name)
                  | map(attribute='id') | list | first) | default('') }}

        - name: Delete provisioning V-Net
          ansible.builtin.uri:
            url: "{{ netris_controller_url }}/api/v2/vnet/{{ _provisioning_vnet_id }}"
            method: DELETE
            headers:
              Cookie: "connect.sid={{ netris_session_cookie }}"
            status_code: [200, 204, 404]
            validate_certs: "{{ netris_validate_certs | default(false) }}"
          when: _provisioning_vnet_id | length > 0
          ignore_errors: true

        - name: Delete provisioning IPAM subnet
          ansible.builtin.include_role:
            name: netris.controller.ipam
          vars:
            ipam_state: delete_subnet
            ipam_name: "{{ bmaas_provisioning_vnet_name }}-subnet"
            ipam_vpc_id: "{{ _provisioning_vpc_id }}"
          when: _provisioning_vpc_id | length > 0
          ignore_errors: true

        - name: Delete provisioning IPAM allocation
          ansible.builtin.include_role:
            name: netris.controller.ipam
          vars:
            ipam_state: delete_allocation
            ipam_name: "{{ bmaas_provisioning_vnet_name }}-allocation"
            ipam_vpc_id: "{{ _provisioning_vpc_id }}"
          when: _provisioning_vpc_id | length > 0
          ignore_errors: true

        - name: Delete provisioning ACL permit rule
          block:
            - ansible.builtin.include_role:
                name: netris.controller.acl
                tasks_from: delete
              vars:
                acl_name: "{{ bmaas_provisioning_vnet_name }}-permit-all"
          rescue:
            - name: ACL permit rule deletion failed (non-fatal)
              ansible.builtin.debug:
                msg: "ACL rule '{{ bmaas_provisioning_vnet_name }}-permit-all' deletion failed — may already be gone"

        - name: Delete provisioning VPC
          ansible.builtin.include_role:
            name: netris.controller.vpc
          vars:
            vpc_name: "{{ bmaas_provisioning_vpc_name }}"
            vpc_state: absent
          ignore_errors: true
