---
- name: Read back Netris OCP IPAM subnet
  ansible.builtin.uri:
    url: "{{ netris_controller_url }}/api/v2/ipam/subnets"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: [200]
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(false) }}"
  register: _ocp_configured_ipam_subnets_response
  no_log: true

- name: Read back Netris OCP VNet
  ansible.builtin.uri:
    url: "{{ netris_controller_url }}/api/v2/vnet"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: [200]
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(false) }}"
  register: _ocp_configured_vnets_response
  no_log: true

- name: Read back Netris OCP DNAT rule
  ansible.builtin.uri:
    url: "{{ netris_controller_url }}/api/v2/nat"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: [200]
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(false) }}"
  register: _ocp_configured_nat_rules_response
  no_log: true

- name: Find the configured Netris OCP IPAM subnet
  ansible.builtin.set_fact:
    _ocp_configured_ipam_subnets: >-
      {{ _ocp_configured_ipam_subnets_response.json.data | default([])
         | selectattr('name', 'equalto', ocp_vpc_name ~ '-subnet') | list }}
  no_log: true

- name: Find the configured Netris OCP VNet
  ansible.builtin.set_fact:
    _ocp_configured_vnets: >-
      {{ _ocp_configured_vnets_response.json.data | default([])
         | selectattr('name', 'equalto', ocp_vnet_name) | list }}
  no_log: true

- name: Find the configured Netris OCP DNAT rule
  ansible.builtin.set_fact:
    _ocp_configured_dnat_rules: >-
      {{ (_ocp_configured_nat_rules_response.json.data
          | default(_ocp_configured_nat_rules_response.json))
         | selectattr('name', 'equalto', ocp_vpc_name ~ '-dnat') | list }}
  no_log: true

- name: Find the configured Netris OCP SNAT rule
  ansible.builtin.set_fact:
    _ocp_configured_snat_rules: >-
      {{ (_ocp_configured_nat_rules_response.json.data
          | default(_ocp_configured_nat_rules_response.json))
         | selectattr('name', 'equalto', ocp_vpc_name ~ '-snat') | list }}
  no_log: true

- name: Require exactly one Netris OCP IPAM subnet
  ansible.builtin.assert:
    that:
      - _ocp_configured_ipam_subnets | length == 1

- name: Read assigned IPAM hosts from the OCP subnet
  ansible.builtin.uri:
    url: "{{ netris_controller_url }}/api/v2/ipam/hosts/{{ _ocp_configured_ipam_subnets[0].id }}"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: [200]
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(false) }}"
  register: _ocp_configured_node_ipam_hosts_response
  no_log: true

- name: Find an IPAM host already assigned the OCP node IP
  ansible.builtin.set_fact:
    _ocp_configured_node_ip_claims: >-
      {{ _ocp_configured_node_ipam_hosts_response.json.data | default([])
         | selectattr('address', 'equalto', ocp_node_ip)
         | map(attribute='address') | list }}
  no_log: true

- name: Require the OCP node IP to be unassigned in its Netris IPAM subnet
  ansible.builtin.assert:
    that:
      - _ocp_configured_node_ip_claims | length == 0
    fail_msg: >-
      OCP node IP {{ ocp_node_ip }} is already assigned to an IPAM host in
      {{ _ocp_configured_ipam_subnets[0].prefix }}.

- name: Require the Netris OCP IPAM subnet to match the expected network
  ansible.builtin.assert:
    that:
      - _ocp_configured_ipam_subnets[0].prefix == ocp_subnet_cidr
      - _ocp_configured_ipam_subnets[0].purpose == 'common'
      - (_ocp_configured_ipam_subnets[0].vpc.id | default(-1) | int) == vpc_id | int
    fail_msg: >-
      Netris IPAM subnet {{ ocp_vpc_name }}-subnet is missing or differs from
      the expected {{ ocp_subnet_cidr }} common subnet in VPC {{ vpc_id }}.

- name: Require exactly one Netris OCP VNet
  ansible.builtin.assert:
    that:
      - _ocp_configured_vnets | length == 1

- name: Wait for the Netris OCP VNet to become active with the expected ports
  block:
    - name: Read detailed Netris OCP VNet configuration
      ansible.builtin.uri:
        url: "{{ netris_controller_url }}/api/v2/vnet/{{ _ocp_configured_vnets[0].id }}"
        method: GET
        headers:
          Cookie: "connect.sid={{ netris_session_cookie }}"
        return_content: true
        status_code: [200]
        timeout: "{{ netris_timeout | default(30) }}"
        validate_certs: "{{ netris_validate_certs | default(false) }}"
      register: _ocp_configured_vnet_detail_response
      no_log: true
      retries: 24
      delay: 5
      until: >-
        (_ocp_configured_vnet_detail_response.json.data.status.label | default('') | lower) == 'active'
        and
        (ocp_server_ports | map(attribute='name') | list
         | difference(_ocp_configured_vnet_detail_response.json.data.ports | default([])
                     | map(attribute='name', default='') | list) | length) == 0
  rescue:
    - name: Report Netris OCP VNet convergence failure
      ansible.builtin.fail:
        msg: >-
          Netris VNet {{ ocp_vnet_name }} did not become active with expected
          server ports {{ ocp_server_ports | map(attribute='name') | list }}
          after 24 retries at 5-second intervals. Last status is
          {{ _ocp_configured_vnet_detail_response.json.data.status.label | default('unknown') }}
          ({{ _ocp_configured_vnet_detail_response.json.data.status.value | default('unknown') }}).
          API returned port names
          {{ _ocp_configured_vnet_detail_response.json.data.ports | default([])
             | map(attribute='name', default='') | list }}, port identifiers
          {{ _ocp_configured_vnet_detail_response.json.data.ports | default([])
             | map(attribute='port', default='') | list }}, interface names
          {{ _ocp_configured_vnet_detail_response.json.data.ports | default([])
             | map(attribute='ifName', default='') | list }}, and switch names
          {{ _ocp_configured_vnet_detail_response.json.data.ports | default([])
             | map(attribute='switchName', default='') | list }}.

- name: Require the Netris OCP VNet to match the expected gateway and server port
  ansible.builtin.assert:
    that:
      - (_ocp_configured_vnet_detail_response.json.data.vpc.id | default(-1) | int) == vpc_id | int
      - >-
        (_ocp_configured_vnet_detail_response.json.data.gateways | default([])
         | selectattr('prefix', 'equalto', ocp_gateway)
         | map(attribute='dhcpEnabled', default=false)
         | select('equalto', false) | list | length) == 1
      - >-
        (ocp_server_ports | map(attribute='name') | list
         | difference(_ocp_configured_vnet_detail_response.json.data.ports | default([])
                     | map(attribute='name') | list) | length) == 0
    fail_msg: >-
      Netris VNet {{ ocp_vnet_name }} must belong to VPC {{ vpc_id }}, attach
      {{ ocp_server_ports | map(attribute='name') | list }}, and expose gateway
      {{ ocp_gateway }} with DHCP disabled.

- name: Require each OCP server port to be attached in the expected mode
  ansible.builtin.assert:
    that:
      - >-
        (_ocp_configured_vnet_detail_response.json.data.ports | default([])
         | selectattr('name', 'equalto', item.name)
         | selectattr('accessMode', 'equalto', item.accessMode | default(false))
         | list | length) == 1
    fail_msg: >-
      Netris VNet {{ ocp_vnet_name }} must attach port {{ item.name }} with
      accessMode={{ item.accessMode | default(false) }}.
  loop: "{{ ocp_server_ports }}"
  loop_control:
    label: "{{ item.name }}"

- name: Require exactly one Netris OCP DNAT rule
  ansible.builtin.assert:
    that:
      - _ocp_configured_dnat_rules | length == 1

- name: Require exactly one Netris OCP SNAT rule
  ansible.builtin.assert:
    that:
      - _ocp_configured_snat_rules | length == 1

- name: Require the Netris OCP SNAT rule to match the expected subnet translation
  ansible.builtin.assert:
    that:
      - (_ocp_configured_snat.action.value | default(_ocp_configured_snat.action) | lower) == 'snat'
      - (_ocp_configured_snat.state.value | default(_ocp_configured_snat.state) | lower) == 'enabled'
      - (_ocp_configured_snat.site.id | default(-1) | int) == 1
      - (_ocp_configured_snat.vpc.id | default(-1) | int) == vpc_id | int
      - (_ocp_configured_snat.sourceAddress | ansible.utils.ipaddr('address')) == (ocp_subnet_cidr | ansible.utils.ipaddr('address'))
      - (_ocp_configured_snat.sourceAddress | ansible.utils.ipaddr('prefix') | int) == (ocp_subnet_cidr | ansible.utils.ipaddr('prefix') | int)
      - (_ocp_configured_snat.snatToIP | ansible.utils.ipaddr('address')) == ocp_snat_ip
    fail_msg: >-
      Netris rule {{ ocp_vpc_name }}-snat does not match the expected enabled
      source NAT mapping {{ ocp_subnet_cidr }} -> {{ ocp_snat_ip }} in VPC
      {{ vpc_id }}.
  vars:
    _ocp_configured_snat: "{{ _ocp_configured_snat_rules[0] }}"

- name: Require the Netris OCP DNAT rule to match the complete expected mapping
  ansible.builtin.assert:
    that:
      - (_ocp_configured_dnat.action.value | default(_ocp_configured_dnat.action) | lower) == 'dnat'
      - (_ocp_configured_dnat.state.value | default(_ocp_configured_dnat.state) | lower) == 'enabled'
      - (_ocp_configured_dnat.protocol.value | default(_ocp_configured_dnat.protocol) | lower) == 'all'
      - (_ocp_configured_dnat.site.id | default(-1) | int) == 1
      - (_ocp_configured_dnat.vpc.id | default(-1) | int) == vpc_id | int
      - (_ocp_configured_dnat.destinationAddress | ansible.utils.ipaddr('address')) == ocp_dnat_ip
      - (_ocp_configured_dnat.destinationAddress | ansible.utils.ipaddr('prefix') | int) == 32
      - (_ocp_configured_dnat.dnatToIP | ansible.utils.ipaddr('address')) == ocp_node_ip
      - (_ocp_configured_dnat.dnatToPort | default(0, true) | int) == 0
      - _ocp_configured_dnat.sourceAddress == '0.0.0.0/0'
      - _ocp_configured_dnat.sourcePort | string == '1-65535'
      - _ocp_configured_dnat.destinationPort | string == '1-65535'
    fail_msg: >-
      Netris rule {{ ocp_vpc_name }}-dnat does not match the expected enabled
      all-protocol mapping {{ ocp_dnat_ip }}/32 -> {{ ocp_node_ip }} with
      unchanged ports and the expected site/VPC.
  vars:
    _ocp_configured_dnat: "{{ _ocp_configured_dnat_rules[0] }}"
