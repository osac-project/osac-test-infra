---
# Deploy a plain Linux NFS server on a host bridge outside the fabric gateway.
# Additive: it creates `br-storage`, the `lab-nfs` domain, and routes only the
# storage CIDR through netris-lab's ISP server. It never touches the SNO, the
# softgates, or the existing lab VMs.

- name: Validate the storage endpoint address plan
  ansible.builtin.assert:
    that:
      - netris_storage_endpoint_enabled | default(false) | bool
      - netris_storage_endpoint_cidr | ansible.utils.ipaddr('subnet') is not none
      - lab_nfs_server_ip | ansible.utils.ipaddr(netris_storage_endpoint_cidr) is not none
      - lab_nfs_bridge_ip | ansible.utils.ipaddr(netris_storage_endpoint_cidr) is not none
      - lab_nfs_client_cidrs | difference([
          osac_external_ip_pool_cidr | ansible.utils.ipaddr('subnet'),
          bmaas_provisioning_snat_cidr | ansible.utils.ipaddr('subnet')]) | length == 0
      - (osac_external_ip_pool_cidr | ansible.utils.ipaddr('subnet')) in lab_nfs_client_cidrs
      - (bmaas_provisioning_snat_cidr | ansible.utils.ipaddr('subnet')) in lab_nfs_client_cidrs
    fail_msg: >-
      Storage endpoint values are inconsistent. The endpoint must be enabled,
      the server and bridge addresses must be inside
      {{ netris_storage_endpoint_cidr }}, and the export must admit exactly the
      tenant NAT pool and the BMaaS provisioning SNAT range.

- name: Require the Ubuntu cloud image
  ansible.builtin.stat:
    path: "{{ lab_nfs_base_image }}"
  register: _lab_nfs_base

- name: Fail when the cloud image is missing
  ansible.builtin.assert:
    that:
      - _lab_nfs_base.stat.exists
    fail_msg: >-
      {{ lab_nfs_base_image }} is missing. Provision it with the netris-lab
      prerequisites before enabling the storage endpoint.

- name: Read the NetworkManager connection names
  ansible.builtin.command:
    argv: [nmcli, -t, -f, NAME, con, show]
  register: _lab_nfs_nm_connections
  changed_when: false
  failed_when: false

- name: Create the storage bridge connection
  ansible.builtin.command:
    argv:
      - nmcli
      - con
      - add
      - type
      - bridge
      - ifname
      - "{{ lab_nfs_bridge }}"
      - con-name
      - "{{ lab_nfs_bridge }}"
  when: lab_nfs_bridge not in _lab_nfs_nm_connections.stdout_lines | default([])
  changed_when: true

# Run the modify on every pass so a changed bridge address or CIDR wins over a
# stale profile: `nmcli con add` alone only sets the address on first creation.
- name: Ensure the storage bridge address and bridge options are current
  ansible.builtin.command:
    argv:
      - nmcli
      - con
      - mod
      - "{{ lab_nfs_bridge }}"
      - ipv4.method
      - manual
      - ipv4.addresses
      - "{{ lab_nfs_bridge_ip }}/{{ netris_storage_endpoint_cidr | ansible.utils.ipaddr('prefix') }}"
      - bridge.stp
      - "no"
      - ipv6.method
      - disabled
      - connection.autoconnect
      - "yes"
  changed_when: false

- name: Bring the storage bridge up
  ansible.builtin.command:
    argv: [nmcli, con, up, "{{ lab_nfs_bridge }}"]
  changed_when: false

- name: Get firewalld state
  ansible.builtin.command: firewall-cmd --state
  register: _lab_nfs_firewalld
  changed_when: false
  failed_when: false

- name: Define whether firewalld is running
  ansible.builtin.set_fact:
    _lab_nfs_firewalld_running: >-
      {{ _lab_nfs_firewalld.rc == 0
         and _lab_nfs_firewalld.stdout | trim == 'running' }}

- name: Trust the storage bridge in firewalld
  ansible.posix.firewalld:
    zone: trusted
    interface: "{{ lab_nfs_bridge }}"
    permanent: true
    immediate: true
    state: enabled
  when: _lab_nfs_firewalld_running | bool

- name: Masquerade storage-VM internet traffic, never lab traffic (firewalld)
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --direct
      - --add-rule
      - ipv4
      - nat
      - POSTROUTING
      - "0"
      - -s
      - "{{ netris_storage_endpoint_cidr | ansible.utils.ipaddr('subnet') }}"
      - -o
      - "{{ ansible_default_ipv4.interface }}"
      - -j
      - MASQUERADE
  register: _lab_nfs_masq
  changed_when: "'ALREADY_ENABLED' not in _lab_nfs_masq.stdout"
  failed_when:
    - _lab_nfs_masq.rc != 0
    - "'ALREADY_ENABLED' not in _lab_nfs_masq.stdout"
  when: _lab_nfs_firewalld_running | bool

- name: Reload firewalld after the masquerade rule
  ansible.builtin.command: firewall-cmd --reload
  changed_when: false
  when: _lab_nfs_firewalld_running | bool

# The lab host is not guaranteed to run firewalld. Without the masquerade the
# storage VM cannot reach apt, so fall back to an idempotent iptables rule.
- name: Masquerade storage-VM internet traffic, never lab traffic (iptables)
  ansible.builtin.iptables:
    table: nat
    chain: POSTROUTING
    source: "{{ netris_storage_endpoint_cidr | ansible.utils.ipaddr('subnet') }}"
    out_interface: "{{ ansible_default_ipv4.interface }}"
    jump: MASQUERADE
  when: not (_lab_nfs_firewalld_running | bool)

- name: Ensure IPv4 forwarding is enabled for the storage bridge
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Generate the lab NFS SSH key when absent
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -t
      - ed25519
      - -N
      - ""
      - -f
      - "{{ lab_nfs_ssh_key }}"
  args:
    creates: "{{ lab_nfs_ssh_key }}"
  changed_when: true

- name: Read the lab NFS public key
  ansible.builtin.slurp:
    src: "{{ lab_nfs_ssh_key }}.pub"
  register: _lab_nfs_pub

- name: Create the VM disk overlay
  ansible.builtin.command:
    argv:
      - qemu-img
      - create
      - -f
      - qcow2
      - -F
      - qcow2
      - -b
      - "{{ lab_nfs_base_image }}"
      - "{{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}.qcow2"
      - "{{ lab_nfs_disk_gb }}G"
  args:
    creates: "{{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}.qcow2"
  register: _lab_nfs_overlay

- name: Create the cloud-init seed directory
  ansible.builtin.file:
    path: "{{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}-seed"
    state: directory
    mode: "0700"

# NoCloud requires the files at the ISO root, named exactly user-data,
# meta-data, and network-config. Rendering them through a staging directory
# keeps the names right and stops genisoimage from embedding absolute paths.
- name: Render the cloud-init seed files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}-seed/{{ item.dest }}"
    mode: "0600"
  loop:
    - { src: user-data.yaml.j2, dest: user-data }
    - { src: meta-data.yaml.j2, dest: meta-data }
    - { src: network-config.yaml.j2, dest: network-config }

- name: Check the rendered cloud-init seed files
  ansible.builtin.stat:
    path: "{{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}-seed/{{ item.dest }}"
  loop:
    - { dest: user-data }
    - { dest: meta-data }
    - { dest: network-config }
  register: _lab_nfs_seed_files

- name: Check the cloud-init seed ISO
  ansible.builtin.stat:
    path: "{{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}-seed.iso"
  register: _lab_nfs_seed_iso

# Rebuild only when the ISO is missing or older than a rendered seed file.
- name: Build the cloud-init seed ISO
  ansible.builtin.command:
    argv:
      - genisoimage
      - -output
      - "{{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}-seed.iso"
      - -volid
      - cidata
      - -joliet
      - -rock
      - user-data
      - meta-data
      - network-config
  args:
    chdir: "{{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}-seed"
  when: >-
    not _lab_nfs_seed_iso.stat.exists
    or _lab_nfs_seed_files.results | map(attribute='stat') | map(attribute='mtime') | max
       > _lab_nfs_seed_iso.stat.mtime
  changed_when: true

# libvirt assigns a unique MAC per domain, so two lab runs cannot collide; the
# netplan file matches by interface name instead of a hard-coded address.
- name: Define and start the lab NFS domain
  ansible.builtin.command:
    argv:
      - virt-install
      - --name
      - "{{ lab_nfs_vm_name }}"
      - --memory
      - "{{ lab_nfs_memory_mb }}"
      - --vcpus
      - "{{ lab_nfs_vcpu }}"
      - --disk
      - "path={{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}.qcow2,format=qcow2,bus=virtio"
      - --disk
      - "path={{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}-seed.iso,device=cdrom"
      - --network
      - "bridge={{ lab_nfs_bridge }},model=virtio"
      - --osinfo
      - ubuntu24.04
      - --import
      - --noautoconsole
      - --graphics
      - none
      - --console
      - pty,target_type=serial
  args:
    creates: "/etc/libvirt/qemu/{{ lab_nfs_vm_name }}.xml"

- name: Ensure the lab NFS domain is running
  ansible.builtin.command:
    argv: [virsh, start, "{{ lab_nfs_vm_name }}"]
  register: _lab_nfs_start
  changed_when: _lab_nfs_start.rc == 0
  failed_when:
    - _lab_nfs_start.rc != 0
    - "'already active' not in _lab_nfs_start.stderr"

- name: Read the NFS VM interfaces
  ansible.builtin.command:
    argv: [virsh, domiflist, "{{ lab_nfs_vm_name }}"]
  register: _lab_nfs_iflist
  changed_when: false

- name: Attach the NFS VM tap to the storage bridge
  ansible.builtin.command:
    argv: [ip, link, set, "{{ item }}", master, "{{ lab_nfs_bridge }}"]
  loop: "{{ _lab_nfs_iflist.stdout | regex_findall('(?m)^\\s*(\\w+)\\s+bridge\\s+') }}"
  changed_when: false

- name: Bring the storage bridge up after attaching the tap
  ansible.builtin.command:
    argv: [ip, link, set, "{{ lab_nfs_bridge }}", up]
  changed_when: false

- name: Wait for the NFS server SSH port
  ansible.builtin.wait_for:
    host: "{{ lab_nfs_server_ip }}"
    port: 22
    delay: 5
    timeout: 900

- name: Add the NFS server to the in-memory inventory
  ansible.builtin.add_host:
    name: lab_nfs_server
    ansible_host: "{{ lab_nfs_server_ip }}"
    ansible_user: "{{ lab_nfs_ssh_user }}"
    ansible_ssh_private_key_file: "{{ lab_nfs_ssh_key }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  changed_when: false

# Cloud-init only creates the user and network; package install is an Ansible
# task so a slow mirror cannot hold the whole play in cloud-init.
- name: Wait for cloud-init to settle
  ansible.builtin.command: cloud-init status --wait
  delegate_to: lab_nfs_server
  become: true
  register: _lab_nfs_cloud_init
  changed_when: false
  failed_when: false

- name: Check the NFS server packages
  ansible.builtin.command: dpkg -s nfs-kernel-server nfs-common tcpdump
  delegate_to: lab_nfs_server
  become: true
  register: _lab_nfs_packages
  changed_when: false
  failed_when: false

- name: Install the NFS server packages
  ansible.builtin.apt:
    name:
      - nfs-kernel-server
      - nfs-common
      - tcpdump
    state: present
    update_cache: true
  delegate_to: lab_nfs_server
  become: true
  when: _lab_nfs_packages.rc != 0

- name: Create the export directory
  ansible.builtin.file:
    path: "{{ lab_nfs_export }}"
    state: directory
    mode: "0777"
  delegate_to: lab_nfs_server
  become: true

- name: Install the NFS exports
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  delegate_to: lab_nfs_server
  become: true

- name: Create the nfs.conf drop-in directory
  ansible.builtin.file:
    path: /etc/nfs.conf.d
    state: directory
    mode: "0755"
  delegate_to: lab_nfs_server
  become: true

- name: Restrict the server to NFSv4.1
  ansible.builtin.template:
    src: nfs.conf.j2
    dest: /etc/nfs.conf.d/99-osac.conf
    owner: root
    group: root
    mode: "0644"
  delegate_to: lab_nfs_server
  become: true

- name: Install the client-address logger
  ansible.builtin.template:
    src: osac-nfs-clients.service.j2
    dest: /etc/systemd/system/osac-nfs-clients.service
    owner: root
    group: root
    mode: "0644"
  delegate_to: lab_nfs_server
  become: true

- name: Create the client-address log
  ansible.builtin.file:
    path: "{{ lab_nfs_client_log }}"
    state: touch
    mode: "0644"
  delegate_to: lab_nfs_server
  become: true

- name: Reload the NFS exports
  ansible.builtin.command: exportfs -ra
  delegate_to: lab_nfs_server
  become: true

- name: Restart the NFS server with the v4.1 setting
  ansible.builtin.systemd_service:
    name: nfs-server
    state: restarted
  delegate_to: lab_nfs_server
  become: true

- name: Restart the client-address logger
  ansible.builtin.systemd_service:
    name: osac-nfs-clients
    state: restarted
    daemon_reload: true
  delegate_to: lab_nfs_server
  become: true

- name: Enable and start NFS and the client-address logger
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - nfs-server
    - osac-nfs-clients
  delegate_to: lab_nfs_server
  become: true

- name: Verify NFSv4.1-only and the client-address logger
  ansible.builtin.shell: |
    set -eu
    exportfs -v
    systemctl is-active --quiet nfs-server
    systemctl is-active --quiet osac-nfs-clients
    versions=$(cat /proc/fs/nfsd/versions)
    echo "nfsd versions: ${versions}"
    grep -Eq '(^| )\+4\.1( |$)' <<< "${versions}"
    grep -Eq '(^| )-3( |$)' <<< "${versions}"
    grep -Eq '(^| )-4\.0( |$)' <<< "${versions}"
    grep -Eq '(^| )-4\.2( |$)' <<< "${versions}"
    grep -q 'root_squash' /etc/exports
    ! grep -q 'no_root_squash' /etc/exports
    grep -q 'insecure' /etc/exports
  delegate_to: lab_nfs_server
  become: true
  register: _lab_nfs_verify
  changed_when: false
  retries: 12
  delay: 10
  until: _lab_nfs_verify.rc == 0

# netris-lab's isp-server forwards the storage CIDR to the host default route.
- name: Route the storage CIDR through the ISP server
  ansible.builtin.command:
    argv:
      - ssh
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=no
      - "root@{{ lab_nfs_isp_ip }}"
      - >-
        ip route replace {{ netris_storage_endpoint_cidr | ansible.utils.ipaddr('subnet') }}
        via {{ lab_nfs_isp_gateway }}
  changed_when: false

- name: Show the endpoint
  ansible.builtin.debug:
    msg:
      - "NFS server: {{ lab_nfs_server_ip }}:{{ lab_nfs_export }}"
      - "Client log: {{ lab_nfs_client_log }}"
      - "Admitted CIDRs: {{ lab_nfs_client_cidrs | join(', ') }}"
      - "Excluded CIDR: {{ netris_storage_endpoint_cidr }}"
