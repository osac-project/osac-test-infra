---
# Deploy a plain Linux NFS server on a host bridge outside the fabric gateway.
# Additive: it creates `br-storage`, the `lab-nfs` domain, and one host route.
# It never touches the SNO, the softgates, or the existing lab VMs.

- name: Require the Ubuntu cloud image
  ansible.builtin.stat:
    path: "{{ lab_nfs_base_image }}"
  register: _lab_nfs_base

- name: Fail when the cloud image is missing
  ansible.builtin.assert:
    that:
      - _lab_nfs_base.stat.exists
    fail_msg: >-
      {{ lab_nfs_base_image }} is missing. Provision it with the netris-lab
      prerequisites before enabling the storage endpoint.

- name: Ensure the storage bridge exists
  ansible.builtin.command:
    argv:
      - nmcli
      - con
      - add
      - type
      - bridge
      - ifname
      - "{{ lab_nfs_bridge }}"
      - con-name
      - "{{ lab_nfs_bridge }}"
      - ipv4.method
      - manual
      - ipv4.addresses
      - "{{ lab_nfs_bridge_ip }}/24"
      - ipv6.method
      - disabled
  register: _lab_nfs_bridge_add
  changed_when: _lab_nfs_bridge_add.rc == 0
  failed_when:
    - _lab_nfs_bridge_add.rc != 0
    - "'already exists' not in _lab_nfs_bridge_add.stderr"

- name: Bring the storage bridge up
  ansible.builtin.command:
    argv: [nmcli, con, up, "{{ lab_nfs_bridge }}"]
  changed_when: false

- name: Get firewalld state
  ansible.builtin.command: systemctl is-active firewalld
  register: _lab_nfs_firewalld
  changed_when: false
  failed_when: false

- name: Trust the storage bridge in firewalld
  ansible.posix.firewalld:
    zone: trusted
    interface: "{{ lab_nfs_bridge }}"
    permanent: true
    immediate: true
    state: enabled
  when:
    - _lab_nfs_firewalld is defined
    - _lab_nfs_firewalld.stdout | trim == 'running'

- name: Masquerade storage-VM internet traffic, never lab traffic
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --direct
      - --add-rule
      - ipv4
      - nat
      - POSTROUTING
      - "0"
      - -s
      - "{{ netris_storage_endpoint_cidr }}"
      - -o
      - "{{ ansible_default_ipv4.interface }}"
      - -j
      - MASQUERADE
  register: _lab_nfs_masq
  changed_when: "'ALREADY_ENABLED' not in _lab_nfs_masq.stdout"
  failed_when:
    - _lab_nfs_masq.rc != 0
    - "'ALREADY_ENABLED' not in _lab_nfs_masq.stdout"
  when:
    - _lab_nfs_firewalld is defined
    - _lab_nfs_firewalld.stdout | trim == 'running'

- name: Reload firewalld after the masquerade rule
  ansible.builtin.command: firewall-cmd --reload
  changed_when: false
  when:
    - _lab_nfs_firewalld is defined
    - _lab_nfs_firewalld.stdout | trim == 'running'

- name: Generate the lab NFS SSH key when absent
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -t
      - ed25519
      - -N
      - ""
      - -f
      - "{{ lab_nfs_ssh_key }}"
  args:
    creates: "{{ lab_nfs_ssh_key }}"
  changed_when: true

- name: Read the lab NFS public key
  ansible.builtin.slurp:
    src: "{{ lab_nfs_ssh_key }}.pub"
  register: _lab_nfs_pub

- name: Create the VM disk overlay
  ansible.builtin.command:
    argv:
      - qemu-img
      - create
      - -f
      - qcow2
      - -F
      - qcow2
      - -b
      - "{{ lab_nfs_base_image }}"
      - "{{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}.qcow2"
      - "{{ lab_nfs_disk_gb }}G"
  args:
    creates: "{{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}.qcow2"
  register: _lab_nfs_overlay

- name: Render the cloud-init user data
  ansible.builtin.template:
    src: user-data.yaml.j2
    dest: "{{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}-user-data.yaml"
    mode: "0600"

- name: Render the cloud-init meta data
  ansible.builtin.template:
    src: meta-data.yaml.j2
    dest: "{{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}-meta-data.yaml"
    mode: "0600"

- name: Render the cloud-init network config
  ansible.builtin.template:
    src: network-config.yaml.j2
    dest: "{{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}-network-config.yaml"
    mode: "0600"

- name: Build the cloud-init seed ISO
  ansible.builtin.command:
    argv:
      - genisoimage
      - -output
      - "{{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}-seed.iso"
      - -volid
      - cidata
      - -joliet
      - -rock
      - "{{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}-user-data.yaml"
      - "{{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}-meta-data.yaml"
      - "{{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}-network-config.yaml"
  args:
    creates: "{{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}-seed.iso"

- name: Define and start the lab NFS domain
  ansible.builtin.command:
    argv:
      - virt-install
      - --name
      - "{{ lab_nfs_vm_name }}"
      - --memory
      - "{{ lab_nfs_memory_mb }}"
      - --vcpus
      - "{{ lab_nfs_vcpu }}"
      - --disk
      - "path={{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}.qcow2,format=qcow2,bus=virtio"
      - --disk
      - "path={{ lab_nfs_image_dir }}/{{ lab_nfs_vm_name }}-seed.iso,device=cdrom"
      - --network
      - "bridge={{ lab_nfs_bridge }},model=virtio,mac={{ lab_nfs_mac }}"
      - --import
      - --noautoconsole
      - --graphics
      - none
      - --console
      - pty,target_type=serial
  args:
    creates: "/etc/libvirt/qemu/{{ lab_nfs_vm_name }}.xml"
  register: _lab_nfs_define

- name: Ensure the lab NFS domain is running
  ansible.builtin.command:
    argv: [virsh, start, "{{ lab_nfs_vm_name }}"]
  register: _lab_nfs_start
  changed_when: _lab_nfs_start.rc == 0
  failed_when:
    - _lab_nfs_start.rc != 0
    - "'already active' not in _lab_nfs_start.stderr"

- name: Wait for the NFS server SSH port
  ansible.builtin.wait_for:
    host: "{{ lab_nfs_server_ip }}"
    port: 22
    delay: 5
    timeout: 900

- name: Wait for cloud-init to finish
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ lab_nfs_ssh_key }}"
      - -o
      - StrictHostKeyChecking=no
      - -o
      - UserKnownHostsFile=/dev/null
      - "{{ lab_nfs_ssh_user }}@{{ lab_nfs_server_ip }}"
      - cloud-init status --wait
  register: _lab_nfs_cloud_init
  changed_when: false
  retries: 30
  delay: 10
  until: _lab_nfs_cloud_init.rc == 0

- name: Verify NFSv4.1 and the client-address logger
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ lab_nfs_ssh_key }}"
      - -o
      - StrictHostKeyChecking=no
      - -o
      - UserKnownHostsFile=/dev/null
      - "{{ lab_nfs_ssh_user }}@{{ lab_nfs_server_ip }}"
      - >-
        exportfs -v && systemctl is-active nfs-server
        && systemctl is-active osac-nfs-clients
        && grep -q '+4.1' /proc/fs/nfsd/versions
  register: _lab_nfs_verify
  changed_when: false
  retries: 12
  delay: 10
  until: _lab_nfs_verify.rc == 0

- name: Route the storage bridge through the ISP server
  ansible.builtin.command:
    argv:
      - ssh
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=no
      - "root@{{ lab_nfs_isp_ip }}"
      - "ip route replace {{ netris_storage_endpoint_cidr }} via {{ lab_nfs_isp_gateway }}"
  changed_when: false

- name: Show the endpoint
  ansible.builtin.debug:
    msg:
      - "NFS server: {{ lab_nfs_server_ip }}:{{ lab_nfs_export }}"
      - "Client log: {{ lab_nfs_client_log }}"
      - "Excluded CIDR: {{ netris_storage_endpoint_cidr }}"
