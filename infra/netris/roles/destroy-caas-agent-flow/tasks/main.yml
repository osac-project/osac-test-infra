---
# Delete the named CaaS/MaaS cluster via osac CLI, then tear down discovery
# agents / InfraEnv / worker VM disks.
#
# Cluster delete previously no-oped: osac was never logged in in this role, so
# "get clusters" returned nothing and the delete task was skipped.

- name: Resolve OSAC namespace for destroy
  ansible.builtin.set_fact:
    _destroy_osac_ns: "{{ snapshot_osac_namespace | default(osac_namespace) }}"

- name: Get fulfillment internal API host
  ansible.builtin.shell:
    cmd: >-
      oc get route fulfillment-internal-api -n {{ _destroy_osac_ns }}
      -o jsonpath='{.status.ingress[0].host}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _destroy_ful_host
  changed_when: false
  failed_when: _destroy_ful_host.rc != 0 or (_destroy_ful_host.stdout | trim | length) == 0

- name: Ensure osac CLI config directory exists
  ansible.builtin.file:
    path: /root/.config/osac
    state: directory
    mode: "0700"

- name: Log in osac CLI (admin token)
  ansible.builtin.shell: |
    set -euo pipefail
    rm -f /root/.config/osac/secrets.json
    osac logout >/dev/null 2>&1 || true
    osac login --insecure --private \
      --token-script "oc create token -n {{ _destroy_osac_ns }} admin --duration 1h" \
      --address "https://{{ _destroy_ful_host.stdout | trim }}"
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: true

- name: Resolve cluster ID for {{ caas_cluster_name }}
  ansible.builtin.shell: |
    set -euo pipefail
    osac get clusters -o json | python3 -c '
    import json, sys
    raw = json.load(sys.stdin)
    clusters = raw if isinstance(raw, list) else (raw.get("items") or [raw])
    name = sys.argv[1]

    def cluster_name(c):
        if not isinstance(c, dict):
            return ""
        # Table "NAME" column is metadata.name; top-level name is often unset.
        meta = c.get("metadata") if isinstance(c.get("metadata"), dict) else {}
        return (meta.get("name") or c.get("name") or "")

    matches = [c.get("id", "") for c in clusters if cluster_name(c) == name and c.get("id")]
    print(matches[0] if matches else "")
    ' "{{ caas_cluster_name }}"
  environment:
    KUBECONFIG: /root/.kube/config
  register: _cluster_id
  changed_when: false
  failed_when: false

- name: Report when named cluster is already absent
  ansible.builtin.debug:
    msg: "No osac cluster named '{{ caas_cluster_name }}' — skip osac delete"
  when: (_cluster_id.stdout | trim | length) == 0

- name: Delete cluster via osac CLI
  ansible.builtin.command:
    cmd: osac delete cluster {{ _cluster_id.stdout | trim }}
  environment:
    KUBECONFIG: /root/.kube/config
  register: _osac_delete
  when: (_cluster_id.stdout | trim | length) > 0
  changed_when: _osac_delete.rc == 0
  failed_when: false

- name: Warn if osac delete failed
  ansible.builtin.debug:
    msg: >-
      osac delete cluster {{ _cluster_id.stdout | trim }} failed
      (rc={{ _osac_delete.rc }}): {{ _osac_delete.stderr | default(_osac_delete.stdout) | trim }}
  when:
    - _osac_delete is not skipped
    - _osac_delete.rc | default(0) != 0

# Step 2: Force-delete agents by removing finalizers
- name: Get agent names
  ansible.builtin.shell:
    cmd: oc get agent -n {{ caas_agent_namespace }} -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true
  environment:
    KUBECONFIG: /root/.kube/config
  register: _agents
  changed_when: false
  failed_when: false

- name: Remove finalizers from agents
  ansible.builtin.command:
    cmd: >-
      oc patch agent/{{ item }} -n {{ caas_agent_namespace }}
      --type=merge -p '{"metadata":{"finalizers":null}}'
  environment:
    KUBECONFIG: /root/.kube/config
  loop: "{{ _agents.stdout.split() }}"
  when: _agents.stdout | length > 0
  failed_when: false
  changed_when: true

- name: Delete agents
  ansible.builtin.command:
    cmd: oc delete agent --all -n {{ caas_agent_namespace }} --wait=false
  environment:
    KUBECONFIG: /root/.kube/config
  failed_when: false
  changed_when: true

# Step 3: Force-delete InfraEnv
- name: Remove finalizers from InfraEnv
  ansible.builtin.command:
    cmd: >-
      oc patch infraenv/{{ caas_discovery_infraenv_name }} -n {{ caas_discovery_infraenv_namespace }}
      --type=merge -p '{"metadata":{"finalizers":null}}'
  environment:
    KUBECONFIG: /root/.kube/config
  failed_when: false
  changed_when: true

- name: Delete InfraEnv
  ansible.builtin.command:
    cmd: oc delete infraenv {{ caas_discovery_infraenv_name }} -n {{ caas_discovery_infraenv_namespace }} --wait=false
  environment:
    KUBECONFIG: /root/.kube/config
  failed_when: false
  changed_when: true

# Step 4: Delete InfraEnv namespace
- name: Delete InfraEnv namespace
  ansible.builtin.command:
    cmd: oc delete namespace {{ caas_discovery_infraenv_namespace }} --wait=false
  environment:
    KUBECONFIG: /root/.kube/config
  failed_when: false
  changed_when: true

# Step 5: Shut down discovery VMs and clean up disks
- name: Find discovery VMs
  ansible.builtin.shell:
    cmd: virsh list --all --name | grep "{{ item }}" || true
  register: _discovery_vm_lookup
  changed_when: false
  failed_when: false
  loop: "{{ caas_discovery_vm_patterns }}"

- name: Build VM name list
  ansible.builtin.set_fact:
    caas_discovery_vms: "{{ _discovery_vm_lookup.results | selectattr('stdout', 'ne', '') | map(attribute='stdout_lines') | map('first') | list }}"

- name: Shut down running VMs
  ansible.builtin.command:
    cmd: virsh destroy {{ item }}
  loop: "{{ caas_discovery_vms }}"
  failed_when: false
  changed_when: true

- name: Remove discovery VM disks
  ansible.builtin.file:
    path: /var/lib/libvirt/images/{{ item }}-disk.qcow2
    state: absent
  loop: "{{ caas_discovery_vms }}"

- name: Remove discovery ISO
  ansible.builtin.file:
    path: /var/lib/libvirt/images/caas-discovery.iso
    state: absent
