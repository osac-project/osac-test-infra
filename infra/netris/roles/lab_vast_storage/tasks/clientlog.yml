---
# The E2E suite reads the translated client address from a tcpdump log on the
# VAST data interface. This is the VAST equivalent of the NFS server's client
# logger, and keeps the suite's observation contract unchanged.

- name: Install the VAST client observation
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ lab_vast_ssh_key }}"
      - -o
      - StrictHostKeyChecking=no
      - -o
      - UserKnownHostsFile=/dev/null
      - -o
      - ConnectTimeout=10
      - "centos@{{ lab_vast_mgmt_ip }}"
      - sudo bash -s
    stdin: |
      set -e
      command -v tcpdump >/dev/null 2>&1 || dnf install -y tcpdump >/dev/null
      cat > /etc/systemd/system/osac-vast-clients.service <<'EOF'
      [Unit]
      Description=OSAC lab VAST NFS client observation
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/bin/sh -c '/usr/sbin/tcpdump -ni {{ lab_vast_data_iface }} -l -s 128 "tcp port 2049" >> {{ lab_vast_client_log }} 2>&1'
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target
      EOF
      touch {{ lab_vast_client_log }}
      systemctl daemon-reload
      systemctl enable --now osac-vast-clients.service
      systemctl restart osac-vast-clients.service
      systemctl is-active osac-vast-clients.service

# A golden clone inherits the captured run's tcpdump lines, and the suite reads
# its NAT-address evidence from this log. Start every new overlay empty; never
# truncate on a re-run against the same overlay.
- name: Reset the VAST client observation log for a new overlay
  when: _lab_vast_fresh_overlay | default(false) | bool
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ lab_vast_ssh_key }}"
      - -o
      - StrictHostKeyChecking=no
      - -o
      - UserKnownHostsFile=/dev/null
      - -o
      - ConnectTimeout=10
      - "centos@{{ lab_vast_mgmt_ip }}"
      - sudo bash -s
    stdin: |
      set -e
      : > {{ lab_vast_client_log }}
      systemctl restart osac-vast-clients.service
  changed_when: true

- name: Require the client observation to be running
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ lab_vast_ssh_key }}"
      - -o
      - StrictHostKeyChecking=no
      - -o
      - UserKnownHostsFile=/dev/null
      - "centos@{{ lab_vast_mgmt_ip }}"
      - systemctl is-active osac-vast-clients.service
  register: _lab_vast_clientlog
  until: _lab_vast_clientlog.stdout | trim == 'active'
  retries: 10
  delay: 2
  changed_when: false
