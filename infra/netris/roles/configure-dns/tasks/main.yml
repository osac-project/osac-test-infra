---
- name: Get Route 53 hosted zone ID
  ansible.builtin.shell:
    cmd: >-
      aws route53 list-hosted-zones-by-name
      --dns-name {{ dns_hosted_zone }}
      --query "HostedZones[0].Id"
      --output text
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ aws_region }}"
  register: _r53_zone_id
  changed_when: false

- name: Check for existing OCP record under this lab name
  ansible.builtin.shell:
    cmd: >-
      aws route53 list-resource-record-sets
      --hosted-zone-id {{ _r53_zone_id.stdout | trim }}
      --query "ResourceRecordSets[?Name == 'api.{{ ocp_cluster_name }}.{{ ocp_base_domain }}.'].ResourceRecords[0].Value"
      --output text
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ aws_region }}"
  register: _r53_existing
  changed_when: false

- name: Fail if lab name is already in use by another lab
  ansible.builtin.fail:
    msg: >-
      api.{{ ocp_cluster_name }}.{{ ocp_base_domain }} already exists in Route 53
      pointing to {{ _r53_existing.stdout | trim }} (expected {{ ocp_dnat_ip }}) —
      another lab is using LAB_NAME="{{ lab_name }}". Choose a different name.
  when: >-
    _r53_existing.stdout | trim | length > 0 and
    _r53_existing.stdout | trim != 'None' and
    _r53_existing.stdout | trim != ocp_dnat_ip

- name: Create OCP DNS records in Route 53
  ansible.builtin.shell:
    cmd: >-
      aws route53 change-resource-record-sets
      --hosted-zone-id {{ _r53_zone_id.stdout | trim }}
      --change-batch '{{ _r53_batch | to_json }}'
      --output json
  vars:
    _r53_batch:
      Changes:
        - Action: UPSERT
          ResourceRecordSet:
            Name: "api.{{ ocp_cluster_name }}.{{ ocp_base_domain }}"
            Type: A
            TTL: 300
            ResourceRecords:
              - Value: "{{ ocp_dnat_ip }}"
        - Action: UPSERT
          ResourceRecordSet:
            Name: "api-int.{{ ocp_cluster_name }}.{{ ocp_base_domain }}"
            Type: A
            TTL: 300
            ResourceRecords:
              - Value: "{{ ocp_dnat_ip }}"
        - Action: UPSERT
          ResourceRecordSet:
            Name: "*.apps.{{ ocp_cluster_name }}.{{ ocp_base_domain }}"
            Type: A
            TTL: 300
            ResourceRecords:
              - Value: "{{ ocp_dnat_ip }}"
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ aws_region }}"
  changed_when: true
  register: _r53_ocp_records_change

- name: Wait for OCP Route 53 records to become authoritative
  ansible.builtin.command:
    argv:
      - aws
      - route53
      - get-change
      - --id
      - "{{ (_r53_ocp_records_change.stdout | from_json).ChangeInfo.Id }}"
      - --query
      - ChangeInfo.Status
      - --output
      - text
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ aws_region }}"
  register: _r53_ocp_change_status
  until: _r53_ocp_change_status.stdout | trim == 'INSYNC'
  retries: 36
  delay: 5
  changed_when: false

- name: Read back each OCP Route 53 record target
  ansible.builtin.command:
    argv:
      - aws
      - route53
      - list-resource-record-sets
      - --hosted-zone-id
      - "{{ _r53_zone_id.stdout | trim }}"
      - --query
      - "ResourceRecordSets[?Name == '{{ item.route53_api_name }}'].ResourceRecords[].Value"
      - --output
      - text
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ aws_region }}"
  loop:
    - route53_name: "api.{{ ocp_cluster_name }}.{{ ocp_base_domain }}."
      route53_api_name: "api.{{ ocp_cluster_name }}.{{ ocp_base_domain }}."
    - route53_name: "api-int.{{ ocp_cluster_name }}.{{ ocp_base_domain }}."
      route53_api_name: "api-int.{{ ocp_cluster_name }}.{{ ocp_base_domain }}."
    - route53_name: "*.apps.{{ ocp_cluster_name }}.{{ ocp_base_domain }}."
      # Route 53 escapes '*' as \052 in ListResourceRecordSets responses.
      route53_api_name: '\052.apps.{{ ocp_cluster_name }}.{{ ocp_base_domain }}.'
  loop_control:
    label: "{{ item.route53_name }}"
  register: _r53_ocp_record_checks
  changed_when: false

- name: Require OCP Route 53 records to target the Netris DNAT frontend
  ansible.builtin.assert:
    that:
      - item.stdout | trim == ocp_dnat_ip
    fail_msg: >-
      Route 53 record {{ item.item.route53_name }} resolves to {{ item.stdout | trim }};
      expected {{ ocp_dnat_ip }}.
  loop: "{{ _r53_ocp_record_checks.results }}"
  loop_control:
    label: "{{ item.item.route53_name }}"

- name: Configure DNS for OCP SNO
  ansible.builtin.copy:
    content: |
      address=/api.{{ ocp_cluster_name }}.{{ ocp_base_domain }}/{{ ocp_dnat_ip }}
      address=/api-int.{{ ocp_cluster_name }}.{{ ocp_base_domain }}/{{ ocp_dnat_ip }}
      address=/.apps.{{ ocp_cluster_name }}.{{ ocp_base_domain }}/{{ ocp_dnat_ip }}
    dest: /etc/dnsmasq.d/ocp-sno.conf
    mode: "0644"
  notify: Restart dnsmasq

- name: Enable and start dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    state: started
    enabled: true

- name: Add localhost as DNS resolver
  ansible.builtin.lineinfile:
    path: /etc/resolv.conf
    insertbefore: BOF
    line: "nameserver 127.0.0.1"
    state: present

- name: Apply the local dnsmasq records before checking resolution
  ansible.builtin.meta: flush_handlers

- name: Resolve OCP endpoints through the host resolver
  block:
    - name: Check local resolution for OCP API, API-int, and console
      ansible.builtin.command:
        argv:
          - getent
          - ahostsv4
          - "{{ item }}"
      loop:
        - "api.{{ ocp_cluster_name }}.{{ ocp_base_domain }}"
        - "api-int.{{ ocp_cluster_name }}.{{ ocp_base_domain }}"
        - "console-openshift-console.apps.{{ ocp_cluster_name }}.{{ ocp_base_domain }}"
      loop_control:
        label: "{{ item }}"
      register: _ocp_local_dns_checks
      until:
        - _ocp_local_dns_checks.rc == 0
        - ocp_dnat_ip in _ocp_local_dns_checks.stdout
      retries: 10
      delay: 3
      changed_when: false
  rescue:
    - name: Create the OCP endpoint diagnostics directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../logs/ocp-boot-failure"
        state: directory
        mode: "0755"
      failed_when: false

    - name: Save failed local OCP DNS probe results
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../logs/ocp-boot-failure/local-dns-probes.json"
        content: "{{ _ocp_local_dns_checks | default({}) | to_nice_json }}\n"
        mode: "0644"
      failed_when: false

    - name: Preserve failure because local OCP DNS does not target the DNAT frontend
      ansible.builtin.fail:
        msg: >-
          Local DNS did not resolve every OCP API and console endpoint to
          {{ ocp_dnat_ip }}. Probe details were saved to
          {{ playbook_dir }}/../logs/ocp-boot-failure/local-dns-probes.json.
