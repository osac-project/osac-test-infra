                line = re.sub(r"(?i)\bBearer\s+\S+", "Bearer <REDACTED>", line)
                line = re.sub(r"(?i)(\b(?:password|passwd|secret|token|authorization|cookie|connect\.sid|auth(?:entication)?(?:key|password)?|private[_-]?key)\b[\"\']?\s*[:=]\s*)(?:\"[^\"]*\"|'[^']*'|[^,\s}\]]+)", r"\1<REDACTED>", line)
                print(line)
    stdin: "{{ (_gather_cudn_evpn_frr_bgp.stdout | default('')) ~ '\n' ~ (_gather_cudn_evpn_frr_bgp.stderr | default('')) }}"
  register: _gather_cudn_evpn_frr_bgp_sanitized
  changed_when: false
  failed_when: false
  no_log: true

- name: Write sanitized FRR BGP and EVPN summaries
  ansible.builtin.copy:
    dest: "{{ _gather_dir }}/cudn-evpn/frr-bgp-evpn-summary.txt"
    mode: "0644"
    content: "{{ _gather_cudn_evpn_frr_bgp_sanitized.stdout | default('unavailable') }}"
  changed_when: false
  failed_when: false
  no_log: true
