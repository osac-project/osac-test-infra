        import sys

        sensitive = re.compile(r"password|secret|token|authorization|cookie|connect\.sid|auth|private[_-]?key", re.I)
        key_value = re.compile(r"^(\s*(?:[-{,]\s*)?([^:=\n]+?)\s*[:=]\s*)(.*)$")
