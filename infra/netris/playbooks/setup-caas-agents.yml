---
# Standalone playbook for cluster-namespace agent setup (Option C).
# Normally this role is included by create-caas during deploy-caas;
# this playbook exists for manual/debugging invocation only.
#
# Requires caas_cluster_order_namespace to be passed as an extra var
# (e.g. -e caas_cluster_order_namespace=<ns>).
- name: Set up CaaS agents in ClusterOrder namespace
  hosts: all
  gather_facts: false
  roles:
    - setup-caas-agents
