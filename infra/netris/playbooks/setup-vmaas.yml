---
- name: Ensure the lab ExternalIPPool and check VMaaS cluster and OSAC readiness
  hosts: all
  gather_facts: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  tasks:
    - name: Check the selected OCP kubeconfig exists
      ansible.builtin.stat:
        path: "{{ kubeconfig_path }}"
      register: _vmaas_kubeconfig

    - name: Require the selected OCP kubeconfig
      ansible.builtin.assert:
        that:
          - _vmaas_kubeconfig.stat.exists
          - _vmaas_kubeconfig.stat.isreg
        fail_msg: "OCP kubeconfig is missing or is not a regular file: {{ kubeconfig_path }}"

    # Tenant default networking allocates its default-nat ExternalIP from a READY
    # IPv4 pool, and the E2E session gate waits for DefaultNetworkingReady before
    # any test runs. Only the CaaS setup used to create the lab pool, so a VMaaS
    # deploy depended on a pool an earlier CaaS run left behind. Ensure it here.
    - name: Ensure the lab ExternalIPPool
      ansible.builtin.include_role:
        name: lab-external-ip-pool

    - name: Check the OCP API is ready
      ansible.builtin.command:
        argv:
          - oc
          - get
          - --raw=/readyz
      register: _vmaas_api_ready
      changed_when: false

    - name: Require the OCP API to be ready
      ansible.builtin.assert:
        that:
          - _vmaas_api_ready.stdout | trim == 'ok'
        fail_msg: >-
          OCP API readiness check failed: rc={{ _vmaas_api_ready.rc }},
          stdout={{ _vmaas_api_ready.stdout | default('') | trim }},
          stderr={{ _vmaas_api_ready.stderr | default('') | trim }}.

    - name: Read OCP infrastructure identity
      ansible.builtin.command:
        argv: [oc, get, infrastructure/cluster, -o, json]
      register: _vmaas_infrastructure_raw
      changed_when: false

    - name: Read OCP ClusterVersion
      ansible.builtin.command:
        argv: [oc, get, clusterversion/version, -o, json]
      register: _vmaas_cluster_version_raw
      changed_when: false

    - name: Read OCP network configuration
      ansible.builtin.command:
        argv: [oc, get, network.operator.openshift.io/cluster, -o, json]
      register: _vmaas_network_raw
      changed_when: false

    - name: Read OCP nodes
      ansible.builtin.command:
        argv: [oc, get, nodes, -o, json]
      register: _vmaas_nodes_raw
      changed_when: false

    - name: Wait for OVN EVPN API definitions to become Established
      ansible.builtin.command:
        argv:
          - oc
          - get
          - "crd/{{ item }}"
          - -o
          - json
      register: _vmaas_evpn_crd_raw
      until: >-
        _vmaas_evpn_crd_raw.rc == 0 and
        ((_vmaas_evpn_crd_raw.stdout | from_json).status.conditions | default([])
         | selectattr('type', 'equalto', 'Established')
         | selectattr('status', 'equalto', 'True') | list | length) > 0
      retries: 60
      delay: 10
      changed_when: false
      loop:
        - clusteruserdefinednetworks.k8s.ovn.org
        - vteps.k8s.ovn.org
        - routeadvertisements.k8s.ovn.org
        - bgpsessionstates.frrk8s.metallb.io
      loop_control:
        label: "{{ item }}"

    - name: Read the OCP network ClusterOperator
      ansible.builtin.command:
        argv: [oc, get, clusteroperator/network, -o, json]
      register: _vmaas_network_operator_raw
      until: >-
        _vmaas_network_operator_raw.rc == 0 and
        ((_vmaas_network_operator_raw.stdout | from_json).status.conditions | default([])
         | selectattr('type', 'equalto', 'Available') | map(attribute='status') | first | default('False')) == 'True' and
        ((_vmaas_network_operator_raw.stdout | from_json).status.conditions | default([])
         | selectattr('type', 'equalto', 'Progressing') | map(attribute='status') | first | default('True')) == 'False'
      retries: 60
      delay: 10
      changed_when: false

    - name: Parse OCP identity and convergence status
      ansible.builtin.set_fact:
        _vmaas_infrastructure: "{{ _vmaas_infrastructure_raw.stdout | from_json }}"
        _vmaas_cluster_version: "{{ _vmaas_cluster_version_raw.stdout | from_json }}"
        _vmaas_network: "{{ _vmaas_network_raw.stdout | from_json }}"
        _vmaas_node_names: >-
          {{ (_vmaas_nodes_raw.stdout | from_json)['items'] | map(attribute='metadata.name') | list }}
        _vmaas_node_name: >-
          {{ ((_vmaas_nodes_raw.stdout | from_json)['items'] | map(attribute='metadata.name') | list | first) | default('', true) }}
        _vmaas_network_operator: "{{ _vmaas_network_operator_raw.stdout | from_json }}"
        _vmaas_current_history: >-
          {{ (_vmaas_cluster_version_raw.stdout | from_json).status.history | default([], true) | first | default({}, true) }}
        _vmaas_desired_version: >-
          {{ (_vmaas_cluster_version_raw.stdout | from_json).status.desired.version | default('Unknown', true) }}
        _vmaas_current_version: >-
          {{ (((_vmaas_cluster_version_raw.stdout | from_json).status.history | default([], true) | first | default({}, true)).version) | default('Unknown', true) }}
        _vmaas_current_state: >-
          {{ (((_vmaas_cluster_version_raw.stdout | from_json).status.history | default([], true) | first | default({}, true)).state) | default('Unknown', true) }}
        _vmaas_cv_available: >-
          {{ ((_vmaas_cluster_version_raw.stdout | from_json).status.conditions | default([])
             | selectattr('type', 'equalto', 'Available') | map(attribute='status') | first) | default('Unknown', true) }}
        _vmaas_cv_progressing: >-
          {{ ((_vmaas_cluster_version_raw.stdout | from_json).status.conditions | default([])
             | selectattr('type', 'equalto', 'Progressing') | map(attribute='status') | first) | default('Unknown', true) }}
        _vmaas_cv_failing: >-
          {{ ((_vmaas_cluster_version_raw.stdout | from_json).status.conditions | default([])
             | selectattr('type', 'equalto', 'Failing') | map(attribute='status') | first) | default('Unknown', true) }}
        _vmaas_cv_observed_generation: >-
          {{ (_vmaas_cluster_version_raw.stdout | from_json).status.observedGeneration | default(-1, true) | int }}
        _vmaas_cv_metadata_generation: >-
          {{ (_vmaas_cluster_version_raw.stdout | from_json).metadata.generation | default(-2, true) | int }}

    - name: Require a converged OCP 4.22 OVNKubernetes cluster
      ansible.builtin.assert:
        that:
          - _vmaas_desired_version.split('.')[:2] | join('.') == ocp_evpn_required_version
          - _vmaas_current_version.split('.')[:2] | join('.') == ocp_evpn_required_version
          - _vmaas_current_version == _vmaas_desired_version
          - _vmaas_current_state == 'Completed'
          - (_vmaas_cv_available | string) == 'True'
          - (_vmaas_cv_progressing | string) == 'False'
          - (_vmaas_cv_failing | string) == 'False'
          - _vmaas_cv_observed_generation == _vmaas_cv_metadata_generation
          - _vmaas_network.spec.defaultNetwork.type == 'OVNKubernetes'
          - _vmaas_node_names | length == 1
        fail_msg: >-
          VMaaS CUDN EVPN requires a converged single-node OCP {{ ocp_evpn_required_version }}
          cluster using OVNKubernetes. Observed platform={{
          _vmaas_infrastructure.status.platformStatus.type | default('Unknown') }},
          desired={{ _vmaas_desired_version }}, current={{ _vmaas_current_version }},
          history.state={{ _vmaas_current_state }}, Available={{ _vmaas_cv_available }},
          Progressing={{ _vmaas_cv_progressing }}, Failing={{ _vmaas_cv_failing }},
          observedGeneration={{ _vmaas_cv_observed_generation }},
          metadata.generation={{ _vmaas_cv_metadata_generation }},
          networkType={{ _vmaas_network.spec.defaultNetwork.type | default('Unknown') }}.

    - name: Require the CNO EVPN routing settings
      ansible.builtin.assert:
        that:
          - _vmaas_network.spec.additionalRoutingCapabilities.providers | default([]) == ['FRR']
          - _vmaas_network.spec.defaultNetwork.ovnKubernetesConfig.routeAdvertisements | default('') == 'Enabled'
          - _vmaas_network.spec.defaultNetwork.ovnKubernetesConfig.gatewayConfig.routingViaHost | default(false) | bool
          - _vmaas_network.spec.defaultNetwork.ovnKubernetesConfig.gatewayConfig.ipForwarding | default('') == 'Global'
          - >-
            ((_vmaas_network_operator.status.conditions | default([])
              | selectattr('type', 'equalto', 'Available') | map(attribute='status') | first) | default('False')) == 'True'
          - >-
            ((_vmaas_network_operator.status.conditions | default([])
              | selectattr('type', 'equalto', 'Progressing') | map(attribute='status') | first) | default('True')) == 'False'
          - >-
            ((_vmaas_network_operator.status.conditions | default([])
              | selectattr('type', 'equalto', 'Degraded') | map(attribute='status') | first) | default('True')) == 'False'
        fail_msg: >-
          CNO must have FRR routing, OVN RouteAdvertisements, host-based routing,
          and Global IP forwarding enabled, and the network ClusterOperator must
          be Available with Progressing and Degraded false. No resources were changed.

    - name: Require the underlay and ExternalIP return path when enabled
      ansible.builtin.assert:
        that:
          - ocp_underlay_enabled | default(false) | bool
          - not (ocp_vmaas_external_ip_tests_enabled | default(false) | bool) or (ocp_vmaas_external_ip_return_path_acknowledged | default(false) | bool)
        fail_msg: >-
          VMaaS requires the dedicated underlay. If the external_ip/ and references/ tests are enabled (ocp_vmaas_external_ip_tests_enabled),
          their separate 172.27.0.0/16 return path must also be independently
          provisioned and acknowledged. This check does not mutate or verify
          external Netris/ISP policy; BGP peer state is checked below.

    - name: Derive the expected EVPN underlay peers from the configured networks
      ansible.builtin.set_fact:
        _vmaas_leaf_peer_ip: >-
          {{ ocp_underlay_p2p_cidr | ansible.utils.ipaddr('1') | ansible.utils.ipaddr('address') }}
        _vmaas_backup_leaf_peer_ip: >-
          {{ ocp_evpn_backup_p2p_cidr | ansible.utils.ipaddr('1') | ansible.utils.ipaddr('address') }}
        _vmaas_active_backup: "{{ ocp_evpn_bgp_active_backup | default(false) | bool }}"
        _vmaas_unnumbered: "{{ ocp_evpn_bgp_unnumbered | default(false) | bool }}"
        _vmaas_expected_neighbor_count: "{{ 2 if (ocp_evpn_bgp_active_backup | default(false) | bool) else 1 }}"

    - name: Collect the expected numbered EVPN peer identities
      ansible.builtin.set_fact:
        _vmaas_expected_peer_ips: >-
          {{ [_vmaas_leaf_peer_ip]
             + ([_vmaas_backup_leaf_peer_ip] if (ocp_evpn_bgp_active_backup | default(false) | bool) else []) }}

    - name: Read the single-node underlay NNCP
      ansible.builtin.command:
        argv:
          - oc
          - get
          - "nncp/osac-evpn-{{ _vmaas_node_name }}"
          - -o
          - json
      register: _vmaas_nncp_raw
      until: >-
        _vmaas_nncp_raw.rc == 0 and
        ((_vmaas_nncp_raw.stdout | from_json).status.conditions | default([])
         | selectattr('type', 'equalto', 'Available')
         | selectattr('status', 'equalto', 'True') | list | length) > 0
      retries: 60
      delay: 10
      changed_when: false

    - name: Read the OVN VTEP allocation
      ansible.builtin.command:
        argv: [oc, get, vteps.k8s.ovn.org/tenant-vtep, -o, json]
      register: _vmaas_vtep_raw
      until: >-
        _vmaas_vtep_raw.rc == 0 and
        ((_vmaas_vtep_raw.stdout | from_json).status.conditions | default([])
         | selectattr('type', 'equalto', 'Accepted')
         | selectattr('status', 'equalto', 'True')
         | selectattr('reason', 'equalto', 'Allocated') | list | length) > 0
      retries: 60
      delay: 10
      changed_when: false

    - name: Read the OCP FRR peer configuration
      ansible.builtin.command:
        argv:
          - oc
          - get
          - "frrconfigurations.frrk8s.metallb.io/osac-evpn-{{ _vmaas_node_name }}"
          - -n
          - openshift-frr-k8s
          - -o
          - json
      register: _vmaas_frr_raw
      changed_when: false

    - name: Derive EVPN neighbor identities from the FRRConfiguration
      ansible.builtin.set_fact:
        _vmaas_frr_neighbors: >-
          {{ (_vmaas_frr_raw.stdout | from_json).spec.bgp.routers[0].neighbors | default([]) }}
        _vmaas_peer_ids: >-
          {{ ((_vmaas_frr_raw.stdout | from_json).spec.bgp.routers[0].neighbors | default([])
              | map(attribute='interface') | list)
             if (ocp_evpn_bgp_unnumbered | default(false) | bool)
             else ((_vmaas_frr_raw.stdout | from_json).spec.bgp.routers[0].neighbors | default([])
              | map(attribute='address') | list) }}

    - name: Read the OCP host EVPN address-family configuration
      ansible.builtin.command:
        argv:
          - oc
          - get
          - "frrconfigurations.frrk8s.metallb.io/osac-evpn-raw-{{ _vmaas_node_name }}"
          - -n
          - openshift-frr-k8s
          - -o
          - json
      register: _vmaas_evpn_frr_raw
      changed_when: false

    - name: Read the OCP RouteAdvertisements resource
      ansible.builtin.command:
        argv: [oc, get, routeadvertisements.k8s.ovn.org/osac-evpn, -o, json]
      register: _vmaas_route_advertisements_raw
      changed_when: false

    - name: Read EVPN CUDNs selected by RouteAdvertisements
      ansible.builtin.command:
        argv:
          - oc
          - get
          - clusteruserdefinednetworks.k8s.ovn.org
          - --selector
          - evpn=true
          - -o
          - json
      register: _vmaas_evpn_cudns_raw
      changed_when: false

    - name: Read every expected EVPN BGP session state in one snapshot
      ansible.builtin.command:
        argv:
          - oc
          - get
          - bgpsessionstates.frrk8s.metallb.io
          - --all-namespaces
          - --selector
          - "frrk8s.metallb.io/node={{ _vmaas_node_name }},frrk8s.metallb.io/peer in ({{ _vmaas_peer_ids | join(',') }})"
          - -o
          - json
      register: _vmaas_bgp_sessions_raw
      until: >-
        _vmaas_bgp_sessions_raw.rc == 0 and
        (((_vmaas_bgp_sessions_raw.stdout | from_json)['items'] | default([])
          | selectattr('status.bgpStatus', 'equalto', 'Established') | list | length)
         == (_vmaas_expected_neighbor_count | int))
      retries: 60
      delay: 10
      changed_when: false

    - name: Parse Task 3 EVPN readiness resources
      ansible.builtin.set_fact:
        _vmaas_nncp: "{{ _vmaas_nncp_raw.stdout | from_json }}"
        _vmaas_vtep: "{{ _vmaas_vtep_raw.stdout | from_json }}"
        _vmaas_frr: "{{ _vmaas_frr_raw.stdout | from_json }}"
        _vmaas_evpn_frr: "{{ _vmaas_evpn_frr_raw.stdout | from_json }}"
        _vmaas_route_advertisements: "{{ _vmaas_route_advertisements_raw.stdout | from_json }}"
        _vmaas_evpn_cudns: "{{ _vmaas_evpn_cudns_raw.stdout | from_json }}"
        _vmaas_bgp_sessions: "{{ _vmaas_bgp_sessions_raw.stdout | from_json }}"
        _vmaas_evpn_raw: "{{ (_vmaas_evpn_frr_raw.stdout | from_json).spec.raw.rawConfig | default('') }}"
        _vmaas_node_asn: "{{ (((_vmaas_frr_raw.stdout | from_json).get('spec', {}).get('bgp', {}).get('routers', []) | first | default({})).get('asn', 0) | int) }}"

    - name: Require the underlay NNCP to be Available
      ansible.builtin.assert:
        that:
          - >-
            (_vmaas_nncp.status.conditions | default([])
             | selectattr('type', 'equalto', 'Available')
             | selectattr('status', 'equalto', 'True') | list | length) > 0
        fail_msg: "NNCP osac-evpn-{{ _vmaas_node_name }} is not Available=True."

    - name: Require the VTEP to be allocated
      ansible.builtin.assert:
        that:
          - >-
            (_vmaas_vtep.status.conditions | default([])
             | selectattr('type', 'equalto', 'Accepted')
             | selectattr('status', 'equalto', 'True')
             | selectattr('reason', 'equalto', 'Allocated') | list | length) > 0
        fail_msg: "VTEP tenant-vtep is not Accepted=True/Allocated."

    - name: Require the default-VRF EVPN underlay neighbors
      ansible.builtin.assert:
        that:
          - _vmaas_frr.metadata.labels.evpn | default('') == 'true'
          - _vmaas_frr.spec.bgp.routers | length == 1
          - _vmaas_frr.spec.bgp.routers[0].vrf | default('') == ''
          - _vmaas_frr_neighbors | length == (_vmaas_expected_neighbor_count | int)
          - (_vmaas_peer_ids | unique | list | length) == (_vmaas_expected_neighbor_count | int)
          - (_vmaas_unnumbered | bool) or
            ((_vmaas_peer_ids | sort) == (_vmaas_expected_peer_ips | sort))
          - (not (_vmaas_unnumbered | bool)) or
            ((_vmaas_frr_neighbors | selectattr('address', 'defined') | list | length) == 0)
        fail_msg: >-
          FRRConfiguration osac-evpn-{{ _vmaas_node_name }} must have the
          evpn=true label and {{ _vmaas_expected_neighbor_count }} default-VRF
          neighbor(s). Expected numbered peers
          {{ _vmaas_expected_peer_ips | join(', ') }}, or interface-based
          peers for unnumbered mode. Observed neighbors={{ _vmaas_frr_neighbors | to_json }}.

    - name: Require the OCP host EVPN address family
      ansible.builtin.assert:
        that:
          - _vmaas_evpn_frr.spec.raw.priority | int == 5
          - _vmaas_evpn_frr.spec.nodeSelector.matchLabels['kubernetes.io/hostname'] | length > 0
          - "'address-family l2vpn evpn' in _vmaas_evpn_raw"
          - "'allowas-in origin' in _vmaas_evpn_raw"
          - "'advertise-all-vni' in _vmaas_evpn_raw"
        fail_msg: >-
          FRRConfiguration osac-evpn-raw-{{ _vmaas_node_name }} must configure
          the host L2VPN EVPN address family with allowas-in origin and
          advertise-all-vni.

    - name: Require every EVPN underlay neighbor in the host L2VPN EVPN address family
      ansible.builtin.assert:
        that:
          - "('neighbor ' ~ item ~ ' activate') in _vmaas_evpn_raw"
          - "('neighbor ' ~ item ~ ' allowas-in origin') in _vmaas_evpn_raw"
        fail_msg: >-
          FRRConfiguration osac-evpn-raw-{{ _vmaas_node_name }} must activate
          neighbor {{ item }} with allowas-in origin in the L2VPN EVPN
          address family.
      loop: "{{ _vmaas_peer_ids }}"

    - name: Require each unnumbered EVPN neighbor in the node NNCP
      ansible.builtin.assert:
        that:
          - item in (_vmaas_nncp.spec.desiredState.interfaces | map(attribute='name') | list)
        fail_msg: >-
          NNCP osac-evpn-{{ _vmaas_node_name }} does not configure the
          unnumbered neighbor interface {{ item }}.
      loop: "{{ _vmaas_peer_ids }}"
      when: _vmaas_unnumbered | bool

    - name: Require the active-active multipath EVPN policy
      ansible.builtin.assert:
        that:
          - "'bgp bestpath as-path multipath-relax' in _vmaas_evpn_raw"
          - "'maximum-paths 16' in _vmaas_evpn_raw"
        fail_msg: >-
          ocp_evpn_bgp_active_active is enabled but the host EVPN rawConfig
          does not enable as-path multipath-relax and maximum-paths 16.
      when: ocp_evpn_bgp_active_active | default(false) | bool

    - name: Require the active-backup EVPN neighbor policy
      ansible.builtin.assert:
        that:
          - "('route-map ' ~ _vmaas_peer_ids[0] ~ '-in permit 1') in _vmaas_evpn_raw"
          - "('route-map ' ~ _vmaas_peer_ids[1] ~ '-in permit 1') in _vmaas_evpn_raw"
          - "('route-map ' ~ _vmaas_peer_ids[1] ~ '-out permit 1') in _vmaas_evpn_raw"
          - "('neighbor ' ~ _vmaas_peer_ids[0] ~ ' route-map EVPN-ACTIVE-IN in') in _vmaas_evpn_raw"
          - "('neighbor ' ~ _vmaas_peer_ids[0] ~ ' route-map EVPN-ACTIVE-OUT out') in _vmaas_evpn_raw"
          - "('neighbor ' ~ _vmaas_peer_ids[1] ~ ' route-map EVPN-BACKUP-IN in') in _vmaas_evpn_raw"
          - "('neighbor ' ~ _vmaas_peer_ids[1] ~ ' route-map EVPN-BACKUP-OUT out') in _vmaas_evpn_raw"
          - >-
            (_vmaas_evpn_raw is search('(?s)route-map '
             ~ (_vmaas_peer_ids[0] | regex_escape)
             ~ '-in permit 1\s+description EVPN active uplink IPv4 unicast inbound'
             ~ '\s+match ip address prefix-list EVPN-REMOTE-VTEPS\s+set local-preference 200\\b'))
          - >-
            (_vmaas_evpn_raw is search('(?s)route-map '
             ~ (_vmaas_peer_ids[1] | regex_escape)
             ~ '-in permit 1\s+description EVPN backup uplink IPv4 unicast inbound'
             ~ '\s+match ip address prefix-list EVPN-REMOTE-VTEPS\s+set local-preference 100\\b'))
          - >-
            (_vmaas_evpn_raw is search('(?s)route-map '
             ~ (_vmaas_peer_ids[1] | regex_escape)
             ~ '-out permit 1\s+description EVPN backup uplink IPv4 unicast outbound'
             ~ '\s+match ip address prefix-list ' ~ (_vmaas_peer_ids[1] | regex_escape) ~ '-allowed-ipv4'
             ~ '\s+set as-path prepend ' ~ (_vmaas_node_asn | string) ~ ' '
             ~ (_vmaas_node_asn | string) ~ ' ' ~ (_vmaas_node_asn | string) ~ '\\b'))
          - >-
            (_vmaas_evpn_raw is search('(?s)route-map EVPN-ACTIVE-IN permit 10\s+description EVPN active uplink inbound\s+set local-preference 200\\b'))
          - >-
            (_vmaas_evpn_raw is search('(?s)route-map EVPN-BACKUP-OUT permit 10\s+description EVPN backup uplink outbound\s+set as-path prepend '
             ~ (_vmaas_node_asn | string) ~ ' ' ~ (_vmaas_node_asn | string) ~ ' '
             ~ (_vmaas_node_asn | string) ~ '\\b'))
          - (_vmaas_frr_neighbors[1].asn | int) == ((_vmaas_frr_neighbors[0].asn | int) + ((ocp_evpn_backup_leaf_index | int) - (ocp_underlay_leaf_index | int)))
        fail_msg: >-
          ocp_evpn_bgp_active_backup is enabled but the host EVPN rawConfig
          does not merge the active/backup IPv4 local-preference and prepend
          bodies into the frr-k8s generated route-maps, does not apply the
          L2VPN EVPN route-maps to {{ _vmaas_peer_ids | join(' (active) / ') }},
          or the backup neighbor ASN does not match its leaf index.
      when: _vmaas_active_backup | bool

    - name: Require the unnumbered IPv4 unicast policy to stay with frr-k8s
      ansible.builtin.assert:
        that:
          - "'ipv6 prefix-list' not in _vmaas_evpn_raw"
          - "'route-map' not in _vmaas_evpn_raw"
        fail_msg: >-
          An unnumbered EVPN neighbor must rely on the frr-k8s generated
          <peer>-in/<peer>-out IPv4 unicast route-maps. The chart must not add
          IPv6 prefix-lists or route-maps of its own for that neighbor.
      when:
        - _vmaas_unnumbered | bool
        - not (_vmaas_active_backup | bool)

    - name: Require the configured EVPN BFD profile
      ansible.builtin.assert:
        that:
          - (_vmaas_frr.spec.bgp.bfdProfiles | default([]) | length) > 0
          - (_vmaas_frr.spec.bgp.bfdProfiles[0].name | default('')) == (ocp_evpn_bfd_profile | trim)
        fail_msg: >-
          ocp_evpn_bfd_profile is set but the FRRConfiguration does not carry
          that BFD profile.
      when: (ocp_evpn_bfd_profile | default('') | trim | length) > 0

    - name: Require every expected EVPN underlay BGP session to be Established
      ansible.builtin.assert:
        that:
          - >-
            ((_vmaas_bgp_sessions['items'] | default([])
              | selectattr('status.bgpStatus', 'equalto', 'Established') | list | length)
             == (_vmaas_expected_neighbor_count | int))
        fail_msg: >-
          Expected an Established BGPSessionState for every EVPN underlay peer
          {{ _vmaas_peer_ids | join(', ') }}.

    - name: Require accepted PodNetwork RouteAdvertisements when an EVPN CUDN exists
      ansible.builtin.assert:
        that:
          - _vmaas_route_advertisements.spec.targetVRF == 'auto'
          - _vmaas_route_advertisements.spec.advertisements == ['PodNetwork']
          - _vmaas_route_advertisements.spec.frrConfigurationSelector.matchLabels.evpn == 'true'
          - _vmaas_route_advertisements.spec.networkSelectors[0].networkSelectionType == 'ClusterUserDefinedNetworks'
          - _vmaas_route_advertisements.spec.networkSelectors[0].clusterUserDefinedNetworkSelector.networkSelector.matchLabels.evpn == 'true'
          - >-
            (_vmaas_evpn_cudns["items"] | default([]) | length == 0) or
            ((_vmaas_route_advertisements.status.conditions | default([])
             | selectattr('type', 'equalto', 'Accepted')
             | selectattr('status', 'equalto', 'True') | list | length) > 0)
        fail_msg: >-
          RouteAdvertisements osac-evpn must select the EVPN FRRConfiguration
          and CUDNs for PodNetwork only, and must be accepted once an EVPN CUDN
          exists. Service ExternalIPs and EgressIPs require their separate fabric
          policy/route path.

    - name: Read the registered Netris fabric manager ConfigMap
      ansible.builtin.command:
        argv: [oc, get, configmap/osac-network-fabric-manager-netris, -n, "{{ osac_namespace }}", -o, json]
      register: _vmaas_fabric_manager_raw
      changed_when: false

    - name: Read the registered CUDN EVPN Kubernetes manager ConfigMap
      ansible.builtin.command:
        argv: [oc, get, configmap/osac-network-k8s-manager-cudn-evpn, -n, "{{ osac_namespace }}", -o, json]
      register: _vmaas_k8s_manager_raw
      changed_when: false

    - name: Read the ComputeInstance CRD
      ansible.builtin.command:
        argv: [oc, get, crd/computeinstances.osac.openshift.io, -o, json]
      register: _vmaas_compute_instance_crd_raw
      changed_when: false

    - name: Read namespace deployments
      ansible.builtin.command:
        argv: [oc, get, deployments, -n, "{{ osac_namespace }}", -o, json]
      register: _vmaas_deployments_raw
      changed_when: false

    - name: Parse VMaaS API and manager registrations
      ansible.builtin.set_fact:
        _vmaas_fabric_manager: "{{ _vmaas_fabric_manager_raw.stdout | from_json }}"
        _vmaas_k8s_manager: "{{ _vmaas_k8s_manager_raw.stdout | from_json }}"
        _vmaas_compute_instance_crd: "{{ _vmaas_compute_instance_crd_raw.stdout | from_json }}"
        _vmaas_deployments: "{{ _vmaas_deployments_raw.stdout | from_json }}"
      no_log: true

    - name: Locate the deployment that enables the VMaaS controller
      ansible.builtin.set_fact:
        _vmaas_compute_controller_deployment:
          name: "{{ item.metadata.name }}"
          replicas: "{{ item.spec.replicas | default(1) }}"
          availableReplicas: "{{ item.status.availableReplicas | default(0) }}"
      loop: "{{ _vmaas_deployments['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: >-
        (item.spec.template.spec.containers | default([])
         | map(attribute='env') | select('defined') | flatten
         | selectattr('name', 'equalto', 'OSAC_ENABLE_COMPUTE_INSTANCE_CONTROLLER')
         | selectattr('value', 'equalto', 'true') | list | length) > 0

    - name: Require the ComputeInstance API and manager registrations
      ansible.builtin.assert:
        that:
          - _vmaas_compute_instance_crd.status.conditions | default([]) | selectattr('type', 'equalto', 'Established') | selectattr('status', 'equalto', 'True') | list | length > 0
          - _vmaas_fabric_manager.metadata.labels['osac.openshift.io/network-fabric-manager'] == 'true'
          - _vmaas_fabric_manager.data.name == 'netris'
          - _vmaas_fabric_manager.immutable | default(false) | bool
          - _vmaas_fabric_manager.data.ansible_role == 'osac.templates.netris'
          - "'evpn' in (_vmaas_fabric_manager.data.network_types | default('') | split(',') | map('trim') | list)"
          - _vmaas_k8s_manager.metadata.labels['osac.openshift.io/network-k8s-manager'] == 'true'
          - _vmaas_k8s_manager.data.name == 'cudn_evpn'
          - _vmaas_k8s_manager.immutable | default(false) | bool
          - _vmaas_fabric_manager.data.capabilities | default('') == 'eastWestEthernet,security_group_icmp'
          - "'capabilities' not in _vmaas_k8s_manager.data"
        fail_msg: >-
          VMaaS requires an Established ComputeInstance CRD and the immutable
          installer-rendered Netris (ansible_role osac.templates.netris,
          network_types containing evpn, capabilities
          eastWestEthernet,security_group_icmp) and cudn_evpn (no capabilities
          key) manager ConfigMaps in namespace {{ osac_namespace }}. An
          existing lab needs the immutable osac-network-fabric-manager-netris
          ConfigMap deleted before a helm upgrade changes its data.

    - name: Require a deployment with the VMaaS controller enabled
      ansible.builtin.assert:
        that:
          - _vmaas_compute_controller_deployment is defined
        fail_msg: >-
          No deployment in namespace {{ osac_namespace }} enables
          OSAC_ENABLE_COMPUTE_INSTANCE_CONTROLLER=true.

    - name: Require the VMaaS controller deployment to be available
      ansible.builtin.assert:
        that:
          - (_vmaas_compute_controller_deployment.availableReplicas | int) >= (_vmaas_compute_controller_deployment.replicas | int)
        fail_msg: >-
          The deployment with OSAC_ENABLE_COMPUTE_INSTANCE_CONTROLLER=true is not
          fully available in namespace {{ osac_namespace }}.

    - name: Get the fulfillment internal API host
      ansible.builtin.command:
        argv:
          - oc
          - get
          - route/fulfillment-internal-api
          - -n
          - "{{ osac_namespace }}"
          - -o
          - jsonpath={.status.ingress[0].host}
      register: _vmaas_fulfillment_host
      changed_when: false
      until: _vmaas_fulfillment_host.rc == 0 and _vmaas_fulfillment_host.stdout | length > 0
      retries: 10
      delay: 15

    - name: Get a service account token for the private API
      ansible.builtin.command:
        argv: [oc, create, token, -n, "{{ osac_namespace }}", admin]
      register: _vmaas_sa_token
      changed_when: false
      no_log: true

    # The installer's NetworkClass step creates the NetworkClass from
    # global.networking; the operator sets READY once it resolved the
    # registrations of the configured managers.
    - name: Wait for the NetworkClass to be READY
      # The token is only in the request header; no_log stays off so a timeout
      # shows the API error.
      ansible.builtin.uri:
        url: "https://{{ _vmaas_fulfillment_host.stdout }}/api/private/v1/network_classes"
        headers:
          Authorization: "Bearer {{ _vmaas_sa_token.stdout }}"
        validate_certs: false
        return_content: true
      register: _vmaas_network_classes
      until: >-
        _vmaas_network_classes.status == 200 and
        (_vmaas_network_classes.json['items'] | default([])
         | selectattr('status.state', 'defined')
         | selectattr('status.state', 'equalto', 'NETWORK_CLASS_STATE_READY') | list | length) == 1
      retries: 30
      delay: 10

    - name: Require the NetworkClass to select netris and cudn_evpn
      ansible.builtin.assert:
        that:
          - _vmaas_network_classes.json['items'] | length == 1
          - _vmaas_network_classes.json['items'][0].fabric_manager == 'netris'
          - _vmaas_network_classes.json['items'][0].k8s_manager == 'cudn_evpn'
          - _vmaas_network_classes.json['items'][0].status.state == 'NETWORK_CLASS_STATE_READY'
          - _vmaas_network_classes.json['items'][0].status.network_type | default('evpn') == 'evpn'
        fail_msg: >-
          The default NetworkClass must be NETWORK_CLASS_STATE_READY with
          fabric_manager=netris and k8s_manager=cudn_evpn. Observed:
          {{ _vmaas_network_classes.json['items'] | map(attribute='status') | list | to_json }}.

    # Only the external_ip/ and references/ tests of the VMaaS networking E2E
    # are gated by this variable (they use the 172.27.0.0/16 pool). The NAT and
    # ExternalIP tests of test_vmaas_networking.py (test_09..13 and the pool fixture check) always run. It
    # is only set when the lab operator has provisioned and acknowledged the
    # 172.27.0.0/16 return path.
    - name: Publish the external path switch for the VMaaS tests
      ansible.builtin.lineinfile:
        path: "{{ inventory_dir }}/../.env.infra"
        regexp: '^OSAC_NETRIS_VM_EXTERNAL_PATH_ENABLED='
        line: OSAC_NETRIS_VM_EXTERNAL_PATH_ENABLED=true
        create: true
        mode: "0644"
      when:
        - ocp_vmaas_external_ip_tests_enabled | default(false) | bool
        - ocp_vmaas_external_ip_return_path_acknowledged | default(false) | bool

    - name: Remove the external path switch when the return path is not acknowledged
      ansible.builtin.lineinfile:
        path: "{{ inventory_dir }}/../.env.infra"
        regexp: '^OSAC_NETRIS_VM_EXTERNAL_PATH_ENABLED='
        state: absent
      when: >-
        not ((ocp_vmaas_external_ip_tests_enabled | default(false) | bool) and
             (ocp_vmaas_external_ip_return_path_acknowledged | default(false) | bool))

    - name: Report the VMaaS readiness result
      ansible.builtin.debug:
        msg: >-
          Readiness passed for the OSAC VMaaS controller, the ComputeInstance
          API, the installer-rendered Netris and cudn_evpn registrations, and
          the default NetworkClass (netris, cudn_evpn, READY). The lab
          ExternalIPPool ({{ osac_external_ip_pool_name }}, {{ osac_external_ip_pool_cidr }})
          is READY, so tenant default networking can allocate default-nat.
          The ComputeInstanceTemplate is not queried here; ensure the
          VMaaS template configured for the suite exists and is usable.
          OSAC_NETRIS_VM_EXTERNAL_PATH_ENABLED is exported to .env.infra only
          when the ExternalIP tests and the return path acknowledgement are both
          enabled.
