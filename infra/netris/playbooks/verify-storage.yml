---
# Verify the lab NFS endpoint from the host and, for a full deployment, run the
# single storage-over-SNAT suite. The suite owns the tenant mounts, the
# source-address evidence, and the NFR-2/NFR-3 cases.
- name: Verify the lab NFS storage endpoint
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Verify the endpoint and run the storage suite
      ansible.builtin.include_role:
        name: lab_nfs_storage
        tasks_from: verify
