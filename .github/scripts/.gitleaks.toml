[extend]
  # Layer this allowlist on top of gitleaks' bundled default rules instead
  # of replacing them entirely -- a config file without this line is a full
  # ruleset override, which would silently disable all detection.
  useDefault = true

# Allowlist for known false positives when scanning e2e workflow run
# logs/artifacts (OSAC-1684). Typical FP RuleID under default rules is
# generic-api-key (checksum / X.509 / pvc-as-secret) or curl-auth-user
# (shell-var basic auth in Job templates).
#
# Do NOT use [[rules]] id="generic-api-key" + [[rules.allowlists]] to
# "rule-scope" -- with useDefault, redeclaring that id replaces the
# default rule and disables real generic-api-key detection.
#
# Prefer regexTarget=match|secret over line so co-located credentials
# (jwt / Bearer on the same log line) remain separate findings:
#   - match: allowlist applies only when the rule's Match text fits
#   - secret: allowlist applies only when the extracted Secret fits
#   - line: would drop every finding on that line (rejected for keycloak)
#
# Do NOT allowlist bare UUIDs via regexTarget=secret: UUID-shaped client
# secrets / API keys would suppress detect→purge→notify. Scope IdP id
# FPs to Match text (resource id fields) and targetRules so a Match that
# also spans Authorization: Bearer (curl-auth-header) is not suppressed.

[[allowlists]]
  description = "K8s checksum-secret(s)-* annotations are SHA1 hashes of secret data, not the secrets (pods-describe / AAP operator logs)"
  regexTarget = "match"
  regexes = [
    # Plain:  checksum-secret-bundle_cacert: deadbeef...
    # Plural: checksum-secrets-app_credentials.yaml: deadbeef...
    # JSON:   "checksum-secret-__admin_password_secret":"deadbeef..."
    '''checksum-secrets?-[A-Za-z0-9_.-]+["\\:=\s]+[0-9a-f]{40}''',
  ]

[[allowlists]]
  description = "Public X.509 certificate fingerprints in kernel/ramdisk boot logs (metal3 inspect), not private keys"
  regexTarget = "match"
  regexes = [
    # generic-api-key Match on these lines is often exactly: key: <40hex>'
    # (trailing quote from the cert string). Anchor ^$ so longer Matches
    # like secret_key: <hex>' are not allowlisted. Keep Loaded X.509 form too.
    "Loaded X\\.509 cert '[^']+: [0-9a-f]{40}'",
    "^key: [0-9a-f]{40}'$",
  ]

[[allowlists]]
  description = "Kubernetes PVC names (pvc-<uuid>) when extracted as the Secret"
  regexTarget = "secret"
  regexes = [
    '''^pvc-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
  ]

[[allowlists]]
  description = "Keycloak / IdP resource id fields in Match (not bare UUID Secrets)"
  # Not global: omit curl-auth-header so client_id UUID + Bearer on one line
  # still fires the Bearer finding.
  targetRules = ["generic-api-key", "curl-auth-user"]
  regexTarget = "match"
  regexes = [
    # IdP *id* field names only (Id suffix required -- bare client/user/realm
    # must not suppress UUID-shaped secrets like CLIENT=<uuid>).
    # co-located Bearer/JWT still fire. Delimiters: quote, backslash,
    # whitespace (\s), colon, equals. Trailing boundary rejects UUID glued
    # to secret text while allowing JSON/colon forms.
    '''(?i)(?:^|[^A-Za-z0-9_-])(?:keycloak[_-]?user[_-]?id|realm[_-]?id|client[_-]?id|user[_-]?id|subject)["\\\s:=]+[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?:$|[^A-Za-z0-9_-])''',
  ]

[[allowlists]]
  description = "AAP create-token Job template uses shell var admin:${AAP_PASSWORD}, not a live password (curl-auth-user)"
  targetRules = ["curl-auth-user"]
  regexTarget = "secret"
  regexes = [
    '''^admin:\$\{AAP_PASSWORD\}$''',
  ]
