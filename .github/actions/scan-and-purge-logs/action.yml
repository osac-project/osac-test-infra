---
name: Scan and purge workflow run logs
description: >-
  Scan a single workflow run's logs and artifacts for leaked credentials with
  gitleaks (via scripts/scan-run-logs.sh). On a match: upload a redacted copy
  as an artifact, warn on the job summary, and delete the raw logs and/or
  tainted artifacts to close the exposure window (OSAC-1684).

inputs:
  run-id:
    description: "Workflow run ID to scan (defaults to the current run)"
    required: false
    default: ${{ github.run_id }}
  github-token:
    description: "Token with actions:write on this repo (to fetch and delete run logs/artifacts)"
    required: true

outputs:
  scan-ok:
    description: "'false' if the scan did not complete for logs and/or artifacts (fetch/list/download failed, oversize skip, or a post-fetch step like unzip/docker/redact failed) -- do not treat this the same as a clean scan"
    value: ${{ steps.scan.outputs.scan-ok }}
  leaks-found:
    description: "'true' if gitleaks found any secrets in the run's logs or artifacts"
    value: ${{ steps.scan.outputs.leaks-found }}
  purge-ok:
    description: "'false' if raw logs or tainted artifacts may still be on GitHub -- either leaks were found but a delete call failed, or the scan failed after a successful fetch (never reached delete). 'true' with scan-ok='false' means nothing was ever downloaded"
    value: ${{ steps.scan.outputs.purge-ok }}
  findings-count:
    description: "Number of findings across logs and artifacts (0 if none)"
    value: ${{ steps.scan.outputs.findings-count }}
  output-dir:
    description: "Directory with findings.json / status.env / redacted/ (for callers that post summaries or PR comments)"
    value: ${{ steps.scan.outputs.output-dir }}
  upload-ok:
    description: "'true' if the redacted-logs evidence artifact uploaded successfully; 'false' when upload failed or was skipped (no leaks)"
    value: ${{ steps.upload-status.outputs.upload-ok }}

runs:
  using: composite
  steps:
    - name: Run scanner
      id: run-scan
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RUN_ID: ${{ inputs.run-id }}
      run: |
        OUTPUT_DIR="${RUNNER_TEMP}/scan-logs-${RUN_ID}"
        # Set before calling the script, not after -- so this output is
        # available to the next step even if the call below dies partway
        # through under set -e.
        echo "output-dir=${OUTPUT_DIR}" >> "$GITHUB_OUTPUT"
        "${GITHUB_ACTION_PATH}/../../scripts/scan-run-logs.sh" "${RUN_ID}" "${OUTPUT_DIR}"

    # always(): scan-run-logs.sh's own EXIT trap guarantees status.env exists
    # even after a hard failure inside the script (unzip/docker/jq/cp/
    # redact.py dying under its `set -e`) -- but only this step actually
    # running is what reads and publishes it. Without always() here, a
    # failure in "Run scanner" above would skip this step entirely via the
    # implicit success() AND, leaving scan-ok/leaks-found/purge-ok unset
    # (not "false", just absent) and silently dropping the "could not scan"
    # summary below along with every subsequent step that depends on them.
    - name: Publish scan outputs
      id: scan
      if: always()
      shell: bash
      env:
        OUTPUT_DIR: ${{ steps.run-scan.outputs.output-dir }}
      run: |
        source "${OUTPUT_DIR}/status.env"
        echo "scan-ok=${SCAN_OK}" >> "$GITHUB_OUTPUT"
        echo "leaks-found=${LEAKS_FOUND}" >> "$GITHUB_OUTPUT"
        echo "purge-ok=${PURGE_OK}" >> "$GITHUB_OUTPUT"
        echo "findings-count=${FINDINGS_COUNT}" >> "$GITHUB_OUTPUT"
        # Step output, not $GITHUB_ENV: an env var here would leak into every
        # later step of the *calling* job (not just this action's own steps),
        # and would collide if this action is ever invoked more than once in
        # the same job.
        echo "output-dir=${OUTPUT_DIR}" >> "$GITHUB_OUTPUT"

    - name: Warn on job summary if scan could not run
      if: always() && steps.scan.outputs.scan-ok == 'false'
      shell: bash
      env:
        RUN_ID: ${{ inputs.run-id }}
        REPO: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        PURGE_OK: ${{ steps.scan.outputs.purge-ok }}
      run: |
        {
          echo "## :warning: Could not fully scan logs/artifacts for leaked credentials"
          echo ""
          # purge-ok=true with scan-ok=false means nothing was downloaded.
          # purge-ok=false means we got past a fetch and then failed -- raw
          # content may still be on GitHub.
          if [[ "${PURGE_OK}" == "true" ]]; then
            echo "Failed to fetch logs and/or list/download artifacts for run [${RUN_ID}](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}) -- this is **not** the same as a clean scan; content was never fully checked."
          else
            echo "Scan of run [${RUN_ID}](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}) failed after some content was fetched (e.g. unzip/gitleaks/redact, or an oversize artifact skip) -- this is **not** the same as a clean scan."
            echo ""
            echo "- :warning: **Raw logs and/or artifacts for this run may still be on GitHub** -- the scan never finished purge. Check the job logs and delete manually if needed:"
            echo "  - Logs: \`gh api -X DELETE repos/${REPO}/actions/runs/${RUN_ID}/logs\`"
            echo "  - Artifact: \`gh api -X DELETE repos/${REPO}/actions/artifacts/ARTIFACT_ID\`"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload redacted evidence artifact
      id: upload
      # always(): a hard failure in an earlier composite step must not skip
      # uploading evidence when leaks were already recorded.
      if: always() && steps.scan.outputs.leaks-found == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: redacted-logs-${{ inputs.run-id }}
        path: ${{ steps.scan.outputs.output-dir }}/redacted
        retention-days: 30
        # A missing/empty redacted dir here means something is wrong with an
        # already-confirmed leak -- fail loudly instead of the default warn,
        # which is easy to miss in job logs.
        if-no-files-found: error

    # Publish upload-ok for callers (PR comments). always(): when upload is
    # skipped (no leaks) outcome is empty -- surface as false, not unset.
    - name: Publish upload status
      id: upload-status
      if: always()
      shell: bash
      env:
        UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
      run: |
        if [[ "${UPLOAD_OUTCOME}" == "success" ]]; then
          echo "upload-ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "upload-ok=false" >> "$GITHUB_OUTPUT"
        fi

    # always(): a bare `if: leaks-found == 'true'` implicitly ANDs with
    # success(), so a hard failure in the artifact-upload step above would
    # silently skip the very notification meant to report the leak.
    - name: Warn on job summary
      if: always() && steps.scan.outputs.leaks-found == 'true'
      shell: bash
      env:
        RUN_ID: ${{ inputs.run-id }}
        REPO: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        FINDINGS_COUNT: ${{ steps.scan.outputs.findings-count }}
        PURGE_OK: ${{ steps.scan.outputs.purge-ok }}
        OUTPUT_DIR: ${{ steps.scan.outputs.output-dir }}
        UPLOAD_OK: ${{ steps.upload-status.outputs.upload-ok }}
        # Artifact lives on *this* scan run (github.run_id), named after the
        # scanned e2e run (inputs.run-id). Same #artifacts pattern as audit.
        ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
      run: |
        {
          echo "## :rotating_light: Leaked credential(s) detected in run logs/artifacts"
          echo ""
          echo "gitleaks found **${FINDINGS_COUNT}** potential secret(s) in the logs and/or artifacts for run [${RUN_ID}](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID})."
          echo ""
          # Never unconditionally claim the raw content was deleted -- a
          # delete call itself can fail (permissions, API hiccup, etc.), in
          # which case the exposure window is still open and that must be
          # visible here, not just in a job-log ::warning:: that's easy to miss.
          if [[ "${PURGE_OK}" == "true" ]]; then
            echo "- Tainted raw logs and/or artifacts for this run have been deleted to close the exposure window."
          else
            echo "- :warning: **Failed to delete some raw logs and/or artifacts for this run** -- the exposure window is **NOT** closed. Delete manually if needed:"
            echo "  - Logs: \`gh api -X DELETE repos/${REPO}/actions/runs/${RUN_ID}/logs\`"
            echo "  - Artifact: \`gh api -X DELETE repos/${REPO}/actions/artifacts/ARTIFACT_ID\`"
            echo "  - Or re-run this scan."
          fi
          # Don't unconditionally claim the evidence artifact is there -- the
          # upload step above can itself fail (including via its own
          # if-no-files-found: error), and this step still runs regardless
          # via always().
          if [[ "${UPLOAD_OK}" == "true" ]]; then
            echo "- Redacted evidence: [\`redacted-logs-${RUN_ID}\`](${ARTIFACT_URL}) (paths under \`logs/\` and/or \`artifacts/\`)."
          else
            echo "- :warning: **Failed to upload the redacted-logs artifact** -- no redacted copy is attached; check the run logs for the upload step's failure."
          fi
          echo "- Rotate any credential(s) below that are real (not test/dev-only values)."
          echo ""
          echo "Rows are deduplicated by Rule + File (First line = earliest StartLine; Count = hits)."
          echo ""
          echo "| Rule | File | First line | Count |"
          echo "|---|---|---|---|"
          # Job-summary detail only (PR comments stay link-only). Resolve via
          # GITHUB_ACTION_PATH so cross-repo `uses:` callers that never
          # check out osac-test-infra still find the jq module (same
          # pattern as scan-run-logs.sh above).
          # File is already prefixed logs/ or artifacts/<name>/ by scan-run-logs.sh.
          # Best-effort: missing/malformed findings must not fail the action.
          SCRIPTS_DIR="${GITHUB_ACTION_PATH}/../../scripts"
          if ! jq -r -L "${SCRIPTS_DIR}" '
            include "findings-table";
            findings_table_rows
          ' "${OUTPUT_DIR}/findings.json"; then
            echo "| _(findings.json unreadable -- see scan logs)_ | | | |"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
