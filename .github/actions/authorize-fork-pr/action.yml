---
name: Authorize fork PR
description: Fetch GitHub token from Vault and validate fork PR authorization

inputs:
  role-id:
    required: true
  secret-id:
    required: true
  fork-pr-author:
    required: true
  pr-number:
    required: false
    default: ""
  trusted-fork-authors:
    description: >-
      Comma-separated logins that are not organization members but may open a fork pull request to a release branch: the
      cherry-pick robot copies commits that were reviewed and merged on the default branch, and pushes them to its own fork.
      The pull request must come from the fork of that very account and target a release-* branch.
    required: false
    default: "openshift-cherrypick-robot"

runs:
  using: composite
  steps:
    - name: Retrieve GitHub token from Vault
      id: vault-github
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
      with:
        url: http://127.0.0.1:8200
        method: approle
        roleId: ${{ inputs.role-id }}
        secretId: ${{ inputs.secret-id }}
        exportEnv: false
        secrets: |
          secret/data/osac/e2e/github-token token | GH_ORG_TOKEN

    - name: Validate fork PR authorization
      shell: bash
      env:
        PR_AUTHOR: ${{ inputs.fork-pr-author }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PR_REPO: ${{ github.repository }}
        TRUSTED_AUTHORS: ${{ inputs.trusted-fork-authors }}
        GH_TOKEN: ${{ steps.vault-github.outputs.GH_ORG_TOKEN }}
      run: |
        echo "::group::Check ok-to-test label"
        LABELS_FILE="${RUNNER_TEMP}/labels.json"
        if [[ -n "${PR_NUMBER}" ]]; then
          HTTP_CODE=$(curl -s -o "${LABELS_FILE}" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${PR_REPO}/issues/${PR_NUMBER}/labels")
          if [[ "${HTTP_CODE}" == "200" ]]; then
            if jq -e '[.[].name] | index("ok-to-test")' "${LABELS_FILE}" > /dev/null 2>&1; then
              echo "Fork PR authorized: 'ok-to-test' label found on PR #${PR_NUMBER}."
              echo "::endgroup::"
              exit 0
            fi
          else
            echo "::warning::Failed to fetch labels for PR #${PR_NUMBER} (HTTP ${HTTP_CODE}), skipping label check."
          fi
        fi
        echo "::endgroup::"

        # A cherry-pick of the robot to a release branch: the commits were reviewed and merged on the default branch, the
        # robot pushes them to its own fork, and the E2E starts only after a person with write access approved the exact
        # head commit (osac-ci). Nothing else of the robot is trusted: not another branch, not another fork. The pull
        # request is only read for an author the list names, and a lookup that fails only means "not trusted here": the
        # checks below go on. A list that is not valid logins (letters, digits and single dashes inside, none at the
        # start or the end) separated by single commas is a mistake, and it trusts nobody. Logins are compared without
        # regard to case, as GitHub does.
        if [[ -n "${PR_NUMBER}" && "${TRUSTED_AUTHORS}" =~ ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*(,[A-Za-z0-9]+(-[A-Za-z0-9]+)*)*$ ]]; then
          IFS=',' read -ra TRUSTED <<<"${TRUSTED_AUTHORS}"
          for trusted in "${TRUSTED[@]}"; do
            [[ -n "${trusted}" && "${PR_AUTHOR,,}" == "${trusted,,}" ]] || continue
            echo "::group::Check trusted fork author"
            PR_JSON=$(curl -s \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${PR_REPO}/pulls/${PR_NUMBER}") || PR_JSON=""
            BASE_REF=$(jq -r '.base.ref // empty' <<<"${PR_JSON}" 2>/dev/null) || BASE_REF=""
            HEAD_OWNER=$(jq -r '.head.repo.owner.login // empty' <<<"${PR_JSON}" 2>/dev/null) || HEAD_OWNER=""
            if [[ "${HEAD_OWNER,,}" == "${trusted,,}" && "${BASE_REF}" =~ ^release-[0-9] ]]; then
              echo "Fork PR authorized: '${PR_AUTHOR}' is a trusted cherry-pick author and the pull request targets ${BASE_REF}."
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
          done
        fi

        echo "::group::Check org membership"
        # URL-encode PR_AUTHOR -- bot accounts like "some-bot[bot]" contain
        # characters (`[`, `]`) that make the URL invalid otherwise, which
        # curl rejects outright (exit 3) before the request is even sent.
        PR_AUTHOR_ENCODED=$(jq -rn --arg v "${PR_AUTHOR}" '$v|@uri')
        HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/orgs/osac-project/members/${PR_AUTHOR_ENCODED}")
        if [[ "${HTTP_CODE}" == "204" ]]; then
          echo "Fork PR authorized: '${PR_AUTHOR}' is an osac-project org member."
          echo "::endgroup::"
          exit 0
        fi

        # PR author is not an org member — check if the fork *owner* is.
        # GitHub Apps (e.g. osac-jira-ai-issue-solver[bot]) cannot be org
        # members, but they may push to a fork owned by one (osac-dev-bot).
        if [[ -n "${PR_NUMBER}" ]]; then
          echo "::endgroup::"
          echo "::group::Check fork owner org membership"
          FORK_OWNER=$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${PR_REPO}/pulls/${PR_NUMBER}" \
            | jq -r '.head.repo.owner.login // empty')
          if [[ -n "${FORK_OWNER}" && "${FORK_OWNER}" != "${PR_AUTHOR}" ]]; then
            OWNER_ENCODED=$(jq -rn --arg v "${FORK_OWNER}" '$v|@uri')
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/osac-project/members/${OWNER_ENCODED}")
            if [[ "${HTTP_CODE}" == "204" ]]; then
              echo "Fork PR authorized: fork owner '${FORK_OWNER}' is an osac-project org member."
              echo "::endgroup::"
              exit 0
            fi
          fi
        fi

        echo "::error::Fork PR blocked: '${PR_AUTHOR}' is not an osac-project org member."
        echo "::error::A person with triage access can approve this PR for testing by adding the ok-to-test label"
        echo "::endgroup::"
        exit 1
