---
name: Collect OSAC Cluster Logs
description: >-
  Collect cluster diagnostics and redact sensitive data into
  RUNNER_TEMP/osac-artifacts. Wraps scripts/gather-osac-logs.sh and needs the
  live cluster. Run the upload-artifacts action afterwards; the cluster can be
  destroyed in between. Use gather-artifacts to do both in one go.

inputs:
  namespace:
    description: "OSAC E2E namespace"
    required: false
    default: "osac-e2e-ci"
  kubeconfig-path:
    description: "Path to the cluster kubeconfig"
    required: true
  junit-path:
    description: "Path to JUnit XML (included in artifact if it exists)"
    required: false
    default: ""
  timeout-seconds:
    description: >-
      Cap for the collection. A workflow that wants a shorter cap for a
      cancelled job calls this action a second time with a smaller value,
      from a step with its own if: cancelled(): the status functions cannot
      be used in a with: or an env:.
    required: false
    default: "900"

runs:
  using: composite
  steps:
    - name: Gather and redact
      shell: bash
      env:
        KUBECONFIG: ${{ inputs.kubeconfig-path }}
        E2E_NAMESPACE: ${{ inputs.namespace }}
        JUNIT_PATH: ${{ inputs.junit-path }}
        COLLECT_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: bash "${GITHUB_WORKSPACE}/.github/scripts/collect-artifacts.sh"
