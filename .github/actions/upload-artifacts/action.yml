---
name: Scan and Upload OSAC Artifacts
description: >-
  Check that the collected artifacts were redacted, scan them with gitleaks
  (redacting any finding), and upload them as a workflow artifact. Needs only
  the files under RUNNER_TEMP/osac-artifacts, not the cluster, so it can run
  after the cluster is destroyed. Pairs with the collect-artifacts action.

inputs:
  artifact-name:
    description: "Name for the uploaded artifact"
    required: false
    default: "osac-logs"
  known-secret-files:
    description: >-
      Newline-separated files holding secrets the job uses, such as the
      registry pull secret. Every value in them, in any encoding, is censored
      from the artifacts. Empty means RUNNER_TEMP/pull-secret.json. A listed
      file that does not exist is skipped.
    required: false
    default: ""
  known-secret-env:
    description: >-
      Newline-separated names of environment variables whose values are
      censored from the artifacts.
    required: false
    default: ""
  k8s-secrets-file:
    description: >-
      `oc get secrets -o json` output taken while the cluster was up; the
      collect-artifacts action writes it outside the artifact directory. Empty
      means RUNNER_TEMP/osac-secret-inventory/k8s-secrets.json. Skipped when
      absent.
    required: false
    default: ""
  fail-on-censor:
    description: >-
      Fail the job when the release gate had to censor or withhold anything.
      The artifact that is uploaded is clean either way; this makes a leak at
      the source visible instead of silently repaired.
    required: false
    default: "false"
  overwrite:
    description: >-
      Replace an artifact of the same name. The retry after an upload that a
      cancel interrupted needs it, because the interrupted upload may already
      have created the artifact.
    required: false
    default: "false"
  max-file-mbytes:
    description: >-
      Maximum file size in MiB for release-gate inspection. Larger files are
      withheld. Ordinary uploads use 512; telemetry captures opt into 2048.
    required: false
    default: "512"

runs:
  using: composite
  steps:
    - name: Verify redaction complete
      if: always()
      shell: bash
      env:
        ARTIFACT_DIR: ${{ runner.temp }}/osac-artifacts
      run: |
        if [[ -d "${ARTIFACT_DIR}" ]] && [[ ! -f "${ARTIFACT_DIR}/.redaction-complete" ]]; then
          echo "::error::Gather script did not complete — refusing to upload"
          rm -rf "${ARTIFACT_DIR}"
          exit 1
        fi
        # The marker stays: the cancelled variant of this step may run again
        # after a cancel interrupted this one. A new collection removes it
        # first (collect-artifacts.sh), and the upload leaves it out.

    - name: Scan artifacts with gitleaks
      if: always()
      shell: bash
      env:
        ARTIFACT_DIR: ${{ runner.temp }}/osac-artifacts
        GITLEAKS_CONFIG: ${{ github.workspace }}/.github/scripts/.gitleaks.toml
        # Same pinned image as scan-run-logs.sh
        GITLEAKS_IMAGE: "ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
      run: |
        if [[ ! -d "${ARTIFACT_DIR}" ]]; then
          echo "No artifact directory — skipping gitleaks scan"
          exit 0
        fi


        ENGINE=""
        if command -v docker &>/dev/null; then
          ENGINE=docker
        elif command -v podman &>/dev/null; then
          ENGINE=podman
        else
          echo "::warning::Neither docker nor podman available — uploading without pre-scan (post-upload scanner will cover)"
          exit 0
        fi

        SELINUX_SUFFIX=""
        if [[ -r /sys/fs/selinux/enforce ]] && [[ "$(</sys/fs/selinux/enforce)" == "1" ]]; then
          SELINUX_SUFFIX=",Z"
        fi

        REPORT_DIR="${RUNNER_TEMP}/gitleaks-pre-upload"
        mkdir -p "${REPORT_DIR}"
        chmod 777 "${REPORT_DIR}"
        trap 'rm -rf -- "${REPORT_DIR}"' EXIT

        # The upload step runs with if: always(), so a failure while findings
        # are being handled must not leave unredacted files behind for it:
        # remove them and fail.
        fail_closed() {
          echo "::endgroup::"
          echo "::error::$1 — removing artifacts instead of uploading unredacted logs"
          rm -rf "${ARTIFACT_DIR}"
          exit 1
        }

        MAX_PASSES=3
        for pass in $(seq 1 ${MAX_PASSES}); do
          echo "::group::Gitleaks pre-upload scan (pass ${pass}/${MAX_PASSES})"
          REPORT="${REPORT_DIR}/findings-pass-${pass}.json"

          if ! "${ENGINE}" run --rm --network=none \
            --user "$(id -u):$(id -g)" \
            -v "${ARTIFACT_DIR}:/scan:ro${SELINUX_SUFFIX}" \
            -v "${GITLEAKS_CONFIG}:/gitleaks.toml:ro${SELINUX_SUFFIX}" \
            -v "${REPORT_DIR}:/out${SELINUX_SUFFIX}" \
            "${GITLEAKS_IMAGE}" dir /scan \
            --config=/gitleaks.toml \
            --report-format=json \
            --report-path="/out/$(basename "${REPORT}")" \
            --exit-code=0; then
            echo "::warning::Gitleaks scan failed — uploading anyway (post-upload scanner will cover)"
            echo "::endgroup::"
            rm -rf "${REPORT_DIR}"
            exit 0
          fi

          if [[ ! -f "${REPORT}" ]]; then
            echo "[]" > "${REPORT}"
          fi

          FINDING_COUNT=$(jq 'length' "${REPORT}") \
            || fail_closed "Could not read the gitleaks report of pass ${pass}"
          echo "Pass ${pass}: ${FINDING_COUNT} finding(s)"
          if [[ "${FINDING_COUNT}" -gt 0 ]]; then
            echo "Findings (sanitized):"
            jq -r '.[] | "  \(.RuleID) \(.File):\(.StartLine)"' "${REPORT}" || true
          fi
          echo "::endgroup::"

          if [[ "${FINDING_COUNT}" -eq 0 ]]; then
            echo "Artifacts are clean after pass ${pass}"
            break
          fi

          echo "::group::Redacting ${FINDING_COUNT} finding(s) (pass ${pass})"
          python3 "${{ github.workspace }}/.github/scripts/redact.py" "${REPORT}" "${ARTIFACT_DIR}" \
            || fail_closed "Redaction of pass ${pass} failed"
          echo "::endgroup::"

          if [[ "${pass}" -eq "${MAX_PASSES}" ]]; then
            FINAL_REPORT="${REPORT_DIR}/findings-final.json"
            if ! "${ENGINE}" run --rm --network=none \
              --user "$(id -u):$(id -g)" \
              -v "${ARTIFACT_DIR}:/scan:ro${SELINUX_SUFFIX}" \
              -v "${GITLEAKS_CONFIG}:/gitleaks.toml:ro${SELINUX_SUFFIX}" \
              -v "${REPORT_DIR}:/out${SELINUX_SUFFIX}" \
              "${GITLEAKS_IMAGE}" dir /scan \
              --config=/gitleaks.toml \
              --report-format=json \
              --report-path="/out/findings-final.json" \
              --exit-code=0; then
              echo "::warning::Final gitleaks scan failed — uploading anyway (post-upload scanner will cover)"
              break
            fi
            if [[ ! -f "${FINAL_REPORT}" ]]; then
              echo "[]" > "${FINAL_REPORT}"
            fi
            REMAINING=$(jq 'length' "${FINAL_REPORT}") \
              || fail_closed "Could not read the final gitleaks report"
            if [[ "${REMAINING}" -gt 0 ]]; then
              echo "::warning::${REMAINING} finding(s) remain after ${MAX_PASSES} redaction passes — uploading anyway (post-upload scanner will cover)"
              echo "Remaining findings (sanitized):"
              jq -r '.[] | "  \(.RuleID) \(.File):\(.StartLine)"' "${FINAL_REPORT}" || true
            fi
          fi
        done

        rm -rf "${REPORT_DIR}"

    - name: Release gate - censor secrets
      if: always()
      shell: bash
      env:
        ARTIFACT_DIR: ${{ runner.temp }}/osac-artifacts
        KNOWN_SECRET_FILES: ${{ inputs.known-secret-files }}
        KNOWN_SECRET_ENV: ${{ inputs.known-secret-env }}
        K8S_SECRETS_FILE: ${{ inputs.k8s-secrets-file }}
        FAIL_ON_CENSOR: ${{ inputs.fail-on-censor }}
        MAX_FILE_MBYTES: ${{ inputs.max-file-mbytes }}
      run: |
        if [[ ! -d "${ARTIFACT_DIR}" ]]; then
          exit 0
        fi
        args=()
        while IFS= read -r secret_file; do
          [[ -n "${secret_file}" ]] && args+=(--secret-file "${secret_file}")
        done <<<"${KNOWN_SECRET_FILES:-${RUNNER_TEMP}/pull-secret.json}"
        while IFS= read -r variable; do
          [[ -n "${variable}" ]] && args+=(--env "${variable}")
        done <<<"${KNOWN_SECRET_ENV}"
        args+=(--k8s-secrets "${K8S_SECRETS_FILE:-${RUNNER_TEMP}/osac-secret-inventory/k8s-secrets.json}")
        if [[ "${FAIL_ON_CENSOR}" == "true" ]]; then
          args+=(--fail-on-find)
        fi

        # Pattern scanners only find shapes they have a rule for. The gate also
        # searches for the values the job holds, in every encoding, and replaces
        # what it finds. Anything it cannot inspect is removed, and so is the
        # whole directory if the gate itself fails: the upload step below runs
        # even after this one fails.
        status=0
        python3 -I "${{ github.workspace }}/.github/scripts/release_gate.py" \
          "${ARTIFACT_DIR}" --max-file-mbytes "${MAX_FILE_MBYTES}" "${args[@]}" || status=$?
        # The snapshot of the cluster's Secrets has done its job; do not leave it
        # on a runner that outlives this job.
        rm -f "${RUNNER_TEMP}/osac-secret-inventory/k8s-secrets.json"
        if [[ ${status} -eq 1 ]]; then
          echo "::error::Release gate censored secrets that the collection should not have written"
          exit 1
        elif [[ ${status} -ne 0 ]]; then
          echo "::error::Release gate could not run — removing the artifacts instead of uploading"
          rm -rf "${ARTIFACT_DIR}"
          exit 1
        fi

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.artifact-name }}
        overwrite: ${{ inputs.overwrite }}
        path: |
          ${{ runner.temp }}/osac-artifacts/
          !${{ runner.temp }}/osac-artifacts/.redaction-complete
        retention-days: 7
        if-no-files-found: warn
