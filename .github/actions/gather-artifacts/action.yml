---
name: Gather OSAC Artifacts
description: >-
  Collect cluster diagnostics, redact sensitive data, and upload as a
  workflow artifact. Runs the collect-artifacts and upload-artifacts actions
  back to back; a workflow that destroys its cluster should call them
  separately, with the teardown in between.

inputs:
  namespace:
    description: "OSAC E2E namespace"
    required: false
    default: "osac-e2e-ci"
  kubeconfig-path:
    description: "Path to the cluster kubeconfig"
    required: true
  artifact-name:
    description: "Name for the uploaded artifact"
    required: false
    default: "osac-logs"
  junit-path:
    description: "Path to JUnit XML (included in artifact if it exists)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Collect cluster logs
      if: always()
      uses: ./.github/actions/collect-artifacts
      with:
        namespace: ${{ inputs.namespace }}
        kubeconfig-path: ${{ inputs.kubeconfig-path }}
        junit-path: ${{ inputs.junit-path }}
        # Keep the cap of the callers of this action as it was.
        cancelled-timeout-seconds: "900"

    - name: Scan and upload artifacts
      if: always()
      uses: ./.github/actions/upload-artifacts
      with:
        artifact-name: ${{ inputs.artifact-name }}
