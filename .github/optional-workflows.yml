version: 1

workflows:
  - command: e2e-bmaas-netris-full-install
    workflow: e2e-bmaas-netris-full-install-caller.yml
    name: E2E BMaaS Netris Full Install
    description: BMaaS networking tests on the Netris infrastructure
    trigger: label
    label: e2e-bmaas-netris
    retestable: true
  - command: e2e-external-aap
    workflow: e2e-external-aap-full-install-caller.yml
    name: E2E External AAP Full Install
    description: After AAP operator install, pass a standalone AAP URL to OSAC (skips if installer has no EXTERNAL_AAP yet)
    trigger: workflow_dispatch
    retestable: true
