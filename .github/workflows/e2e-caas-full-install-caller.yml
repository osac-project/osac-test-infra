---
name: E2E CaaS Full Install

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
    inputs:
      pr-number:
        description: "PR number (set by slash /test; forces sanity-only selection)"
        required: false
        type: string
        default: ""
      test-suite:
        description: "Suite (caas/sanity, caas/regression, caas for all). PR-associated runs always use sanity."
        required: false
        default: "caas/sanity"
      test-filter:
        description: "pytest -k filter"
        required: false
        default: ""
      test-marker:
        description: "pytest -m marker expression. PR-associated runs always use sanity."
        required: false
        default: ""
      installer-ref:
        description: "Branch/ref of the OSAC monorepo"
        required: false
        default: "main"
      installer-repo:
        description: "GitHub repo (owner/name) of the OSAC monorepo"
        required: false
        default: "osac-project/osac"
      image-overrides:
        description: "JSON mapping Helm value paths to image refs"
        required: false
        default: "{}"
      osac-cli-version:
        description: "OSAC CLI version (e.g. 0.0.73). Defaults to latest."
        required: false
        default: ""
      caas-agent-flow:
        description: >-
          CaaS agent flow: "hot-pool" (default) or "cluster-namespace" (Option C).
        required: false
        default: "hot-pool"
      runner-label:
        description: "Self-hosted runner label to target"
        required: false
        default: ""

concurrency:
  group: e2e-caas-full-install-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  e2e-caas-full-install:
    permissions:
      contents: read
      # See e2e-vmaas-full-install-caller.yml's identical grant for why
      # this is needed.
      id-token: write
    uses: ./.github/workflows/e2e-caas-full-install.yml
    with:
      # PR/merge_group runs are sanity-only,
      # regardless of tier labels or inputs. Periodics include the full suite.
      test-suite: >-
        ${{
          (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.pr-number != '') && 'caas/sanity' ||
          github.event_name == 'schedule' && 'caas' ||
          inputs.test-suite || 'caas/sanity'
        }}
      test-marker: >-
        ${{
          (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.pr-number != '') && 'sanity' ||
          inputs.test-marker || 'sanity or regression or requires_caas or reference_common'
        }}
      test-filter: ${{ inputs.test-filter || '' }}
      installer-ref: ${{ inputs.installer-ref || 'main' }}
      installer-repo: ${{ inputs.installer-repo || 'osac-project/osac' }}
      image-overrides: ${{ inputs.image-overrides || '{}' }}
      components: >-
        ${{ format('[{{"repo":"osac-project/osac","ref":"{0}","containerfile":"fulfillment-service/Containerfile","imageKey":"service.images.service.repository","context":"."}}]',
        inputs.installer-ref || 'main') }}
      osac-cli-version: ${{ inputs.osac-cli-version || '' }}
      caas-agent-flow: ${{ inputs.caas-agent-flow || 'hot-pool' }}
      runner-label: ${{ inputs.runner-label || 'osac-ci' }}
      fork-pr-author-association: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.author_association || '' }}
      fork-pr-author: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.user.login || '' }}
      pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}
      notify-on-failure: ${{ github.event_name == 'schedule' }}
      enable-ai-diagnostic: ${{ github.ref == 'refs/heads/main' }}

  # checks:write; unreported check is still Expected/Waiting.
