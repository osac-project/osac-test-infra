---
name: E2E VMaaS Full Install

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      pr-number:
        description: "PR number (set by slash /test; used to read e2e-regression/e2e-serial labels)"
        required: false
        type: string
        default: ""
      test-suite:
        description: "Test suite (vmaas, vmaas/regression, ...). Default: vmaas. PR e2e-regression/e2e-serial labels override."
        required: false
        default: "vmaas"
      test-filter:
        description: "pytest -k filter"
        required: false
        default: ""
      test-marker:
        description: "pytest -m marker expression (e.g. sanity, regression). When empty, excludes tests marked requires_caas or requires_bmaas."
        required: false
        default: ""
      installer-ref:
        description: "Branch/ref of the OSAC monorepo"
        required: false
        default: "main"
      installer-repo:
        description: "GitHub repo (owner/name) of the OSAC monorepo"
        required: false
        default: "osac-project/osac"
      image-overrides:
        description: "JSON mapping Helm value paths to image refs"
        required: false
        default: "{}"
      osac-cli-version:
        description: "OSAC CLI version (e.g. 0.0.73). Defaults to latest."
        required: false
        default: ""
      runner-label:
        description: "Self-hosted runner label to target (e.g. osac-ci-1 to pin to one machine for verification/debugging). Defaults to the shared fleet-wide label."
        required: false
        default: ""

concurrency:
  group: e2e-vmaas-full-install-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # until concurrency cancelled it; the gate then treated cancelled as failure.
  resolve-suite:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      test-suite: ${{ steps.pick.outputs.test-suite }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/resolve-e2e-suite.sh
      - name: Resolve test-suite from input or PR labels
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr-number || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPLICIT_SUITE: ${{ inputs.test-suite || '' }}
        run: |
          set -euo pipefail
          # Unlabeled default stays the full suite (same as main).
          suite=$(bash .github/scripts/resolve-e2e-suite.sh vmaas vmaas "${EXPLICIT_SUITE}")
          echo "test-suite=${suite}" >>"${GITHUB_OUTPUT}"
          echo "Resolved test-suite"

  e2e-vmaas-full-install:
    needs: [resolve-suite]
    if: >-
      always()
      && (needs.resolve-suite.result == 'success'
          || (needs.resolve-suite.result == 'skipped'
              && github.event_name != 'workflow_dispatch'))
    permissions:
      contents: read
      # Required by e2e-vmaas-full-install.yml's "e2e" job -- only
      # exercised there when enable-ai-diagnostic is true (always false
      # for fork PR runs), but GitHub statically validates a called
      # reusable workflow's declared job permissions against what the
      # caller grants regardless of runtime reachability.
      id-token: write
    uses: ./.github/workflows/e2e-vmaas-full-install.yml
    with:
      # workflow_dispatch: resolve-suite (labels via API). Else: PR labels
      # from the event, then unlabeled defaults.
      test-suite: >-
        ${{
          needs.resolve-suite.outputs.test-suite ||
          github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e-serial') && 'vmaas/serial' ||
          github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e-regression') && 'vmaas/regression' ||
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'vmaas' ||
          github.event_name == 'schedule' && 'vmaas' ||
          'vmaas'
        }}
      test-filter: ${{ inputs.test-filter || '' }}
      # The references module contains CaaS and BMaaS tests too. Those
      # services are disabled in the VMaaS profile, so exclude tests marked
      # with either dependency unless an explicit workflow-dispatch marker is
      # supplied. Matches osac-project/osac#805.
      test-marker: ${{ inputs.test-marker || 'not requires_caas and not requires_bmaas' }}
      installer-ref: ${{ inputs.installer-ref || 'main' }}
      installer-repo: ${{ inputs.installer-repo || 'osac-project/osac' }}
      image-overrides: ${{ inputs.image-overrides || '{}' }}
      components: >-
        ${{ format('[{{"repo":"osac-project/osac","ref":"{0}","containerfile":"fulfillment-service/Containerfile","imageKey":"service.images.service.repository","context":"."}}]',
        inputs.installer-ref || 'main') }}
      osac-cli-version: ${{ inputs.osac-cli-version || '' }}
      runner-label: ${{ inputs.runner-label || 'osac-ci' }}
      # Pass author_association and login for fork PR authorization (empty for non-fork PRs)
      fork-pr-author-association: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.author_association || '' }}
      fork-pr-author: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.user.login || '' }}
      pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}
      notify-on-failure: ${{ github.event_name == 'schedule' }}
      enable-ai-diagnostic: ${{ github.ref == 'refs/heads/main' }}

  # Skip this required check on unreadiness so it stays pending (not red).
  # checks:write; unreported check is still Expected/Waiting.
