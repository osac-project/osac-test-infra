    concurrency:
      group: e2e-pr-vmaas-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Join the suite concurrency group
        run: echo "A new commit cancels the in-progress VMaaS suite."

  cancel-vmaas-netris:
    name: Cancel the in-progress VMaaS Netris suite
    runs-on: ubuntu-latest
    concurrency:
      group: e2e-pr-vmaas-netris-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Join the suite concurrency group
        run: echo "A new commit cancels the in-progress VMaaS Netris suite."

  cancel-stretched-netris:
    name: Cancel the in-progress Stretched Netris suite
