---
name: Slash Command Handler

on:
  workflow_call: {}

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: write

jobs:
  handle-command:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Checkout slash-command registry helper
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The helper scripts of the revision of this very workflow file: a caller that pins the handler by commit gets
          # the scripts of the same commit, not of main.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .slash-command-tools
          sparse-checkout: |
            .github/scripts/optional-workflows.sh
            .github/scripts/optional-dispatch-plan.sh
          persist-credentials: false

      - name: Check permissions
        env:
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          PERM=$(gh api "repos/${REPO}/collaborators/${COMMENTER}/permission" \
            --jq '.permission' 2>/dev/null) || true
          if [ -z "${PERM}" ]; then
            gh pr comment "${PR_NUMBER}" -R "${REPO}" \
              --body "@${COMMENTER} you don't have permission to trigger CI jobs. Required: write access or above."
            exit 1
          fi
          case "${PERM}" in
            admin|maintain|write) echo "User ${COMMENTER} has ${PERM} permission" ;;
            *)
              gh pr comment "${PR_NUMBER}" -R "${REPO}" \
                --body "@${COMMENTER} you don't have permission to trigger CI jobs. Required: write access or above."
              exit 1
              ;;
          esac

      - name: Get PR details
        id: pr
        run: |
          PR_JSON=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")

          HEAD_BRANCH=$(echo "${PR_JSON}" | jq -r '.head.ref')
          HEAD_SHA=$(echo "${PR_JSON}" | jq -r '.head.sha')
          HEAD_REPOSITORY=$(echo "${PR_JSON}" | jq -r '.head.repo.full_name // empty')
          HEAD_AUTHOR=$(echo "${PR_JSON}" | jq -r '.user.login // empty')
          AUTHOR_ASSOCIATION=$(echo "${PR_JSON}" | jq -r '.author_association // empty')

          echo "head_branch=${HEAD_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "head_repository=${HEAD_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "head_author=${HEAD_AUTHOR}" >> "$GITHUB_OUTPUT"
          echo "author_association=${AUTHOR_ASSOCIATION}" >> "$GITHUB_OUTPUT"

          if [ "${HEAD_REPOSITORY}" != "${REPO}" ]; then
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          fi

      - name: React with eyes
        run: |
          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='eyes'

      - name: Parse command
        id: cmd
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          FIRST_LINE=$(echo "${COMMENT_BODY}" | head -n1 | xargs)

          if [[ "${FIRST_LINE}" =~ ^/ok-to-test([[:space:]]|$) ]]; then
            echo "command=ok-to-test" >> "$GITHUB_OUTPUT"
          elif [[ "${FIRST_LINE}" =~ ^/e2e-ready([[:space:]]|$) ]]; then
            echo "command=e2e-ready" >> "$GITHUB_OUTPUT"
          elif [[ "${FIRST_LINE}" =~ ^/e2e-regression([[:space:]]|$) ]]; then
            echo "command=e2e-regression" >> "$GITHUB_OUTPUT"
          elif [[ "${FIRST_LINE}" =~ ^/e2e-serial([[:space:]]|$) ]]; then
            echo "command=e2e-serial" >> "$GITHUB_OUTPUT"
          elif [[ "${FIRST_LINE}" =~ ^/retest ]]; then
            echo "command=retest" >> "$GITHUB_OUTPUT"
          elif [[ "${FIRST_LINE}" =~ ^/cancel[[:space:]]+(.*) ]]; then
            echo "command=cancel:${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "${FIRST_LINE}" =~ ^/cancel ]]; then
            echo "command=cancel:all" >> "$GITHUB_OUTPUT"
          elif [[ "${FIRST_LINE}" =~ ^/test[[:space:]]+(.*) ]]; then
            echo "command=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "command=help" >> "$GITHUB_OUTPUT"
          fi

      - name: Discover workflows
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          # Fetch active workflows and their file stems
          gh workflow list -R "${REPO}" --json id,name,path,state \
            --limit 200 \
            --jq '[.[] | select(.state == "active")]' > /tmp/workflows.json

          # Fetch latest PR run per workflow for this SHA
          gh run list -R "${REPO}" --limit 200 \
            --json databaseId,workflowDatabaseId,workflowName,headSha,event \
            --jq "[.[] | select(.headSha == \"${HEAD_SHA}\" and .event == \"pull_request\")]
              | group_by(.workflowDatabaseId)
              | map(first)" > /tmp/pr_runs.json

          # Join: for each PR run, resolve its workflow file stem
          jq -s '
            (.[0] | map({key: (.id | tostring), value: .}) | from_entries) as $wf_map |
            [.[1][] |
              ($wf_map[(.workflowDatabaseId | tostring)] // null) as $wf |
              select($wf != null) |
              {
                id: .databaseId,
                stem: ($wf.path | ltrimstr(".github/workflows/") | rtrimstr(".yml") | rtrimstr(".yaml") | rtrimstr("-caller")),
                name: $wf.name
              }
            ]
          ' /tmp/workflows.json /tmp/pr_runs.json > /tmp/available.json

      - name: Load optional workflow registry
        if: >-
          steps.cmd.outputs.command == '?' ||
          steps.cmd.outputs.command == 'help' ||
          steps.cmd.outputs.command == 'retest' ||
          (
            steps.cmd.outputs.command != 'ok-to-test' &&
            steps.cmd.outputs.command != 'e2e-ready' &&
            steps.cmd.outputs.command != 'e2e-regression' &&
            steps.cmd.outputs.command != 'e2e-serial' &&
            !startsWith(steps.cmd.outputs.command, 'cancel:')
          )
        env:
          OPTIONAL_WORKFLOW_TOOL: ${{ github.workspace }}/.slash-command-tools/.github/scripts/optional-workflows.sh
        run: |
          set -euo pipefail

          DEFAULT_BRANCH=$(gh api "repos/${REPO}" --jq '.default_branch')
          echo "DEFAULT_BRANCH=${DEFAULT_BRANCH}" >> "$GITHUB_ENV"

          REGISTRY_YAML=/tmp/optional-workflows.yml
          REGISTRY_RESPONSE=$(mktemp)
          REGISTRY_ERROR=$(mktemp)
          REGISTRY_PATH="repos/${REPO}/contents/.github/optional-workflows.yml?ref=${DEFAULT_BRANCH}"

          if gh api "${REGISTRY_PATH}" > "${REGISTRY_RESPONSE}" 2> "${REGISTRY_ERROR}"; then
            jq -r '.content' "${REGISTRY_RESPONSE}" | base64 --decode > "${REGISTRY_YAML}"
          elif grep -q '404' "${REGISTRY_ERROR}"; then
            printf '%s\n' 'version: 1' 'workflows: []' > "${REGISTRY_YAML}"
          else
            cat "${REGISTRY_ERROR}" >&2
            exit 1
          fi

          bash "${OPTIONAL_WORKFLOW_TOOL}" build \
            "${REGISTRY_YAML}" /tmp/workflows.json /tmp/optional.json

          while IFS= read -r WORKFLOW; do
            WORKFLOW_YAML=$(mktemp)
            WORKFLOW_PATH="repos/${REPO}/contents/.github/workflows/${WORKFLOW}?ref=${DEFAULT_BRANCH}"
            gh api "${WORKFLOW_PATH}" --jq '.content' | base64 --decode > "${WORKFLOW_YAML}"
            TRIGGER=$(jq -r --arg workflow "${WORKFLOW}" \
              '.[] | select(.workflow == $workflow) | (.trigger // "workflow_dispatch")' \
              /tmp/optional.json)
            if [[ "${TRIGGER}" == "workflow_dispatch" ]]; then
              if yq -e 'has("on") and (.on | has("workflow_dispatch"))' "${WORKFLOW_YAML}" >/dev/null; then
                VALID_TRIGGER=true
              else
                VALID_TRIGGER=false
              fi
            else
              if yq -e 'has("on") and (.on | has("pull_request_target"))' "${WORKFLOW_YAML}" >/dev/null; then
                VALID_TRIGGER=true
              else
                VALID_TRIGGER=false
              fi
            fi
            if [[ "${VALID_TRIGGER}" != "true" ]]; then
              echo "::error::Registered workflow ${WORKFLOW} does not define the ${TRIGGER} trigger."
              exit 1
            fi
          done < <(jq -r '.[].workflow' /tmp/optional.json)

      - name: Handle help
        if: steps.cmd.outputs.command == '?' || steps.cmd.outputs.command == 'help'
        run: |
          {
            echo "### Slash commands"
            echo ""
            echo "Commands match workflow file names by prefix."
            echo ""
            echo "| Command | Workflow |"
            echo "|---------|----------|"

            while IFS=$'\t' read -r stem name; do
              echo "| \`/test ${stem}\` | ${name} |"
            done < <(jq -r '.[] | "\(.stem)\t\(.name)"' /tmp/available.json)

            while IFS=$'\t' read -r command name description; do
              echo "| \`/test ${command}\` | ${name} (optional, manual) — ${description} |"
            done < <(jq -r '.[] | "\(.command)\t\(.name)\t\(.description)"' /tmp/optional.json)

            echo "| \`/test all\` | Re-run all PR workflows |"
            echo "| \`/test e2e-full-regression\` | Dispatch VMaaS + CaaS + BMaaS full e2e (not a PR rerun) |"
            echo "| \`/test ?\` or \`/test help\` | Show this help |"
            echo "| \`/retest\` | Re-run all failed checks |"
            echo "| \`/cancel [name]\` | Cancel in-progress runs |"
            echo "| \`/ok-to-test\` | Fork secrets only. |"
            echo "| \`/e2e-regression\` | Apply \`e2e-regression\` (suite tier; does not start e2e) |"
            echo "| \`/e2e-serial\` | Apply \`e2e-serial\` (suite tier; does not start e2e) |"

            if jq -e '[.[] | select(.stem | startswith("e2e-"))] | length > 0' /tmp/available.json > /dev/null 2>&1; then
              echo ""
              echo "Tip: \`/test e2e\` runs all \`e2e-*\` workflows."
              echo "Suite tier: \`/e2e-regression\` or \`/e2e-serial\`, then \`/test vmaas\` / \`caas\` / \`bmaas\` (or wait for the next PR full-install)."
              echo ""
              echo "The full-install e2e starts when a person with write access approves the latest commit."
              echo "Fork PRs also need \`/ok-to-test\` (or org membership) for secrets."
            fi
          } > /tmp/help_body.md

          gh pr comment "${PR_NUMBER}" -R "${REPO}" \
            --body "$(cat /tmp/help_body.md)"
          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='rocket'

      - name: Handle ok-to-test
        if: steps.cmd.outputs.command == 'ok-to-test'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_BRANCH: ${{ steps.pr.outputs.head_branch }}
        run: |
          echo "Adding ok-to-test label to PR #${PR_NUMBER}..."

          # Add the ok-to-test label
          gh pr edit "${PR_NUMBER}" -R "${REPO}" --add-label "ok-to-test" 2>/dev/null || \
            gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" \
              --input - <<< '{"labels":["ok-to-test"]}' --silent

          # Find and approve pending workflow runs for HEAD_SHA (GitHub's
          # native first-time-contributor/fork "action_required" gate)
          APPROVED=0
          PENDING_RUNS=$(gh api "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&status=action_required" \
            --jq '.workflow_runs[].id' 2>/dev/null || true)

          for RUN_ID in ${PENDING_RUNS}; do
            if gh api "repos/${REPO}/actions/runs/${RUN_ID}/approve" --method POST --silent 2>/dev/null; then
              APPROVED=$((APPROVED + 1))
            fi
          done

          # Also rerun runs that already ran and failed at this SHA -- e.g. a
          # fork PR's e2e run that hit the in-workflow "Authorize fork PR"
          # gate (a custom check, not GitHub's native action_required state,
          # so the approve loop above never catches it). Same lookup as the
          # "Handle retest" step below.
          RERUN=0
          FAILED_RUNS=$(gh run list \
            -R "${REPO}" \
            --branch "${HEAD_BRANCH}" \
            --status failure \
            --limit 200 \
            --json databaseId,headSha \
            --jq "[.[] | select(.headSha == \"${HEAD_SHA}\") | .databaseId] | .[]")

          for RUN_ID in ${FAILED_RUNS}; do
            if gh run rerun "${RUN_ID}" -R "${REPO}" 2>/dev/null; then
              RERUN=$((RERUN + 1))
            fi
          done

          # Post confirmation comment
          MSG="Labeled \`ok-to-test\`."
          [[ ${APPROVED} -gt 0 ]] && MSG="${MSG} Approved ${APPROVED} pending workflow run(s)."
          [[ ${RERUN} -gt 0 ]] && MSG="${MSG} Re-ran ${RERUN} failed run(s)."
          if [[ ${APPROVED} -eq 0 && ${RERUN} -eq 0 ]]; then
            MSG="${MSG} No pending or failed runs found for \`${HEAD_SHA:0:7}\` — tests will be authorized on next trigger."
          fi
          gh pr comment "${PR_NUMBER}" -R "${REPO}" --body "${MSG}"

          # React with checkmark
          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='+1' --silent 2>/dev/null || true

      - name: Handle e2e-ready
        if: steps.cmd.outputs.command == 'e2e-ready'
        run: |
          # The command used to apply a label that unlocked the expensive e2e. The e2e now starts when a person with
          # write access approves the pull request (osac-ci flow), so there is nothing to unlock.
          gh pr comment "${PR_NUMBER}" -R "${REPO}" \
            --body "\`/e2e-ready\` is no longer needed: the full-install e2e starts when a person with write access approves the latest commit."
      - name: Handle e2e-regression / e2e-serial
        if: >-
          steps.cmd.outputs.command == 'e2e-regression' ||
          steps.cmd.outputs.command == 'e2e-serial'
        env:
          TIER_LABEL: ${{ steps.cmd.outputs.command }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          case "${TIER_LABEL}" in
            e2e-regression) CLEAR_LABEL=e2e-serial ;;
            e2e-serial) CLEAR_LABEL=e2e-regression ;;
            *)
              echo "::error::Unexpected tier label ${TIER_LABEL}"
              exit 1
              ;;
          esac

          CURRENT_HEAD_SHA=$(gh pr view "${PR_NUMBER}" -R "${REPO}" \
            --json headRefOid --jq '.headRefOid')
          if [[ "${CURRENT_HEAD_SHA}" != "${HEAD_SHA}" ]]; then
            gh pr comment "${PR_NUMBER}" -R "${REPO}" \
              --body "Could not apply \`${TIER_LABEL}\`: PR head moved to \`${CURRENT_HEAD_SHA:0:7}\`. Retry \`/${TIER_LABEL}\`."
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
              -f content='confused' --silent 2>/dev/null || true
            exit 1
          fi

          if ! gh label list --search "${TIER_LABEL}" -R "${REPO}" --limit 1 \
            --json name --jq '.[].name' | grep -Fxq "${TIER_LABEL}"; then
            gh label create "${TIER_LABEL}" -R "${REPO}" --color 0E8A16 \
              --description "E2E suite tier (does not start e2e)"
          fi

          if gh pr view "${PR_NUMBER}" -R "${REPO}" --json labels \
            --jq '.labels[].name' 2>/dev/null | grep -Fxq "${CLEAR_LABEL}"; then
            if ! gh pr edit "${PR_NUMBER}" -R "${REPO}" --remove-label "${CLEAR_LABEL}"; then
              gh pr comment "${PR_NUMBER}" -R "${REPO}" \
                --body "Failed to remove \`${CLEAR_LABEL}\` before applying \`${TIER_LABEL}\` for \`${HEAD_SHA:0:7}\`."
              gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
                -f content='confused' --silent 2>/dev/null || true
              exit 1
            fi
          fi

          if ! gh pr view "${PR_NUMBER}" -R "${REPO}" --json labels \
            --jq '.labels[].name' 2>/dev/null | grep -Fxq "${TIER_LABEL}"; then
            if ! gh pr edit "${PR_NUMBER}" -R "${REPO}" --add-label "${TIER_LABEL}"; then
              gh pr comment "${PR_NUMBER}" -R "${REPO}" \
                --body "Failed to apply \`${TIER_LABEL}\` for \`${HEAD_SHA:0:7}\`."
              gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
                -f content='confused' --silent 2>/dev/null || true
              exit 1
            fi
          fi

          gh pr comment "${PR_NUMBER}" -R "${REPO}" \
            --body "Labeled \`${TIER_LABEL}\` on \`${HEAD_SHA:0:7}\` (does not start e2e). Next full-install run uses \`*/${TIER_LABEL#e2e-}\`. Immediate: \`/test vmaas\`, \`/test caas\`, or \`/test bmaas\`."
          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='+1' --silent 2>/dev/null || true

      - name: Handle e2e-full-regression
        if: steps.cmd.outputs.command == 'e2e-full-regression'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_BRANCH: ${{ steps.pr.outputs.head_branch }}
          IS_FORK: ${{ steps.pr.outputs.is_fork }}
        run: |
          # /test normally reruns existing pull_request runs. Full regression
          # is schedule/dispatch only (OSAC-4914), so dispatch it instead.
          # GITHUB_TOKEN is repo-scoped: this only works on osac-test-infra
          # (the workflow file is not in osac; osac comments cannot start it).
          if [[ "${REPO}" != *"/osac-test-infra" ]]; then
            gh pr comment "${PR_NUMBER}" -R "${REPO}" \
              --body "\`/test e2e-full-regression\` lives in \`osac-test-infra\`. Dispatch **E2E Full Regression** from that repo's Actions tab, or comment on an osac-test-infra PR."
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
              -f content='confused' --silent 2>/dev/null || true
            exit 1
          fi

          DISPATCH_ARGS=(workflow run e2e-full-regression-caller.yml -R "${REPO}")
          if [[ "${IS_FORK}" != "true" && -n "${HEAD_BRANCH}" ]]; then
            DISPATCH_ARGS+=(--ref "${HEAD_BRANCH}")
          fi

          if ! gh "${DISPATCH_ARGS[@]}"; then
            if [[ "${IS_FORK}" != "true" ]]; then
              echo "::warning::Dispatch on ${HEAD_BRANCH} failed; retrying on default branch."
              gh workflow run e2e-full-regression-caller.yml -R "${REPO}" || {
                gh pr comment "${PR_NUMBER}" -R "${REPO}" \
                  --body "Could not dispatch \`e2e-full-regression\`. Is \`e2e-full-regression-caller.yml\` on this repo's default branch?"
                gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
                  -f content='confused' --silent 2>/dev/null || true
                exit 1
              }
            else
              gh pr comment "${PR_NUMBER}" -R "${REPO}" \
                --body "Could not dispatch \`e2e-full-regression\`. Is \`e2e-full-regression-caller.yml\` on this repo's default branch?"
              gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
                -f content='confused' --silent 2>/dev/null || true
              exit 1
            fi
          fi

          gh pr comment "${PR_NUMBER}" -R "${REPO}" \
            --body "Dispatched **E2E Full Regression** (VMaaS + CaaS + BMaaS) from \`${HEAD_SHA:0:7}\`. This is a new scheduled/dispatch run, not a rerun of PR checks."
          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='rocket' --silent 2>/dev/null || true

      - name: Execute command
        if: >-
          steps.cmd.outputs.command != '?' &&
          steps.cmd.outputs.command != 'help' &&
          steps.cmd.outputs.command != 'retest' &&
          steps.cmd.outputs.command != 'ok-to-test' &&
          steps.cmd.outputs.command != 'e2e-ready' &&
          steps.cmd.outputs.command != 'e2e-regression' &&
          steps.cmd.outputs.command != 'e2e-serial' &&
          steps.cmd.outputs.command != 'e2e-full-regression' &&
          !startsWith(steps.cmd.outputs.command, 'cancel:')
        env:
          COMMAND: ${{ steps.cmd.outputs.command }}
          OPTIONAL_DISPATCH_PLAN_TOOL: ${{ github.workspace }}/.slash-command-tools/.github/scripts/optional-dispatch-plan.sh
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_BRANCH: ${{ steps.pr.outputs.head_branch }}
          HEAD_REPOSITORY: ${{ steps.pr.outputs.head_repository }}
          HEAD_AUTHOR: ${{ steps.pr.outputs.head_author }}
          AUTHOR_ASSOCIATION: ${{ steps.pr.outputs.author_association }}
          IS_FORK: ${{ steps.pr.outputs.is_fork }}
          TRIGGER_GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: |
          SUCCEEDED=""
          FAILED=""

          track_result() {
            local name="$1"
            if [ "$2" -eq 0 ]; then
              SUCCEEDED="${SUCCEEDED:+${SUCCEEDED}, }${name}"
            else
              FAILED="${FAILED:+${FAILED}, }${name}"
            fi
          }

          if jq -e --arg cmd "${COMMAND}" 'any(.[]; .command == $cmd)' /tmp/optional.json > /dev/null; then
            OPTIONAL_PLAN=$(bash "${OPTIONAL_DISPATCH_PLAN_TOOL}" plan \
              /tmp/optional.json "${COMMAND}" "${DEFAULT_BRANCH}" \
              "${PR_NUMBER}" "${HEAD_REPOSITORY}" "${HEAD_BRANCH}" "${HEAD_SHA}" \
              "${HEAD_AUTHOR}" "${AUTHOR_ASSOCIATION}" "${IS_FORK}")
            OPTIONAL_WORKFLOW=$(jq -r '.workflow' <<< "${OPTIONAL_PLAN}")
            MARKER=$(jq -r '.marker' <<< "${OPTIONAL_PLAN}")
            OPTIONAL_TRIGGER=$(jq -r '.trigger // "workflow_dispatch"' <<< "${OPTIONAL_PLAN}")
            OPTIONAL_LABEL=$(jq -r '.label // ""' <<< "${OPTIONAL_PLAN}")
            DISPATCH_REF=$(jq -r '.default_branch' <<< "${OPTIONAL_PLAN}")
            mapfile -t DISPATCH_ARGS < <(jq -r '.dispatch_args[]' <<< "${OPTIONAL_PLAN}")

            CURRENT_PR_JSON=$(gh pr view "${PR_NUMBER}" -R "${REPO}" \
              --json headRefName,headRefOid,headRepository)
            CURRENT_HEAD_BRANCH=$(jq -r '.headRefName' <<< "${CURRENT_PR_JSON}")
            CURRENT_HEAD_SHA=$(jq -r '.headRefOid' <<< "${CURRENT_PR_JSON}")
            CURRENT_HEAD_REPOSITORY=$(jq -r '.headRepository.nameWithOwner // empty' <<< "${CURRENT_PR_JSON}")
            if [[ "${CURRENT_HEAD_SHA}" != "${HEAD_SHA}" \
              || "${CURRENT_HEAD_BRANCH}" != "${HEAD_BRANCH}" \
              || "${CURRENT_HEAD_REPOSITORY}" != "${HEAD_REPOSITORY}" ]]; then
              gh pr comment "${PR_NUMBER}" -R "${REPO}" \
                --body "Could not dispatch \`/test ${COMMAND}\`: PR head moved from \`${HEAD_SHA:0:7}\`. Retry the command for the current revision."
              gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
                -f content='confused' --silent 2>/dev/null || true
              exit 1
            fi

            if [[ "${OPTIONAL_TRIGGER}" == "label" ]]; then
              RUN_EVENT="pull_request_target"
            else
              RUN_EVENT="workflow_dispatch"
            fi
            ACTIVE_RUN=$(gh run list \
              -R "${REPO}" \
              --workflow "${OPTIONAL_WORKFLOW}" \
              --limit 200 \
              --json databaseId,status,event,displayTitle,url \
              --jq "[.[] | select(.event == \"${RUN_EVENT}\" and .status != \"completed\" and ((.displayTitle // \"\") | contains(\"${MARKER}\"))) | [.databaseId, .url]] | first | if . then @tsv else empty end")

            if [[ -n "${ACTIVE_RUN}" ]]; then
              IFS=$'\t' read -r ACTIVE_RUN_ID ACTIVE_RUN_URL <<< "${ACTIVE_RUN}"
              gh pr comment "${PR_NUMBER}" -R "${REPO}" \
                --body "\`/test ${COMMAND}\` is already running for \`${HEAD_SHA:0:7}\`: [run #${ACTIVE_RUN_ID}](${ACTIVE_RUN_URL})."
              gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
                -f content='rocket' --silent 2>/dev/null || true
              exit 0
            fi

            STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            if [[ "${OPTIONAL_TRIGGER}" == "label" ]]; then
              if [[ -z "${TRIGGER_GH_TOKEN}" ]]; then
                gh pr comment "${PR_NUMBER}" -R "${REPO}" \
                  --body "Cannot trigger optional workflow \`${OPTIONAL_WORKFLOW}\`: the label-trigger token is not configured."
                gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
                  -f content='confused' --silent 2>/dev/null || true
                exit 1
              fi
              if ! GH_TOKEN="${TRIGGER_GH_TOKEN}" gh label list --search "${OPTIONAL_LABEL}" \
                -R "${REPO}" --limit 1 --json name --jq '.[].name' | grep -Fxq "${OPTIONAL_LABEL}"; then
                GH_TOKEN="${TRIGGER_GH_TOKEN}" gh label create "${OPTIONAL_LABEL}" \
                  -R "${REPO}" --color 1D76DB --description "Manual optional BMaaS Netris E2E trigger"
              fi
              if GH_TOKEN="${TRIGGER_GH_TOKEN}" gh pr view "${PR_NUMBER}" -R "${REPO}" \
                --json labels --jq '.labels[].name' 2>/dev/null | grep -Fxq "${OPTIONAL_LABEL}"; then
                GH_TOKEN="${TRIGGER_GH_TOKEN}" gh pr edit "${PR_NUMBER}" -R "${REPO}" \
                  --remove-label "${OPTIONAL_LABEL}"
              fi
              if ! GH_TOKEN="${TRIGGER_GH_TOKEN}" gh pr edit "${PR_NUMBER}" -R "${REPO}" \
                --add-label "${OPTIONAL_LABEL}"; then
                gh pr comment "${PR_NUMBER}" -R "${REPO}" \
                  --body "Failed to apply trigger label \`${OPTIONAL_LABEL}\` for \`${HEAD_SHA:0:7}\`."
                gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
                  -f content='confused' --silent 2>/dev/null || true
                exit 1
              fi
            else
              if ! gh workflow run "${OPTIONAL_WORKFLOW}" \
                -R "${REPO}" \
                --ref "${DISPATCH_REF}" \
                "${DISPATCH_ARGS[@]}"; then
                gh pr comment "${PR_NUMBER}" -R "${REPO}" \
                  --body "Failed to dispatch optional workflow \`${OPTIONAL_WORKFLOW}\` for \`${HEAD_SHA:0:7}\`."
                gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
                  -f content='confused' --silent 2>/dev/null || true
                exit 1
              fi
            fi

            RUN_URL=""
            for _ in {1..10}; do
              RUN_URL=$(gh run list \
                -R "${REPO}" \
                --workflow "${OPTIONAL_WORKFLOW}" \
                --limit 200 \
                --json status,event,displayTitle,createdAt,url \
                --jq "[.[] | select(.event == \"${RUN_EVENT}\" and ((.displayTitle // \"\") | contains(\"${MARKER}\")) and .createdAt >= \"${STARTED_AT}\")] | sort_by(.createdAt) | (last // {}) | .url // \"\"")
              [[ -n "${RUN_URL}" ]] && break
              sleep 2
            done
            if [[ -z "${RUN_URL}" ]]; then
              RUN_URL="https://github.com/${REPO}/actions/workflows/${OPTIONAL_WORKFLOW}"
            fi

            gh pr comment "${PR_NUMBER}" -R "${REPO}" \
              --body "Triggered optional \`/test ${COMMAND}\` for \`${HEAD_SHA:0:7}\`: [workflow run](${RUN_URL})."
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
              -f content='rocket' --silent 2>/dev/null || true
            exit 0
          fi

          if [ "${COMMAND}" = "all" ]; then
            MATCHES=$(jq -r '.[] | "\(.id)\t\(.name)"' /tmp/available.json)
          else
            MATCHES=$(jq -r --arg cmd "${COMMAND}" '
              .[] | select(.stem == $cmd or (.stem | startswith($cmd + "-")))
              | "\(.id)\t\(.name)"
            ' /tmp/available.json)
          fi

          if [ -z "${MATCHES}" ]; then
            gh pr comment "${PR_NUMBER}" -R "${REPO}" \
              --body "No PR workflow runs found matching \`/test ${COMMAND}\` at commit \`${HEAD_SHA:0:7}\`. Use \`/test ?\` to see available commands."
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
              -f content='confused'
            exit 1
          fi

          while IFS=$'\t' read -r run_id run_name; do
            [ -z "${run_id}" ] && continue
            if gh run rerun "${run_id}" -R "${REPO}"; then
              track_result "${run_name}" 0
            else
              track_result "${run_name}" 1
            fi
          done <<< "${MATCHES}"

          if [ -n "${FAILED}" ]; then
            BODY="Failed: ${FAILED}"
            [ -n "${SUCCEEDED}" ] && BODY="${BODY}
          Succeeded: ${SUCCEEDED}"
            gh pr comment "${PR_NUMBER}" -R "${REPO}" --body "${BODY}"
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
              -f content='-1'
            exit 1
          fi

          gh pr comment "${PR_NUMBER}" -R "${REPO}" \
            --body "Triggered: ${SUCCEEDED}"
          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='rocket'

      - name: Handle retest
        if: steps.cmd.outputs.command == 'retest'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_BRANCH: ${{ steps.pr.outputs.head_branch }}
          HEAD_REPOSITORY: ${{ steps.pr.outputs.head_repository }}
          TRIGGER_GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: |
          CURRENT_PR_JSON=$(gh pr view "${PR_NUMBER}" -R "${REPO}" \
            --json headRefName,headRefOid,headRepository)
          CURRENT_HEAD_BRANCH=$(jq -r '.headRefName' <<< "${CURRENT_PR_JSON}")
          CURRENT_HEAD_SHA=$(jq -r '.headRefOid' <<< "${CURRENT_PR_JSON}")
          CURRENT_HEAD_REPOSITORY=$(jq -r '.headRepository.nameWithOwner // empty' <<< "${CURRENT_PR_JSON}")
          if [[ "${CURRENT_HEAD_SHA}" != "${HEAD_SHA}" \
            || "${CURRENT_HEAD_BRANCH}" != "${HEAD_BRANCH}" \
            || "${CURRENT_HEAD_REPOSITORY}" != "${HEAD_REPOSITORY}" ]]; then
            gh pr comment "${PR_NUMBER}" -R "${REPO}" \
              --body "Could not retest: PR head moved from \`${HEAD_SHA:0:7}\`. Retry \`/retest\` for the current revision."
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
              -f content='confused' --silent 2>/dev/null || true
            exit 1
          fi

          FAILED_RUNS=$(gh run list \
            -R "${REPO}" \
            --branch "${HEAD_BRANCH}" \
            --status failure \
            --limit 200 \
            --json databaseId,name,headSha \
            --jq "[.[] | select(.headSha == \"${HEAD_SHA}\") | [.databaseId, .name]] | .[] | @tsv")
          LABEL_RETESTS=""

          while IFS=$'\t' read -r OPTIONAL_WORKFLOW _command OPTIONAL_TRIGGER OPTIONAL_LABEL; do
            [ -z "${OPTIONAL_WORKFLOW}" ] && continue
            MARKER="PR #${PR_NUMBER} @ ${HEAD_SHA}"
            if [[ "${OPTIONAL_TRIGGER}" == "label" ]]; then
              OPTIONAL_RUNS=$(gh run list \
                -R "${REPO}" \
                --workflow "${OPTIONAL_WORKFLOW}" \
                --status failure \
                --limit 200 \
                --json databaseId,name,event,displayTitle \
                --jq "[.[] | select(.event == \"pull_request_target\" and ((.displayTitle // \"\") | contains(\"${MARKER}\"))) | [.databaseId, .name]] | .[] | @tsv")
              if [[ -n "${OPTIONAL_RUNS}" ]]; then
                LABEL_RETESTS="${LABEL_RETESTS}${LABEL_RETESTS:+$'\n'}${OPTIONAL_LABEL}"
              fi
            else
              OPTIONAL_RUNS=$(gh run list \
                -R "${REPO}" \
                --workflow "${OPTIONAL_WORKFLOW}" \
                --status failure \
                --limit 200 \
                --json databaseId,name,event,displayTitle \
                --jq "[.[] | select(.event == \"workflow_dispatch\" and ((.displayTitle // \"\") | contains(\"${MARKER}\"))) | [.databaseId, .name]] | .[] | @tsv")
            fi
            if [ -n "${OPTIONAL_RUNS}" ]; then
              if [[ "${OPTIONAL_TRIGGER}" == "workflow_dispatch" ]]; then
                if [ -n "${FAILED_RUNS}" ]; then
                  FAILED_RUNS+=$'\n'
                fi
                FAILED_RUNS+="${OPTIONAL_RUNS}"
              fi
            fi
          done < <(jq -r '.[] | select(.retestable == true) | [.workflow, .command, (.trigger // "workflow_dispatch"), (.label // "")] | @tsv' /tmp/optional.json)

          if [ -z "${FAILED_RUNS}" ] && [ -z "${LABEL_RETESTS}" ]; then
            gh pr comment "${PR_NUMBER}" -R "${REPO}" \
              --body "No failed workflow runs found for this PR at commit \`${HEAD_SHA:0:7}\`."
            exit 0
          fi

          RERUN_LIST=""
          RERUN_ERRORS=""

          while IFS=$'\t' read -r RUN_ID RUN_NAME; do
            [ -z "${RUN_ID}" ] && continue
            if gh run rerun "${RUN_ID}" -R "${REPO}"; then
              RERUN_LIST="${RERUN_LIST:+${RERUN_LIST}
          }- ${RUN_NAME} (#${RUN_ID})"
            else
              RERUN_ERRORS="${RERUN_ERRORS:+${RERUN_ERRORS}
          }- ${RUN_NAME} (#${RUN_ID})"
            fi
          done <<< "${FAILED_RUNS}"

          ensure_trigger_label() {
            local label="$1"
            if [[ -z "${TRIGGER_GH_TOKEN}" ]]; then
              echo "Missing MERGE_QUEUE_TOKEN for label-triggered retest: ${label}" >&2
              return 1
            fi
            if ! GH_TOKEN="${TRIGGER_GH_TOKEN}" gh label list --search "${label}" \
              -R "${REPO}" --limit 1 --json name --jq '.[].name' | grep -Fxq "${label}"; then
              GH_TOKEN="${TRIGGER_GH_TOKEN}" gh label create "${label}" \
                -R "${REPO}" --color 1D76DB --description "Manual optional E2E trigger"
            fi
          }

          retrigger_label() {
            local label="$1"
            ensure_trigger_label "${label}" || return 1
            if GH_TOKEN="${TRIGGER_GH_TOKEN}" gh pr view "${PR_NUMBER}" -R "${REPO}" \
              --json labels --jq '.labels[].name' 2>/dev/null | grep -Fxq "${label}"; then
              GH_TOKEN="${TRIGGER_GH_TOKEN}" gh pr edit "${PR_NUMBER}" -R "${REPO}" \
                --remove-label "${label}"
            fi
            GH_TOKEN="${TRIGGER_GH_TOKEN}" gh pr edit "${PR_NUMBER}" -R "${REPO}" \
              --add-label "${label}"
          }

          while IFS= read -r LABEL; do
            [ -z "${LABEL}" ] && continue
            if retrigger_label "${LABEL}"; then
              RERUN_LIST="${RERUN_LIST:+${RERUN_LIST}
          }- label-triggered workflow (${LABEL})"
            else
              RERUN_ERRORS="${RERUN_ERRORS:+${RERUN_ERRORS}
          }- label-triggered workflow (${LABEL})"
            fi
          done <<< "${LABEL_RETESTS}"

          BODY="Re-triggered failed runs:"
          if [ -n "${RERUN_LIST}" ]; then
            BODY="${BODY}
          ${RERUN_LIST}"
          fi
          if [ -n "${RERUN_ERRORS}" ]; then
            BODY="${BODY}

          Failed to re-trigger:
          ${RERUN_ERRORS}"
          fi

          gh pr comment "${PR_NUMBER}" -R "${REPO}" --body "${BODY}"

          if [ -n "${RERUN_ERRORS}" ]; then
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
              -f content='confused'
            exit 1
          fi

          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='rocket'

      - name: Handle cancel
        if: startsWith(steps.cmd.outputs.command, 'cancel:')
        env:
          COMMAND: ${{ steps.cmd.outputs.command }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_BRANCH: ${{ steps.pr.outputs.head_branch }}
        run: |
          CANCEL_TARGET="${COMMAND#cancel:}"
          CANCELLED=""
          CANCEL_ERRORS=""

          if [ "${CANCEL_TARGET}" = "all" ]; then
            ALL_RUNS=$(gh run list \
              -R "${REPO}" \
              --branch "${HEAD_BRANCH}" \
              --status in_progress \
              --limit 200 \
              --json databaseId,name,headSha \
              --jq "[.[] | select(.headSha == \"${HEAD_SHA}\") | [.databaseId, .name]] | .[] | @tsv")

            if [ -z "${ALL_RUNS}" ]; then
              gh pr comment "${PR_NUMBER}" -R "${REPO}" \
                --body "No in-progress workflow runs found for this PR at commit \`${HEAD_SHA:0:7}\`."
              exit 0
            fi

            while IFS=$'\t' read -r RUN_ID RUN_NAME; do
              [ -z "${RUN_ID}" ] && continue
              if gh run cancel "${RUN_ID}" -R "${REPO}"; then
                CANCELLED="${CANCELLED:+${CANCELLED}
          }- ${RUN_NAME} (#${RUN_ID})"
              else
                CANCEL_ERRORS="${CANCEL_ERRORS:+${CANCEL_ERRORS}
          }- ${RUN_NAME} (#${RUN_ID})"
              fi
            done <<< "${ALL_RUNS}"
          else
            # Fetch fresh in-progress runs and join with workflow map for stem matching
            IN_PROGRESS=$(gh run list -R "${REPO}" \
              --branch "${HEAD_BRANCH}" \
              --status in_progress \
              --limit 200 \
              --json databaseId,workflowDatabaseId,workflowName,headSha \
              --jq "[.[] | select(.headSha == \"${HEAD_SHA}\")]")

            MATCHES=$(jq -nr \
              --argjson wfs "$(cat /tmp/workflows.json)" \
              --argjson runs "${IN_PROGRESS}" \
              --arg cmd "${CANCEL_TARGET}" '
              ($wfs | map({key: (.id | tostring), value: .}) | from_entries) as $wf_map |
              [$runs[] |
                ($wf_map[(.workflowDatabaseId | tostring)] // null) as $wf |
                select($wf != null) |
                {
                  id: .databaseId,
                  stem: ($wf.path | ltrimstr(".github/workflows/") | rtrimstr(".yml") | rtrimstr(".yaml") | rtrimstr("-caller")),
                  name: $wf.name
                }
              ] | .[] | select(.stem == $cmd or (.stem | startswith($cmd + "-")))
              | "\(.id)\t\(.name)"
            ')

            if [ -z "${MATCHES}" ]; then
              gh pr comment "${PR_NUMBER}" -R "${REPO}" \
                --body "No in-progress runs found matching \`${CANCEL_TARGET}\` at commit \`${HEAD_SHA:0:7}\`. Use \`/test ?\` to see available names."
              gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
                -f content='confused'
              exit 1
            fi

            while IFS=$'\t' read -r RUN_ID RUN_NAME; do
              [ -z "${RUN_ID}" ] && continue
              if gh run cancel "${RUN_ID}" -R "${REPO}"; then
                CANCELLED="${CANCELLED:+${CANCELLED}
          }- ${RUN_NAME} (#${RUN_ID})"
              else
                CANCEL_ERRORS="${CANCEL_ERRORS:+${CANCEL_ERRORS}
          }- ${RUN_NAME} (#${RUN_ID})"
              fi
            done <<< "${MATCHES}"
          fi

          if [ -z "${CANCELLED}" ] && [ -z "${CANCEL_ERRORS}" ]; then
            gh pr comment "${PR_NUMBER}" -R "${REPO}" \
              --body "No in-progress runs found for \`${CANCEL_TARGET}\` at commit \`${HEAD_SHA:0:7}\`."
            exit 0
          fi

          BODY="Cancelled:"
          if [ -n "${CANCELLED}" ]; then
            BODY="${BODY}
          ${CANCELLED}"
          fi
          if [ -n "${CANCEL_ERRORS}" ]; then
            BODY="${BODY}

          Failed to cancel:
          ${CANCEL_ERRORS}"
          fi

          gh pr comment "${PR_NUMBER}" -R "${REPO}" --body "${BODY}"

          if [ -n "${CANCEL_ERRORS}" ]; then
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
              -f content='confused'
            exit 1
          fi

          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='rocket'
