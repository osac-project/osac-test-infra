---
# The BMaaS NetBox suite of a pull request, as a run of its own.
#
# What runs here: what e2e-pr-bmaas.yml does with the same arguments, plus
# `inventory-backend: netbox` — nothing else. The decision of e2e-pr.yml
# (osac-ci) starts it with workflow_dispatch for the approved commit; the
# policy names this file for the suite (`workflow: e2e-pr-bmaas-netbox.yml`
# in .github/e2e-policy.yml). The suite is manual_only in the policy until
# the flavor is validated end to end.
#
# Input trust: anyone with write access can dispatch this workflow with any
# inputs. `verify` (osac-ci) checks them against the pull request — the
# fork author and association, which decide whether a fork's code may run
# with secrets, are read from the pull request, never taken from the inputs.
#
# Do not rename the run: its end is recognised by the exact format
# `E2E suite · <suite id> · #<pull request> · <commit>` (the `#` is quoted
# because an unquoted one starts a YAML comment). The workflow runs from
# the default branch, while the code under test is the commit.
name: E2E BMaaS NetBox PR suite
run-name: "E2E suite · bmaas-netbox · #${{ inputs.pr-number }} · ${{ inputs.sha }}"

on:
  workflow_dispatch:
    inputs:
      repo:
        description: The repository that holds the commit (a fork for a fork pull request), owner/name
        required: true
        type: string
      sha:
        description: The head commit to test
        required: true
        type: string
      pr-number:
        description: The pull request number
        required: true
        type: string
      # The decision sends these two with every suite. They are not used: `verify` reads the author and association from
      # the pull request, so a dispatch cannot claim to be a member.
      fork-pr-author:
        description: Ignored (read from the pull request)
        required: false
        type: string
        default: ""
      fork-pr-author-association:
        description: Ignored (read from the pull request)
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
      pull-requests: read
    uses: osac-project/osac-ci/.github/workflows/suite-inputs.yml@c5ad0858e6a30ea99c7a2a4b0d4869580b3b655e  # v1.3.7
    with:
      repo: ${{ inputs.repo }}
      sha: ${{ inputs.sha }}
      pr-number: ${{ inputs.pr-number }}

  # Named after the suite id of .github/e2e-policy.yml: the line of the suite follows the deepest job of this run.

  bmaas-netbox:
    needs: [verify]
    permissions:
      contents: read
      id-token: write  # only declared because GitHub validates a called workflow's permissions statically (as in e2e-pr.yml)
    uses: ./.github/workflows/e2e-bmaas-full-install.yml
    secrets:
      # Live OTLP push credential; without it ci-observe degrades to no telemetry.
      ci-observe-otlp-password: ${{ secrets.CI_OBSERVE_OTLP_PASSWORD }}
    with:
      inventory-backend: netbox
      test-suite: bmaas/sanity
      test-filter: not TestBmaasNetworking
      installer-ref: main
      installer-repo: osac-project/osac
      components: '[{"repo":"osac-project/osac","ref":"main","containerfile":"fulfillment-service/Containerfile","imageKey":"service.images.service.repository","context":"."}]'
      test-infra-repository: ${{ inputs.repo }}
      test-infra-ref: ${{ inputs.sha }}
      runner-label: osac-ci
      fork-pr-author-association: ${{ needs.verify.outputs.fork-association }}
      ci-observe: true
      fork-pr-author: ${{ needs.verify.outputs.fork-author }}
      pr-number: ${{ inputs.pr-number }}
      notify-on-failure: false
      enable-ai-diagnostic: false
