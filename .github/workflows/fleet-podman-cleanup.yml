---
name: Fleet podman image cleanup

# Every host's 5 runner instances (see fleet/inventory/group_vars/all.yml's
# runner_count) run as the same github-runner Linux user, sharing one
# rootless podman store. Multi-stage `podman build` in the e2e-*-full-
# install workflows leaves each superseded intermediate stage behind as an
# untagged (<none>) image, and teardown.sh deliberately does not prune
# those itself: a prune from inside one job's teardown could race a
# different job's still-in-progress build on the same host and delete an
# image it isn't done with yet (seen in production: 1TB+ of dangling
# images accumulated on a single host before this existed).
#
# Runs here instead, matrixed one job per host so each host prunes its own
# store locally, gated on `until` well past the longest E2E run on record
# (~2h45m as of writing) so it can never touch an image any real job --
# on this host, this run or any other -- could still need.
#
# Also reaps stale osac-e2e-tests containers before pruning images. A job
# that gets killed abnormally (cancelled mid-run, host issue, a crashed
# runner process) can leave its test container running/stuck behind --
# teardown.sh's own force-remove only ever targets the CURRENT run's own
# image, so it structurally can't clean up a different, older run's
# leftover container. Found in production: 4 containers stuck for 3+
# weeks across 3 hosts, all from the same few-day window -- each one
# permanently blocking `podman rmi` on whatever image it references, so
# that image would otherwise be skipped by the prune step below forever,
# not just deferred one cycle like a genuinely in-progress job's image is.
#
# Also reaps stale *external* (buildah) working containers -- the actual
# biggest blocker found in production, and invisible to plain `podman ps
# -a` (needs --external). Every `podman build` stage that doesn't reach
# its own cleanup leaves one of these behind in the underlying storage,
# and each one pins its image layer exactly like a real container would.
# Found on a single host: 743 of them, some over 6 weeks old, collectively
# blocking every dangling image prune from removing anything at all no
# matter how many cycles ran -- confirmed live: 33 images skipped every
# single cycle before this, all 33 removed cleanly the moment these were
# cleared. `podman rm` alone fails on these ("container is mounted");
# `-f` is required, matching how teardown.sh already force-removes
# regular leftover containers for the same underlying reason.
on:
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:
    inputs:
      until:
        description: "Only remove dangling images older than this (podman image prune --filter until=). Floor is 6h -- comfortably past the longest E2E run on record (~2h45m) -- so a manual run can't be made to touch an image a real job could still need."
        required: false
        type: choice
        default: "6h"
        options:
          - "6h"
          - "12h"
          - "24h"
          - "48h"

permissions: {}

jobs:
  prune:
    strategy:
      fail-fast: false
      matrix:
        host:
          - osac-ci-1
          - osac-1
          - osac-2
          - osac-3
          - osac-4
          - osac-5
          - osac-6
          - osac-7
          - osac-8
          - osac-9
          - osac-10
    runs-on: ${{ matrix.host }}
    # Generous on purpose: this job's first-ever run has to work through
    # months of unbounded backlog (thousands of images, 600+GB on some
    # hosts) one `podman rmi` at a time, which took over 10 minutes and
    # hit the previous timeout on 7 of 11 hosts the first time this ran.
    # Steady-state runs only have ~6h of new dangling images to catch up
    # on and should finish in a small fraction of this.
    timeout-minutes: 60
    steps:
      - name: Reap stale E2E test containers
        shell: bash
        env:
          UNTIL: ${{ inputs.until || '6h' }}
        run: |
          # Only ever targets localhost/osac-e2e-tests:* -- this is the
          # single most important line in this step. node-exporter and,
          # on osac-ci-1, prometheus/grafana/alertmanager/etc. are all
          # *supposed* to run for weeks; matching on image name (not just
          # age) is what keeps this from ever touching them.
          if ! containers_output="$(podman ps -a --filter "until=${UNTIL}" --format '{{.ID}} {{.Image}}')"; then
            echo "::error::Failed to list containers on this host" >&2
            exit 1
          fi

          reaped=0
          if [[ -n "${containers_output}" ]]; then
            while IFS=' ' read -r cid cimage; do
              case "${cimage}" in
                localhost/osac-e2e-tests:*)
                  echo "Reaping stale E2E container ${cid} (${cimage}, created more than ${UNTIL} ago)"
                  podman rm -f "${cid}" >/dev/null 2>&1 || echo "::warning::Failed to remove container ${cid}"
                  reaped=$((reaped + 1))
                  ;;
              esac
            done <<< "${containers_output}"
          fi
          echo "Reaped ${reaped} stale E2E test container(s)."

      - name: Reap stale external (buildah) working containers
        shell: bash
        env:
          UNTIL: ${{ inputs.until || '6h' }}
        run: |
          # `--external` is required to see these at all -- they don't
          # show up in a plain `podman ps -a`. Age-gated the same way as
          # every other step here: anything from a build still genuinely
          # in progress is younger than ${UNTIL} and left alone.
          if ! ext_output="$(podman ps -a --external --filter "until=${UNTIL}" --format '{{.ID}}')"; then
            echo "::error::Failed to list external containers on this host" >&2
            exit 1
          fi

          reaped=0
          failed=0
          if [[ -n "${ext_output}" ]]; then
            while IFS= read -r cid; do
              # Plain `podman rm` fails on these ("container is mounted
              # and cannot be removed without using force") even when
              # genuinely stale -- confirmed live, -f is required.
              if podman rm -f "${cid}" >/dev/null 2>&1; then
                reaped=$((reaped + 1))
              else
                failed=$((failed + 1))
                echo "::warning::Failed to remove external container ${cid}"
              fi
            done <<< "${ext_output}"
          fi
          echo "Reaped ${reaped} stale external container(s), ${failed} failed."

      - name: Prune dangling podman images
        shell: bash
        env:
          UNTIL: ${{ inputs.until || '6h' }}
        run: |
          echo "-- before --"
          podman system df

          # `podman image prune` removes its whole candidate list as one
          # operation -- if any single dangling image is still referenced
          # by another image or a container (e.g. a live job's build still
          # in progress on this host right now), the entire call aborts
          # with a non-zero exit and every other image that pass WOULD
          # have safely removed goes untouched too (seen in practice: one
          # busy host, one in-progress job, and the whole host's prune for
          # that cycle failed outright). Removing one at a time means a
          # single busy image only costs that one image for this cycle --
          # it's still dangling and still gated by the same `until` filter
          # next run, so nothing is lost, just deferred.
          # Command substitution, not `mapfile -t x < <(cmd)` process
          # substitution: the latter's $? reflects mapfile's own read, not
          # the command's exit status, so a broken `podman images` call
          # would silently look identical to "0 dangling images found"
          # instead of the real error it is.
          if ! images_output="$(podman images -f dangling=true -f "until=${UNTIL}" -q)"; then
            echo "::error::Failed to list dangling images on this host" >&2
            exit 1
          fi
          if [[ -z "${images_output}" ]]; then
            dangling=()
          else
            mapfile -t dangling <<< "${images_output}"
          fi
          echo "Found ${#dangling[@]} dangling image(s) older than ${UNTIL}."

          removed=0
          skipped=0
          for img in "${dangling[@]}"; do
            rc=0
            podman rmi "${img}" >/dev/null 2>&1 || rc=$?
            case "${rc}" in
              0|1)
                # 1 = image already gone (e.g. removed alongside a shared
                # parent layer earlier in this same loop, or by a
                # concurrent job's own cleanup) -- the goal (image gone)
                # is already achieved, so this counts the same as removing
                # it ourselves.
                removed=$((removed + 1))
                ;;
              2)
                # 2 = still referenced by a container specifically (not a
                # generic failure) -- expected during a live job's build,
                # and safe to defer: still dangling, still gated by the
                # same `until` filter next run.
                skipped=$((skipped + 1))
                echo "Skipped ${img} -- still referenced by a container (likely a live job's build in progress). Will retry next cycle."
                ;;
              *)
                # Anything else (125 = podman/runtime-level error, or an
                # unrecognized code) is not a "busy image" case and
                # shouldn't be silently swallowed alongside those.
                echo "::error::podman rmi ${img} failed unexpectedly (exit ${rc})" >&2
                exit 1
                ;;
            esac
          done
          echo "Removed ${removed}, skipped ${skipped}."

          echo "-- after --"
          podman system df
