---
# Starts the full-install E2E suites for a pull request once a person (or, for a branch of this repository, CodeRabbit)
# has approved it, and reports the required check `E2E`. The decision, the check lines and the housekeeping are the shared
# workflows of osac-ci (see docs/CALLERS.md there); this file keeps only what belongs to this repository: triggers and
# run tracking. Which suites a change needs is .github/e2e-policy.yml, read from the default branch.
#
# The suite workflow files come from the default branch (this run is started by workflow_run), while the code under
# test - scripts, actions, Containerfile - is the pull request's own commit (test-infra-ref). A pull request that edits
# the suite workflow files themselves is first exercised in the merge queue; CODEOWNERS makes wg-infra review them.
#
# A member of the organization can start suites by hand with a comment on the pull request: `/test` (the suites the change
# needs) or `/test vmaas caas` (those suites), or with the checkboxes of the comment the decision keeps there.
name: E2E for pull requests
# The title is for people: the decision does not read it (it finds the run of an older commit by that commit's E2E line).
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('E2E #{0} (started by hand)', inputs.number) ||
  github.event_name == 'issue_comment' && format('E2E #{0} (suites asked for in a comment)', github.event.issue.number) ||
  github.event.workflow_run.pull_requests[0].number && format('E2E #{0} · {1}',
  github.event.workflow_run.pull_requests[0].number, github.event.workflow_run.head_branch) ||
  format('E2E · {0}:{1}', github.event.workflow_run.head_repository.owner.login, github.event.workflow_run.head_branch) }}

on:  # zizmor: ignore[dangerous-triggers] -- no pull request code is checked out here; the suites run the approved commit
  workflow_run:
    workflows:
      - "CI"
      - "E2E review relay"
      - "E2E comment"
      - "E2E VMaaS PR suite"
      - "E2E CaaS PR suite"
      - "E2E BMaaS PR suite"
      - "E2E BMaaS Netris PR suite"
      - "E2E VMaaS Netris PR suite"
      - "E2E Stretched Netris PR suite"
    types: [requested, completed]
    # The CI run of a merge queue entry is on a branch GitHub names gh-readonly-queue/...: it is no pull request, the
    # decision ignores it, and it only added a run with a long title for every entry.
    branches-ignore: ["gh-readonly-queue/**"]
  issue_comment:
    types: [edited, created]  # the checkboxes of the control comment, and a /test comment (any other comment is skipped)
  workflow_dispatch:
    inputs:
      number:
        description: Pull request number
        required: true

permissions: {}

jobs:
  decide:
    uses: osac-project/osac-ci/.github/workflows/e2e-pr-decide.yml@5bfcd1ff220362171967451de7aaabb9e027d855  # v1.3.6
    with:
      lines-kind: statuses
    permissions:
      contents: read
      pull-requests: write
      checks: read
      actions: write
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}

  track:
    needs: decide
    if: needs.decide.outputs.start == 'true'
    uses: osac-project/osac-ci/.github/workflows/e2e-pr-track.yml@5bfcd1ff220362171967451de7aaabb9e027d855  # v1.3.6
    permissions:
      contents: read
    with:
      lines-kind: statuses
      sha: ${{ needs.decide.outputs.sha }}
      suite-checks: ${{ needs.decide.outputs.suite-checks }}
      dispatched-runs: ${{ needs.decide.outputs.dispatched-runs }}
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}

  # The suites are not jobs here: the decision starts each as a run of its own (e2e-pr-<suite>.yml, named by the policy).

  finish:
    needs: [decide, track]
    if: always() && needs.decide.outputs.start == 'true'
    uses: osac-project/osac-ci/.github/workflows/e2e-pr-finish.yml@5bfcd1ff220362171967451de7aaabb9e027d855  # v1.3.6
    permissions:
      contents: read
      pull-requests: write
    with:
      lines-kind: statuses
      sha: ${{ needs.decide.outputs.sha }}
      suites: ${{ needs.decide.outputs.suites }}
      suite-checks: ${{ needs.decide.outputs.suite-checks }}
      dispatched: ${{ needs.decide.outputs.dispatched }}
      all-suite-checks: ${{ needs.decide.outputs.all-suite-checks }}
      number: ${{ needs.decide.outputs.number }}
      manual: ${{ needs.decide.outputs.manual }}
      selected-checks: ${{ needs.decide.outputs.selected-checks }}
      results: ${{ toJSON(needs) }}
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
