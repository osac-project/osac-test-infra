---
# The cheap checks of this repository, and the required check `CI` that sums them up. They run on every pull request
# (a required check that is skipped is never reported) and on the merge queue's speculative commit. The expensive
# full-install suites are not here: e2e-pr.yml and e2e-queue.yml start them, and report the required check `E2E`.
name: CI

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

  # The scripts under .github/scripts have their own tests; they were never run in CI before.
  script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"
      - name: Install script test dependencies
        run: python3 -m pip install 'PyYAML>=6.0,<7'
      - name: Python script tests
        run: |
          set -euo pipefail
          python3 -I .github/scripts/redact_test.py
          python3 -I .github/scripts/release_gate_test.py
          python3 -I .github/scripts/release_gate_canary_test.py
          python3 -I .github/scripts/upload_artifacts_test.py
          python3 -I .github/scripts/test_ai_diagnose_failure.py
          python3 -I .github/scripts/test_setup_virtual_bmh.py
          python3 -I .github/scripts/test_upsert_pr_comment.py
          python3 -I .github/scripts/netris_catalog_test.py
      - name: Shell script tests
        run: bash .github/scripts/discover-audit-runs-test.sh

  CI:
    name: CI
    if: always()
    needs: [pre-commit, script-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${RESULTS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "${RESULTS}" | jq -e 'any(.[]; .result != "success")' >/dev/null; then
            echo "::error::A check did not succeed"
            exit 1
          fi
