---
name: Bot approval
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
    inputs:
      number:
        description: One pull request number (empty means every open dependency update)
        required: false
        default: ""
permissions: {}
concurrency:
  group: bot-approve
  cancel-in-progress: false
jobs:
  sweep:
    uses: osac-project/osac-ci/.github/workflows/bot-sweep.yml@71f7996599155532e657c1da2eb9c8cad1dddea8  # v1.2.11
    permissions:
      contents: read
      pull-requests: read
    with:
      number: ${{ inputs.number }}
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
