---
# The merge queue's E2E: plans the suites for the queue entry (docs-only entries need none), runs them on the entry's
# speculative commit - which contains the merged workflow files, so a change to the suite workflows is exercised here
# for real - and writes the required check `E2E` of that commit. The shared workflows are osac-ci's; the suite jobs are
# this repository's.
name: E2E for the merge queue

on:
  merge_group:

permissions: {}

jobs:
  plan:
    uses: osac-project/osac-ci/.github/workflows/e2e-queue-plan.yml@728d1b064cdbfa429c68ce5bc5a35b47b6c127d7  # v1.3.10
    permissions:
      contents: read
      actions: write

  vmaas:
    needs: plan
    if: contains(needs.plan.outputs.suites, '"vmaas"')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/e2e-vmaas-full-install.yml
    secrets:
      # Live OTLP push credential; without it ci-observe degrades to no telemetry.
      ci-observe-otlp-password: ${{ secrets.CI_OBSERVE_OTLP_PASSWORD }}
      # No osac-ci-app-* secrets here, on purpose: the merge group commit carries the queued pull request's own changes,
      # so the actions that would receive the app key (upload-artifacts, mint-github-app-token) could be that pull
      # request's. Only the schedule and manual callers pass them. A manual run can be started on any branch by a person
      # with write access, who can already use the organization secrets this repository sees: this is not a barrier
      # against them, only against pull request code that nobody started.
    with:
      test-suite: vmaas
      test-marker: not requires_caas and not requires_bmaas
      installer-ref: main
      installer-repo: osac-project/osac
      components: '[{"repo":"osac-project/osac","ref":"main","containerfile":"fulfillment-service/Containerfile","imageKey":"service.images.service.repository","context":"."}]'
      test-infra-repository: ${{ github.repository }}
      test-infra-ref: ${{ github.event.merge_group.head_sha }}
      runner-label: osac-ci
      notify-on-failure: false
      enable-ai-diagnostic: false

  caas:
    needs: plan
    if: contains(needs.plan.outputs.suites, '"caas"')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/e2e-caas-full-install.yml
    secrets:
      # Live OTLP push credential; without it ci-observe degrades to no telemetry.
      ci-observe-otlp-password: ${{ secrets.CI_OBSERVE_OTLP_PASSWORD }}
      # No osac-ci-app-* secrets here, on purpose: the merge group commit carries the queued pull request's own changes,
      # so the actions that would receive the app key (upload-artifacts, mint-github-app-token) could be that pull
      # request's. Only the schedule and manual callers pass them. A manual run can be started on any branch by a person
      # with write access, who can already use the organization secrets this repository sees: this is not a barrier
      # against them, only against pull request code that nobody started.
    with:
      test-suite: caas/sanity
      test-marker: sanity
      caas-agent-flow: hot-pool
      installer-ref: main
      installer-repo: osac-project/osac
      components: '[{"repo":"osac-project/osac","ref":"main","containerfile":"fulfillment-service/Containerfile","imageKey":"service.images.service.repository","context":"."}]'
      test-infra-repository: ${{ github.repository }}
      test-infra-ref: ${{ github.event.merge_group.head_sha }}
      runner-label: osac-ci
      notify-on-failure: false
      enable-ai-diagnostic: false

  bmaas:
    needs: plan
    if: contains(needs.plan.outputs.suites, '"bmaas"')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/e2e-bmaas-full-install.yml
    secrets:
      # Live OTLP push credential; without it ci-observe degrades to no telemetry.
      ci-observe-otlp-password: ${{ secrets.CI_OBSERVE_OTLP_PASSWORD }}
      # No osac-ci-app-* secrets here, on purpose: the merge group commit carries the queued pull request's own changes,
      # so the actions that would receive the app key (upload-artifacts, mint-github-app-token) could be that pull
      # request's. Only the schedule and manual callers pass them. A manual run can be started on any branch by a person
      # with write access, who can already use the organization secrets this repository sees: this is not a barrier
      # against them, only against pull request code that nobody started.
    with:
      test-suite: bmaas/sanity
      test-filter: not TestBmaasNetworking
      installer-ref: main
      installer-repo: osac-project/osac
      components: '[{"repo":"osac-project/osac","ref":"main","containerfile":"fulfillment-service/Containerfile","imageKey":"service.images.service.repository","context":"."}]'
      test-infra-repository: ${{ github.repository }}
      test-infra-ref: ${{ github.event.merge_group.head_sha }}
      runner-label: osac-ci
      notify-on-failure: false
      enable-ai-diagnostic: false

  # The Netris suites, only for an entry that changes infra/netris/ (the netris-infra filter of .github/e2e-policy.yml).
  # Each runs as `<suite>-run`, and the job named after the suite only reports how that ended. The result job of osac-ci
  # follows a suite by its deepest jobs, but a Netris suite is several jobs in a row (provision, push-secrets, e2e,
  # teardown) of which GitHub lists only those that have started, and provision and teardown sit deeper than the tests:
  # followed directly, the suite would count as passed after provisioning, before its tests. The job named after the
  # suite starts only once the whole suite has ended, and passes only when GitHub's own result of it is success.
  bmaas-netris-run:
    needs: plan
    if: contains(needs.plan.outputs.suites, '"bmaas-netris"')
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/e2e-bmaas-netris-full-install.yml
    with:
      deploy-suite: bmaas
      test-infra-repository: ${{ github.repository }}
      test-infra-ref: ${{ github.event.merge_group.head_sha }}
      test-infra-sha: ${{ github.event.merge_group.head_sha }}

  bmaas-netris:
    needs: [plan, bmaas-netris-run]
    if: always() && contains(needs.plan.outputs.suites, '"bmaas-netris"')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULT: ${{ needs['bmaas-netris-run'].result }}
        run: |
          echo "bmaas-netris ended: ${RESULT}"
          [ "${RESULT}" = success ]

  vmaas-netris-run:
    needs: plan
    if: contains(needs.plan.outputs.suites, '"vmaas-netris"')
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/e2e-vmaas-netris-full-install.yml
    with:
      deploy-suite: vmaas
      test-infra-repository: ${{ github.repository }}
      test-infra-ref: ${{ github.event.merge_group.head_sha }}
      test-infra-sha: ${{ github.event.merge_group.head_sha }}

  vmaas-netris:
    needs: [plan, vmaas-netris-run]
    if: always() && contains(needs.plan.outputs.suites, '"vmaas-netris"')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULT: ${{ needs['vmaas-netris-run'].result }}
        run: |
          echo "vmaas-netris ended: ${RESULT}"
          [ "${RESULT}" = success ]

  # One job that looks after the queue entry: it watches the suites and the other required checks of the commit (the
  # unit and integration tests of CI, the Jira check), writes the required E2E check at once when one of them fails, and
  # stops everything that still runs for the commit, so the entry leaves the queue instead of holding its place until
  # every suite has ended. It also writes E2E when everything passed. See osac-ci's docs/CALLERS.md.
  result:
    needs: plan
    if: always()
    uses: osac-project/osac-ci/.github/workflows/e2e-queue-result.yml@728d1b064cdbfa429c68ce5bc5a35b47b6c127d7  # v1.3.10
    permissions:
      actions: write
      contents: read
    with:
      sha: ${{ github.event.merge_group.head_sha }}
      branch: ${{ github.event.merge_group.base_ref }}
      plan-result: ${{ needs.plan.result }}
      suites: ${{ needs.plan.outputs.suites }}
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
