---
name: Build and test Assisted cluster flavor

on:
  workflow_call:
    inputs:
      test-suite:
        description: "Test suite under tests/e2e (default vmaas/sanity)"
        required: false
        type: string
        default: "vmaas/sanity"
      test-filter:
        description: "pytest -k filter expression (optional)"
        required: false
        type: string
        default: ""
      test-ref:
        description: "Branch or commit of osac-project/osac that supplies E2E tests"
        required: false
        type: string
        default: "main"
      namespace:
        description: "OSAC namespace on the cluster"
        required: false
        type: string
        default: "osac-e2e-ci"
      vm-template:
        description: "VM template for compute instances"
        required: false
        type: string
        default: "ocp-virt-vm"
      cluster-template:
        description: "Cluster template for CaaS tests"
        required: false
        type: string
        default: ""
      flavor-name:
        description: "Unique local cluster-tool flavor name for this run"
        required: true
        type: string
      cluster-topology:
        description: "Topology to create: sno or mno"
        required: false
        type: string
        default: "sno"
      openshift-version:
        description: "OpenShift version used for the source cluster"
        required: false
        type: string
        default: "4.22"
      runner-label:
        description: "Self-hosted runner label; use osac-ci-large for Assisted flavor builds"
        required: false
        type: string
        default: "osac-ci-large"
      installer-ref:
        description: "Branch/ref of osac-installer to clone for the deploy step"
        required: false
        type: string
        default: "main"
      installer-repo:
        description: "GitHub repo (owner/name) to clone osac-installer from"
        required: false
        type: string
        default: "osac-project/osac"
      test-infra-repository:
        description: "Repository to checkout for tests/Containerfile (for cross-repo calls)"
        required: false
        type: string
        default: ""
      test-infra-ref:
        description: "Git ref of test infrastructure repository"
        required: false
        type: string
        default: ""
      component-repo:
        description: "GitHub repo (owner/name) of a component to build from source. Requires component-ref and component-image-key."
        required: false
        type: string
        default: ""
      component-ref:
        description: "Branch or tag name of the component repository to build (must be a named ref, not a SHA)"
        required: false
        type: string
        default: ""
      component-image-key:
        description: "Helm value path for the component image (e.g. service.images.service)"
        required: false
        type: string
        default: ""
      component-containerfile:
        description: "Path to Containerfile (or execution-environment.yaml for ansible-builder) relative to component repo root"
        required: false
        type: string
        default: "Containerfile"
      component-build-type:
        description: "Build method: 'containerfile' (default) or 'ansible-builder'"
        required: false
        type: string
        default: "containerfile"
      osac-cli-version:
        description: "OSAC CLI version for the test image (e.g. 0.0.73). Defaults to latest GitHub release."
        required: false
        type: string
        default: ""
    outputs:
      result:
        description: "Test result: PASSED or FAILED"
        value: ${{ jobs.e2e.outputs.result }}

jobs:
  e2e:
    runs-on: ${{ inputs.runner-label }}
    environment: e2e-test
    permissions:
      contents: read
    outputs:
      result: ${{ steps.test.outcome == 'success' && 'PASSED' || 'FAILED' }}

    env:
      FLAVOR_LOCK: "/tmp/cluster-tool-flavor-${{ inputs.flavor-name }}.lock"

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ inputs.test-infra-repository || github.repository }}
          ref: ${{ inputs.test-infra-ref || '' }}
          persist-credentials: false

      - name: Overlay E2E tests from OSAC
        env:
          TEST_REF: ${{ inputs.test-ref }}
        run: |
          TEST_SOURCE="$RUNNER_TEMP/osac-test-source"
          git init "$TEST_SOURCE"
          git -C "$TEST_SOURCE" sparse-checkout init --cone
          git -C "$TEST_SOURCE" sparse-checkout set tests
          git -C "$TEST_SOURCE" fetch --depth 1 \
            https://github.com/osac-project/osac.git "$TEST_REF"
          git -C "$TEST_SOURCE" checkout FETCH_HEAD
          test -d "$TEST_SOURCE/tests/e2e/vmaas/sanity"
          TEST_SHA=$(git -C "$TEST_SOURCE" rev-parse HEAD)
          echo "E2E test source: $TEST_SHA"
          echo "OSAC_TEST_SHA=$TEST_SHA" >> "$GITHUB_ENV"
          rm -rf tests/
          cp -r "$TEST_SOURCE/tests" ./tests

      - name: Validate and bootstrap
        id: setup
        uses: ./.github/actions/validate-assisted-and-bootstrap
        with:
          test-suite: ${{ inputs.test-suite || 'e2e' }}
          run-id: ${{ github.run_id }}
          component-repo: ${{ inputs.component-repo }}
          component-ref: ${{ inputs.component-ref }}
          component-image-key: ${{ inputs.component-image-key }}

      - name: Check Assisted flavor runner helper
        env:
          CLUSTER_TOPOLOGY: ${{ inputs.cluster-topology }}
        run: |
          if ! podman info >/dev/null; then
            echo "::error::The runner user cannot use rootless Podman. Configure user namespaces before running this workflow."
            exit 1
          fi
          /usr/bin/pkexec --disable-internal-agent /usr/local/sbin/osac-privileged flavor check "${CLUSTER_TOPOLOGY}"
          bash scripts/check-assisted-disk-space.sh "${CLUSTER_TOPOLOGY}"

      - name: Stage local Assisted secrets
        uses: ./.github/actions/stage-local-assisted-secrets

      - name: Create Assisted Test Infra cluster and capture flavor
        env:
          CLUSTER_TOPOLOGY: ${{ inputs.cluster-topology }}
          OPENSHIFT_VERSION: ${{ inputs.openshift-version }}
          FLAVOR_NAME: ${{ inputs.flavor-name }}
          PULL_SECRET_FILE: ${{ runner.temp }}/pull-secret.json
        run: bash .github/scripts/create-assisted-cluster-flavor.sh

      - name: Prepare cluster environment
        env:
          FLAVOR_NAME: ${{ inputs.flavor-name }}
          CLUSTER_TOPOLOGY: ${{ inputs.cluster-topology }}
        run: |
          # The privileged helper owns cluster-tool state and the new local flavor.
          exec 9>"${FLAVOR_LOCK}"
          flock --exclusive 9
          echo "Acquired flavor lock."
          if ! /usr/bin/pkexec --disable-internal-agent /usr/local/sbin/osac-privileged cluster-tool flavors 9>&- \
              | awk -v flavor="${FLAVOR_NAME}" '$1 == flavor { found = 1 } END { exit !found }'; then
            echo "ERROR: Captured local flavor '${FLAVOR_NAME}' was not found." >&2
            exit 1
          fi
          echo "Using the local flavor '${FLAVOR_NAME}'."
          exec 9>&-
          echo "Released flavor lock."

          # --- Clean up stale clone resources ---
          # Remove stale compact DNS entries before destroying a previous MNO clone.
          if [[ "${CLUSTER_TOPOLOGY}" == "mno" ]]; then
            /usr/bin/pkexec --disable-internal-agent /usr/local/sbin/osac-privileged dns remove "${CLONE_NAME}" 2>/dev/null || true
          fi
          # Destroy any leftover clone from a previous run attempt, then
          # remove orphaned Linux bridges that survive virsh net-destroy
          # (e.g. from interrupted teardowns). Only targets bridges matching
          # this clone's truncated name — safe with concurrent jobs.
          /usr/bin/pkexec --disable-internal-agent /usr/local/sbin/osac-privileged cluster-tool destroy "${CLONE_NAME}" 2>/dev/null || true
          SNO_BRIDGE_PREFIX="br-${CLONE_NAME:0:8}"
          COMPACT_BRIDGE_PREFIX="br-$(printf '%s' "${CLONE_NAME}" | sha256sum | cut -c1-8)"
          while IFS= read -r bridge; do
            if [[ "${bridge}" == "${SNO_BRIDGE_PREFIX}"* || "${bridge}" == "${COMPACT_BRIDGE_PREFIX}"* ]]; then
              echo "Removing stale bridge ${bridge}..."
              /usr/bin/pkexec --disable-internal-agent /usr/local/sbin/osac-privileged bridge-down "${bridge}" 2>/dev/null || true
              /usr/bin/pkexec --disable-internal-agent /usr/local/sbin/osac-privileged bridge-delete "${bridge}" 2>/dev/null || true
            fi
          done < <(ip -o link show | awk -F': ' '{print $2}' | sed 's/@.*//')

      - name: Boot cluster clone
        id: boot
        env:
          FLAVOR_NAME: ${{ inputs.flavor-name }}
          CLUSTER_TOPOLOGY: ${{ inputs.cluster-topology }}
          PULL_SECRET_FILE: ${{ runner.temp }}/pull-secret.json
        run: |
          # Shared lock ensures no boot runs while a flavor pull is in progress.
          # Multiple boots can run in parallel (shared locks are compatible).
          # Use fd-based locking with `9>&-` on the child so an orphaned
          # privileged process doesn't keep the lock alive after cancellation.
          exec 9>"${FLAVOR_LOCK}"
          flock --shared 9
          if [[ "${CLUSTER_TOPOLOGY}" == "mno" ]]; then
            /usr/bin/pkexec --disable-internal-agent /usr/local/sbin/osac-privileged compact-boot \
              "${FLAVOR_NAME}" "${CLONE_NAME}" "${PULL_SECRET_FILE}" 9>&-
          else
            /usr/bin/pkexec --disable-internal-agent /usr/local/sbin/osac-privileged cluster-tool boot \
              "${FLAVOR_NAME}" "${CLONE_NAME}" "${PULL_SECRET_FILE}" 9>&-
          fi
          exec 9>&-

          echo "Cluster clone '${CLONE_NAME}' booted."

          # cluster-tool runs as root. Copy its kubeconfig to RUNNER_TEMP so
          # the runner user owns it and podman can relabel it for :Z mounts.
          /usr/bin/pkexec --disable-internal-agent /usr/local/sbin/osac-privileged kubeconfig "${CLUSTER_TOPOLOGY}" "${CLONE_NAME}" "${RUNNER_TEMP}"
          if [[ "${CLUSTER_TOPOLOGY}" == "mno" ]]; then
            /usr/bin/pkexec --disable-internal-agent /usr/local/sbin/osac-privileged dns add "${CLONE_NAME}"
          fi
          chmod 600 "$RUNNER_TEMP/kubeconfig"

      - name: Build and load component image
        if: inputs.component-repo != ''
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          COMPONENT_REPO: ${{ inputs.component-repo }}
          COMPONENT_REF: ${{ inputs.component-ref }}
          COMPONENT_FILE: ${{ inputs.component-containerfile }}
          COMPONENT_IMAGE_KEY: ${{ inputs.component-image-key }}
          COMPONENT_BUILD_TYPE: ${{ inputs.component-build-type }}
        run: |
          COMPONENT_TAG="localhost/component-pr:${GITHUB_RUN_ID}"

          echo "Cloning ${COMPONENT_REPO}@${COMPONENT_REF}..."
          git clone --depth 1 --branch "${COMPONENT_REF}" \
            "https://github.com/${COMPONENT_REPO}.git" "$RUNNER_TEMP/component-src"

          # --- Build component image ---
          SRC="$RUNNER_TEMP/component-src"
          if [[ "${COMPONENT_BUILD_TYPE}" == "ansible-builder" ]]; then
            echo "Generating build context with ansible-builder from ${COMPONENT_FILE}..."
            python3 -m pip install --quiet ansible-builder
            ansible-builder create --file "${SRC}/${COMPONENT_FILE}" --context "${SRC}/context"
            podman build -t "${COMPONENT_TAG}" -f "${SRC}/context/Containerfile" "${SRC}/context"
          else
            echo "Building image from ${COMPONENT_FILE}..."
            podman build -t "${COMPONENT_TAG}" -f "${SRC}/${COMPONENT_FILE}" "${SRC}"
          fi

          # Build OSAC CLI from source when the component is fulfillment-service
          if [[ "${COMPONENT_REPO}" == *"fulfillment-service"* ]]; then
            echo "Building osac CLI from source..."
            (cd "${SRC}" && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/osac-cli-bin" ./cmd/osac)
            echo "OSAC_CLI_BIN=$RUNNER_TEMP/osac-cli-bin" >> "$GITHUB_ENV"
          fi

          # Load image onto the cluster node so CRI-O can use it locally.
          # On RHCOS, root podman and CRI-O share /var/lib/containers/storage,
          # so 'podman load' via oc debug makes the image available to the kubelet.
          NODE_NAME=$(oc get nodes -o jsonpath='{.items[0].metadata.name}')

          echo "Loading image onto node ${NODE_NAME}..."
          podman save "${COMPONENT_TAG}" | \
            oc debug "node/${NODE_NAME}" -t=false -- \
              chroot /host podman load

          # Pass image tag and component metadata for teardown and downstream steps
          echo "COMPONENT_IMAGE=${COMPONENT_TAG}" >> "$GITHUB_ENV"
          echo "COMPONENT_REPO_NAME=${COMPONENT_REPO}" >> "$GITHUB_ENV"
          echo "COMPONENT_REF_NAME=${COMPONENT_REF}" >> "$GITHUB_ENV"

          rm -rf "$RUNNER_TEMP/component-src"

      - name: Build test image
        env:
          E2E_IMAGE: "osac-e2e-tests:${{ github.run_id }}"
          OSAC_VERSION: ${{ inputs.osac-cli-version }}
        run: |
          BUILD_ARGS="--build-arg OSAC_VERSION=${OSAC_VERSION}"
          if [[ -n "${OSAC_CLI_BIN:-}" ]] && [[ -f "${OSAC_CLI_BIN}" ]]; then
            cp "${OSAC_CLI_BIN}" ./osac-cli-bin
            BUILD_ARGS="--build-arg OSAC_CLI_BIN=osac-cli-bin"
          fi
          podman build --no-cache ${BUILD_ARGS} -t "${E2E_IMAGE}" -f Containerfile .
          rm -f ./osac-cli-bin

      - name: Check space for Assisted OSAC install
        env:
          CLUSTER_TOPOLOGY: ${{ inputs.cluster-topology }}
        run: |
          # A freshly booted clone can consume much more space during OSAC
          # installation and E2E tests; check again after boot.
          bash scripts/check-assisted-disk-space.sh "${CLUSTER_TOPOLOGY}"

      - name: Prepare cluster prerequisites
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          # Bare OpenShift needs these cluster settings before OSAC install.
          # Existing OSAC snapshot flavors normally already include them.

          # 1. Wait for CatalogSource to be READY (operators depend on it)
          echo "Waiting for CatalogSource redhat-operators to be READY..."
          oc wait --for=jsonpath='{.status.connectionState.lastObservedState}'=READY \
            catalogsource/redhat-operators -n openshift-marketplace --timeout=300s
          echo "CatalogSource is READY."

          # 2. Patch OVN masquerade subnet to avoid networking conflicts
          echo "Patching OVN masquerade subnet to 169.254.0.0/17..."
          oc patch networks.operator.openshift.io cluster --type=merge \
            -p '{"spec":{"defaultNetwork":{"ovnKubernetesConfig":{"gatewayConfig":{"ipv4":{"internalMasqueradeSubnet":"169.254.0.0/17"}}}}}}'
          oc delete pod -n openshift-network-operator -l name=network-operator
          echo "Waiting 180s for OVN to stabilize..."
          sleep 180
          oc rollout status ds/ovnkube-node -n openshift-ovn-kubernetes --timeout=300s
          echo "OVN rollout complete."

          # 3. Apply KubeletConfig to increase maxPods to 500
          echo "Applying KubeletConfig (maxPods: 500)..."
          cat <<'KUBELET_EOF' | oc apply -f -
          apiVersion: machineconfiguration.openshift.io/v1
          kind: KubeletConfig
          metadata:
            name: set-master-max-pods
          spec:
            machineConfigPoolSelector:
              matchLabels:
                pools.operator.machineconfiguration.openshift.io/master: ""
            kubeletConfig:
              maxPods: 500
          KUBELET_EOF
          echo "Waiting for MCP master to finish updating (node will reboot on SNO)..."
          oc wait --for=condition=Updated mcp/master --timeout=1800s
          echo "Waiting 180s for MCP to settle..."
          sleep 180
          # On SNO the node can reboot after the first MCP wait has already
          # returned. Do not start installing operators until the API and
          # node are healthy again and the updated config is active.
          echo "Waiting for the API to recover after the node reboot..."
          api_ready=false
          for attempt in $(seq 1 90); do
            if oc get --raw /readyz >/dev/null 2>&1; then
              api_ready=true
              break
            fi
            sleep 10
          done
          if [[ "${api_ready}" != true ]]; then
            echo "API did not recover after the KubeletConfig change." >&2
            exit 1
          fi
          oc wait --for=condition=Ready nodes --all --timeout=900s
          oc wait --for=condition=Updated mcp/master --timeout=1800s
          echo "Cluster prerequisites applied."

      - name: Reserve compact capacity for VMaaS
        if: inputs.cluster-topology == 'mno'
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: bash scripts/tune-assisted-compact-memory.sh

      - name: Install infrastructure operators
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          INSTALLER_REF: ${{ inputs.installer-ref }}
          INSTALLER_REPO: ${{ inputs.installer-repo }}
          TEST_REF: ${{ inputs.test-ref }}
        run: |
          TOOLS_BIN="${RUNNER_TEMP}/bin"
          mkdir -p "${TOOLS_BIN}"
          export PATH="${TOOLS_BIN}:${PATH}"
          echo "${TOOLS_BIN}" >> "${GITHUB_PATH}"
          if ! command -v helm >/dev/null; then
            bash scripts/install-runner-helm.sh
          fi
          command -v jq >/dev/null || { echo "jq is required on the runner" >&2; exit 1; }
          command -v yq >/dev/null || { echo "yq is required on the runner" >&2; exit 1; }
          [[ "${INSTALLER_REPO}" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || {
            echo "Invalid installer repository" >&2
            exit 2
          }
          if [[ "$INSTALLER_REPO" == osac-project/osac &&
                "$INSTALLER_REF" == "$TEST_REF" && -n "${OSAC_TEST_SHA:-}" ]]; then
            INSTALLER_REF="$OSAC_TEST_SHA"
          fi
          INSTALLER_CLONE="$RUNNER_TEMP/osac-installer-clone"
          git init "$INSTALLER_CLONE"
          git -C "$INSTALLER_CLONE" fetch --depth 1 \
            "https://github.com/${INSTALLER_REPO}.git" "$INSTALLER_REF"
          git -C "$INSTALLER_CLONE" checkout FETCH_HEAD
          echo "Installer source: $(git -C "$INSTALLER_CLONE" rev-parse HEAD)"
          if [[ -d "$INSTALLER_CLONE/osac-installer" ]]; then
            INSTALLER_DIR="$INSTALLER_CLONE/osac-installer"
          else
            INSTALLER_DIR="$INSTALLER_CLONE"
          fi
          echo "INSTALLER_DIR=$INSTALLER_DIR" >> "$GITHUB_ENV"
          cd "$INSTALLER_DIR"
          make install-infra PLATFORM=openshift PROFILE=vmaas-ci NS="${{ inputs.namespace }}"

      - name: Install grpcurl
        uses: ./.github/actions/install-grpcurl

      - name: Install OSAC
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          AAP_LICENSE_FILE: ${{ runner.temp }}/aap-license.zip
        run: |
          cd "$INSTALLER_DIR"
          make install-osac AAP_LICENSE_FILE="$AAP_LICENSE_FILE" \
            PLATFORM=openshift PROFILE=vmaas-ci NS="${{ inputs.namespace }}"
          for tenant in "${{ inputs.namespace }}" shared; do
            oc apply -f - <<EOF
          apiVersion: osac.openshift.io/v1alpha1
          kind: Tenant
          metadata:
            name: ${tenant}
            namespace: ${{ inputs.namespace }}
          spec: {}
          EOF
          done
          DOMAIN=$(oc get ingresses.config/cluster -o jsonpath='{.spec.domain}')
          GRPC_ADDR="fulfillment-api-${{ inputs.namespace }}.${DOMAIN}:443"
          GRPC_TOKEN=$(oc create token admin -n "${{ inputs.namespace }}" \
            --duration 10m --as system:admin)
          ready=false
          for attempt in $(seq 1 30); do
            if grpcurl -insecure -H "Authorization: Bearer ${GRPC_TOKEN}" \
                -format json "${GRPC_ADDR}" grpc.health.v1.Health/Check 2>/dev/null \
                | jq -e '.status == "SERVING"' >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]] || {
            echo "OSAC public gRPC endpoint did not become healthy" >&2
            exit 1
          }

      - name: Create test adapter route for metering
        id: metering-adapter
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          INSTALLER_NAMESPACE: ${{ inputs.namespace }}
        run: |
          SVC_NAME=$(oc get svc -n "$INSTALLER_NAMESPACE" \
            -l app.kubernetes.io/component=echo-adapter \
            -o jsonpath='{.items[0].metadata.name}')
          [[ -n "$SVC_NAME" ]] || {
            echo "No echo-adapter Service is deployed" >&2
            exit 1
          }
          oc expose "svc/$SVC_NAME" -n "$INSTALLER_NAMESPACE" \
            --name=metering-test-adapter --dry-run=client -o yaml | oc apply -f -
          ROUTE_HOST=$(oc get route metering-test-adapter -n "$INSTALLER_NAMESPACE" \
            -o jsonpath='{.spec.host}')
          [[ -n "$ROUTE_HOST" ]] || {
            echo "Metering test adapter route is unavailable" >&2
            exit 1
          }
          echo "url=http://$ROUTE_HOST" >> "$GITHUB_OUTPUT"

      - name: Pin compact test volumes to a suitable master
        if: inputs.cluster-topology == 'mno'
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          OSAC_NAMESPACE: ${{ inputs.namespace }}
        run: bash scripts/pin-assisted-compact-storage.sh

      - name: Run E2E tests
        id: test
        env:
          TEST_SUITE: ${{ inputs.test-suite }}
          TEST_FILTER: ${{ inputs.test-filter }}
          OSAC_NAMESPACE: ${{ inputs.namespace }}
          OSAC_VM_TEMPLATE: ${{ inputs.vm-template }}
          OSAC_CLUSTER_TEMPLATE: ${{ inputs.cluster-template }}
          CLUSTER_TOPOLOGY: ${{ inputs.cluster-topology }}
          METERING_ADAPTER_URL: ${{ steps.metering-adapter.outputs.url }}
          E2E_IMAGE: "osac-e2e-tests:${{ github.run_id }}"
        run: |
          KUBECONFIG_PATH="$RUNNER_TEMP/kubeconfig"

          TEST_ARGS="tests/e2e/"
          if [ -n "${TEST_SUITE}" ]; then
            [[ "${TEST_SUITE}" =~ ^[a-z0-9]+(/[a-z0-9-]+)*$ ]] || {
              echo "Invalid E2E test suite: ${TEST_SUITE}" >&2
              exit 2
            }
            TEST_ARGS="tests/e2e/${TEST_SUITE}/"
          fi

          FILTER_ARGS=()
          if [ -n "${TEST_FILTER}" ]; then
            FILTER_ARGS=(-k "${TEST_FILTER}")
          fi

          # Compact masters cannot reliably host multiple concurrent 8-GiB
          # test VMs after the OSAC stack is installed.
          PYTEST_WORKERS=4
          if [[ "${CLUSTER_TOPOLOGY}" == "mno" ]]; then
            PYTEST_WORKERS=1
          fi

          mkdir -p "$RUNNER_TEMP/test-output"

          podman run --rm --network=host \
            -v "${KUBECONFIG_PATH}":/root/.kube/config:ro,Z \
            -v "${RUNNER_TEMP}/pull-secret.json":/root/pull-secret:ro,Z \
            -v "${RUNNER_TEMP}/aap-license.zip":/root/aap-license.zip:ro,Z \
            -v "${RUNNER_TEMP}/test-output":/tmp/test-output:Z \
            -e KUBECONFIG=/root/.kube/config \
            -e OSAC_VM_KUBECONFIG=/root/.kube/config \
            -e OSAC_NAMESPACE="${OSAC_NAMESPACE}" \
            -e OSAC_VM_TEMPLATE="${OSAC_VM_TEMPLATE}" \
            -e OSAC_CLUSTER_TEMPLATE="${OSAC_CLUSTER_TEMPLATE}" \
            -e OSAC_PULL_SECRET_PATH=/root/pull-secret \
            -e METERING_ADAPTER_URL="${METERING_ADAPTER_URL}" \
            "${E2E_IMAGE}" \
            pytest "${TEST_ARGS}" "${FILTER_ARGS[@]}" -n "${PYTEST_WORKERS}" \
              --junitxml=/tmp/test-output/junit.xml -v

      - name: Recover Assisted kubeconfig after failed boot
        if: failure() && steps.boot.outcome == 'failure'
        env:
          CLONE_NAME: ${{ steps.setup.outputs.clone-name }}
          CLUSTER_TOPOLOGY: ${{ inputs.cluster-topology }}
        run: |
          # Compact boot may write a usable kubeconfig before its final
          # health gate fails. Stage it so artifact collection can still
          # inspect the clone before teardown.
          if /usr/bin/pkexec --disable-internal-agent /usr/local/sbin/osac-privileged kubeconfig \
              "${CLUSTER_TOPOLOGY}" "${CLONE_NAME}" "${RUNNER_TEMP}"; then
            if [[ "${CLUSTER_TOPOLOGY}" == "mno" ]]; then
              /usr/bin/pkexec --disable-internal-agent /usr/local/sbin/osac-privileged dns add \
                "${CLONE_NAME}" || true
            fi
          fi

      - name: Gather artifacts
        if: always()
        uses: ./.github/actions/gather-artifacts
        with:
          namespace: ${{ inputs.namespace }}
          kubeconfig-path: ${{ runner.temp }}/kubeconfig
          artifact-name: osac-logs-full-install-${{ github.run_id }}
          junit-path: ${{ runner.temp }}/test-output/junit.xml

      - name: Teardown
        if: always()
        env:
          CLONE_NAME: ${{ steps.setup.outputs.clone-name }}
          E2E_IMAGE: "osac-e2e-tests:${{ github.run_id }}"
          CLUSTER_TOPOLOGY: ${{ inputs.cluster-topology }}
          FLAVOR_NAME: ${{ inputs.flavor-name }}
          DELETE_LOCAL_FLAVOR: "false"
          # COMPONENT_IMAGE is set by the build step via GITHUB_ENV;
          # it will be empty if no component was built.
        run: bash .github/scripts/teardown-assisted.sh
