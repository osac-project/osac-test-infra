---
name: E2E BMaaS Full Install

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'OWNERS'
      - 'LICENSE'
      - '*.md'
      - 'docs/**'
  merge_group:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      test-suite:
        description: "Suite relative to tests/e2e (bmaas/sanity, bmaas/regression, bmaas/serial, or bmaas for all). Default: bmaas/sanity"
        required: false
        default: "bmaas/sanity"
      test-filter:
        description: "pytest -k filter (GHA always also excludes TestBmaasNetworking)"
        required: false
        default: ""
      test-marker:
        description: "pytest -m marker (optional). Empty uses directory tiers from test-suite."
        required: false
        default: ""
      installer-ref:
        description: "Branch/ref of the OSAC monorepo"
        required: false
        default: "main"
      installer-repo:
        description: "GitHub repo (owner/name) of the OSAC monorepo"
        required: false
        default: "osac-project/osac"
      image-overrides:
        description: "JSON mapping Helm value paths to image refs"
        required: false
        default: "{}"
      osac-cli-version:
        description: "OSAC CLI version (e.g. 0.0.73). Defaults to latest."
        required: false
        default: ""
      runner-label:
        description: "Self-hosted runner label to target (e.g. osac-ci-1 to pin to one machine for verification/debugging). Defaults to the shared fleet-wide label."
        required: false
        default: ""

concurrency:
  group: e2e-bmaas-full-install-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-readiness:
    name: e2e-readiness (bmaas)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/check-e2e-readiness
      - name: Check e2e readiness
        id: check
        uses: ./.github/actions/check-e2e-readiness
        with:
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}

  e2e-bmaas-dismiss-unlock-gates:
    if: >-
      github.event_name == 'pull_request'
      && needs.e2e-readiness.result == 'success'
      && needs.e2e-readiness.outputs.ready == 'true'
    needs: [e2e-readiness]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/complete-stale-e2e-gates
            .github/actions/invalidate-e2e-gates
      - name: Dismiss unlock orphan gate checks
        uses: ./.github/actions/complete-stale-e2e-gates
        with:
          head-sha: ${{ github.event.pull_request.head.sha }}
          gate-name: e2e-bmaas-gate
          after-native-success: false

  e2e-bmaas-full-install:
    needs: [e2e-readiness]
    if: >-
      always()
      && (github.event_name != 'pull_request'
          || needs.e2e-readiness.result == 'skipped'
          || needs.e2e-readiness.outputs.ready == 'true')
    permissions:
      contents: read
      # See e2e-vmaas-full-install-caller.yml's identical grant for why
      # this is needed.
      id-token: write
    uses: ./.github/workflows/e2e-bmaas-full-install.yml
    with:
      # Overlayed osac tests use directory tiers, not pytest markers.
      # PR/merge_group: bmaas/sanity. Schedule: bmaas/serial. Dispatch: honor input.
      test-suite: >-
        ${{
          inputs.test-suite != '' && inputs.test-suite ||
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'bmaas/sanity' ||
          github.event_name == 'schedule' && 'bmaas/serial' ||
          'bmaas/sanity'
        }}
      # Networking is Netris-lab only. Overlay of tests/e2e/bmaas would collect
      # it from regression/; deselect so GHA matches lifecycle+inventory.
      test-filter: ${{ inputs.test-filter && format('({0}) and not TestBmaasNetworking', inputs.test-filter) || 'not TestBmaasNetworking' }}
      test-marker: ${{ inputs.test-marker || '' }}
      installer-ref: ${{ inputs.installer-ref || 'main' }}
      installer-repo: ${{ inputs.installer-repo || 'osac-project/osac' }}
      image-overrides: ${{ inputs.image-overrides || '{}' }}
      osac-cli-version: ${{ inputs.osac-cli-version || '' }}
      runner-label: ${{ inputs.runner-label || 'osac-ci' }}
      fork-pr-author-association: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.author_association || '' }}
      fork-pr-author: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.user.login || '' }}
      pr-number: ${{ github.event.pull_request.number }}
      notify-on-failure: ${{ github.event_name == 'schedule' }}
      enable-ai-diagnostic: ${{ github.ref == 'refs/heads/main' }}

  e2e-bmaas-gate:
    if: >-
      always()
      && (github.event_name != 'pull_request'
          || needs.e2e-readiness.result != 'success'
          || needs.e2e-readiness.outputs.ready == 'true')
    needs: [e2e-readiness, e2e-bmaas-full-install]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "e2e-readiness: ${{ needs.e2e-readiness.result }}"
          echo "e2e-bmaas-full-install: ${{ needs.e2e-bmaas-full-install.result }}"
          exit 1
      - if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "e2e passed"

  e2e-bmaas-complete-stale-gates:
    if: >-
      always()
      && github.event_name == 'pull_request'
      && needs.e2e-readiness.result == 'success'
      && needs.e2e-readiness.outputs.ready == 'true'
      && !contains(needs.e2e-bmaas-gate.result, 'failure')
      && !contains(needs.e2e-bmaas-gate.result, 'cancelled')
    needs: [e2e-readiness, e2e-bmaas-full-install, e2e-bmaas-gate]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/complete-stale-e2e-gates
            .github/actions/invalidate-e2e-gates
      - name: Complete stale in_progress gate checks
        uses: ./.github/actions/complete-stale-e2e-gates
        with:
          head-sha: ${{ github.event.pull_request.head.sha }}
          gate-name: e2e-bmaas-gate

  # Latest check named e2e-bmaas-gate after the skipped gate job. Resolve this
  # workflow run's check_suite_id and attach the pending check so PR UI does not
  # group it under unrelated pull_request_target workflows. Forks may lack
  # checks:write; unreported check is still Expected/Waiting.
  e2e-bmaas-pending:
    if: >-
      always()
      && github.event_name == 'pull_request'
      && needs.e2e-readiness.result == 'success'
      && needs.e2e-readiness.outputs.ready != 'true'
    needs: [e2e-readiness, e2e-bmaas-full-install, e2e-bmaas-gate]
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Mark e2e-bmaas-gate pending
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          CHECK_NAME: e2e-bmaas-gate
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON: ${{ needs.e2e-readiness.outputs.reason }}
        run: |
          set -euo pipefail
          title="${REASON:-waiting for e2e unlock}"
          summary=$(printf '%s\n\n%s\n\n%s' "${title}" \
            "Need coderabbitai[bot] APPROVED on this HEAD, lgtm, or /e2e-ready." \
            "See .github/e2e-readiness.md")
          check_suite_id=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" \
            --jq '.check_suite_id // empty' 2>/dev/null || true)
          payload=$(jq -n \
            --arg name "${CHECK_NAME}" \
            --arg sha "${HEAD_SHA}" \
            --arg check_suite_id "${check_suite_id}" \
            --arg started "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg title "${title}" \
            --arg details "${DETAILS_URL}" \
            --arg summary "${summary}" \
            '{
              name: $name,
              head_sha: $sha,
              status: "in_progress",
              details_url: $details,
              started_at: $started,
              output: {
                title: $title,
                summary: $summary
              }
            }
            | if ($check_suite_id | length) > 0
              then . + {check_suite_id: ($check_suite_id | tonumber)}
              else .
              end')
          if ! gh api "repos/${REPO}/check-runs" --input - <<<"${payload}"; then
            echo "Could not post in_progress check ${CHECK_NAME} (fork PRs may lack checks:write)."
            echo "Required check stays unreported until unlock rerun."
          fi
