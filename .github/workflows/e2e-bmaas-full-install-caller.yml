---
name: E2E BMaaS Full Install

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      pr-number:
        description: "PR number (set by slash /test; used to read e2e-regression/e2e-serial labels)"
        required: false
        type: string
        default: ""
      test-suite:
        description: "Suite relative to tests/e2e (bmaas/sanity, bmaas/regression, bmaas/serial, or bmaas for all). Default: bmaas/sanity. PR e2e-regression/e2e-serial labels override."
        required: false
        default: "bmaas/sanity"
      test-filter:
        description: "pytest -k filter (GHA always also excludes TestBmaasNetworking)"
        required: false
        default: ""
      test-marker:
        description: "pytest -m marker (optional). Empty uses directory tiers from test-suite."
        required: false
        default: ""
      installer-ref:
        description: "Branch/ref of the OSAC monorepo"
        required: false
        default: "main"
      installer-repo:
        description: "GitHub repo (owner/name) of the OSAC monorepo"
        required: false
        default: "osac-project/osac"
      image-overrides:
        description: "JSON mapping Helm value paths to image refs"
        required: false
        default: "{}"
      osac-cli-version:
        description: "OSAC CLI version (e.g. 0.0.73). Defaults to latest."
        required: false
        default: ""
      runner-label:
        description: "Self-hosted runner label to target (e.g. osac-ci-1 to pin to one machine for verification/debugging). Defaults to the shared fleet-wide label."
        required: false
        default: ""

concurrency:
  group: e2e-bmaas-full-install-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # until concurrency cancelled it; the gate then treated cancelled as failure.
  resolve-suite:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      test-suite: ${{ steps.pick.outputs.test-suite }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/resolve-e2e-suite.sh
      - name: Resolve test-suite from input or PR labels
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr-number || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPLICIT_SUITE: ${{ inputs.test-suite || '' }}
        run: |
          set -euo pipefail
          # Unlabeled dispatch default: sanity (schedule uses expression path).
          suite=$(bash .github/scripts/resolve-e2e-suite.sh bmaas bmaas/sanity "${EXPLICIT_SUITE}")
          echo "test-suite=${suite}" >>"${GITHUB_OUTPUT}"
          echo "Resolved test-suite"

  e2e-bmaas-full-install:
    needs: [resolve-suite]
    if: >-
      always()
      && (needs.resolve-suite.result == 'success'
          || (needs.resolve-suite.result == 'skipped'
              && github.event_name != 'workflow_dispatch'))
    permissions:
      contents: read
      # See e2e-vmaas-full-install-caller.yml's identical grant for why
      # this is needed.
      id-token: write
    uses: ./.github/workflows/e2e-bmaas-full-install.yml
    with:
      test-suite: >-
        ${{
          needs.resolve-suite.outputs.test-suite ||
          github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e-serial') && 'bmaas/serial' ||
          github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e-regression') && 'bmaas/regression' ||
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'bmaas/sanity' ||
          github.event_name == 'schedule' && 'bmaas/serial' ||
          'bmaas/sanity'
        }}
      # Networking is Netris-lab only. Overlay of tests/e2e/bmaas would collect
      # it from regression/; deselect so GHA matches lifecycle+inventory.
      test-filter: ${{ inputs.test-filter && format('({0}) and not TestBmaasNetworking', inputs.test-filter) || 'not TestBmaasNetworking' }}
      test-marker: ${{ inputs.test-marker || '' }}
      installer-ref: ${{ inputs.installer-ref || 'main' }}
      installer-repo: ${{ inputs.installer-repo || 'osac-project/osac' }}
      image-overrides: ${{ inputs.image-overrides || '{}' }}
      components: >-
        ${{ format('[{{"repo":"osac-project/osac","ref":"{0}","containerfile":"fulfillment-service/Containerfile","imageKey":"service.images.service.repository","context":"."}}]',
        inputs.installer-ref || 'main') }}
      osac-cli-version: ${{ inputs.osac-cli-version || '' }}
      runner-label: ${{ inputs.runner-label || 'osac-ci' }}
      fork-pr-author-association: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.author_association || '' }}
      fork-pr-author: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.user.login || '' }}
      pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}
      notify-on-failure: ${{ github.event_name == 'schedule' }}
      enable-ai-diagnostic: ${{ github.ref == 'refs/heads/main' }}

  # checks:write; unreported check is still Expected/Waiting.
