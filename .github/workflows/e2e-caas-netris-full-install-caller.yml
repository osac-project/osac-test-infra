---
name: E2E CaaS Netris Full Install

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      instance-type:
        description: "EC2 instance type -- curated allow-list, not free text, so a dispatch (available to anyone with write access) can't accidentally launch an unexpectedly expensive type. Add to `options` deliberately."
        required: false
        type: choice
        options:
          - "c5n.metal"
        default: "c5n.metal"
      aws-region:
        description: "AWS region to launch into"
        required: false
        default: "us-east-1"
      tooling-check-cmds:
        description: "Semicolon-separated commands to verify on the box before JIT registration. Defaults to installing the CaaS/Netris flow's prerequisites, including tcpdump for failure packet capture."
        required: false
        default: "dnf install -y ansible-core python3-pip make podman tcpdump; /usr/bin/python3 -m pip install --ignore-installed ansible; command -v ansible-playbook; command -v make; command -v podman; command -v tcpdump"
      osac-operator-image:
        description: "Override osac-operator image -- empty builds from the selected OSAC revision"
        required: false
        default: ""
      fulfillment-service-image:
        description: "Override fulfillment-service image -- empty builds from the selected OSAC revision"
        required: false
        default: ""
      osac-aap-ee-image:
        description: "Override AAP bootstrap and execution-environment image -- empty builds from the selected OSAC revision"
        required: false
        default: ""
      osac-repo:
        description: "Override osac mono-repo git URI -- empty means upstream"
        required: false
        default: ""
      osac-branch:
        description: "Branch, tag, or commit of the OSAC mono-repo to deploy and test -- empty means main"
        required: false
        default: ""
      components:
        description: >-
          Optional source-build overrides by imageKey. Empty builds all four
          core CaaS/BMaaS components from osac-repo/osac-branch.
          Explicit overrides must be compatible with that revision's CRDs.
        required: false
        default: "[]"
      test-marker:
        description: "pytest -m marker expression; empty runs all CaaS tests (default: requires_caas_fabric)"
        required: false
        default: "requires_caas_fabric"
      test-filter:
        description: "Optional pytest -k filter expression"
        required: false
        default: ""
      debug-on-failure:
        description: "After a failure in the Netris E2E job, keep the lab available for 30 minutes after diagnostics before automatic teardown"
        required: false
        type: boolean
        default: false

concurrency:
  group: e2e-caas-netris-full-install-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  e2e-caas-netris:
    uses: ./.github/workflows/e2e-caas-netris-full-install.yml
    with:
      instance-type: ${{ inputs.instance-type || 'c5n.metal' }}
      aws-region: ${{ inputs.aws-region || 'us-east-1' }}
      tooling-check-cmds: ${{ inputs.tooling-check-cmds || 'dnf install -y ansible-core python3-pip make podman tcpdump; /usr/bin/python3 -m pip install --ignore-installed ansible; command -v ansible-playbook; command -v make; command -v podman; command -v tcpdump' }}
      osac-operator-image: ${{ inputs.osac-operator-image || '' }}
      fulfillment-service-image: ${{ inputs.fulfillment-service-image || '' }}
      osac-aap-ee-image: ${{ inputs.osac-aap-ee-image || '' }}
      osac-repo: ${{ inputs.osac-repo || '' }}
      osac-branch: ${{ inputs.osac-branch || '' }}
      components: ${{ inputs.components || '[]' }}
      test-marker: ${{ inputs.test-marker }}
      test-filter: ${{ inputs.test-filter }}
      debug-on-failure: ${{ inputs.debug-on-failure }}
