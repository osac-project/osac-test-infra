name: E2E Full Netris Full Install
run-name: "E2E Full Netris Full Install"

permissions:
  contents: read
  pull-requests: read

on:
  workflow_dispatch:
    inputs:
      osac-repo:
        description: "Override osac mono-repo git URI -- empty means upstream"
        required: false
        default: ""
      osac-branch:
        description: "Branch, tag, or commit of the osac mono-repo -- empty means main"
        required: false
        default: ""
      test-infra-ref:
        description: "Test-infra branch or ref to run -- defaults to the selected workflow ref"
        required: false
        default: ""
      instance-type:
        description: "EC2 instance type"
        required: false
        type: choice
        options:
          - "c5n.metal"
        default: "c5n.metal"
      aws-region:
        description: "AWS region to launch into"
        required: false
        default: "us-east-1"

concurrency:
  group: e2e-full-netris-full-install-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  full:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/e2e-bmaas-netris-full-install.yml
    with:
      suite: full
      osac-profile: full-ci
      osac-repo: ${{ inputs.osac-repo || '' }}
      osac-branch: ${{ inputs.osac-branch || '' }}
      instance-type: ${{ inputs.instance-type || 'c5n.metal' }}
      aws-region: ${{ inputs.aws-region || 'us-east-1' }}
      test-infra-repository: ${{ github.repository }}
      test-infra-ref: ${{ inputs.test-infra-ref || github.ref }}
