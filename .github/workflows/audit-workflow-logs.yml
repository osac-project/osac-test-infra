---
name: Audit workflow logs

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      lookback:
        description: "Lookback window for completed e2e runs (start-time based). Unit required: 27h, 1d, 30d, 90d (not a bare integer — that was hours in the old lookback-hours input). Max 90d. Default 27h gives 3h overlap on a 24h schedule."
        required: false
        type: string
        default: "27h"
      target-repo:
        description: "Repo to audit. 'all' covers every hardcoded known caller (same as the daily schedule)."
        required: false
        type: choice
        default: all
        # Must stay in sync with KNOWN_TARGET_REPOS in
        # .github/scripts/discover-audit-runs.sh (both lists change together).
        options:
          - all
          - osac-project/osac-test-infra
          - osac-project/osac

concurrency:
  group: audit-workflow-logs
  cancel-in-progress: false

# Deny-by-default at the workflow level, so a future job added to this file
# without its own explicit `permissions:` block gets nothing rather than a
# broad implicit GITHUB_TOKEN scope -- the job below already sets its own
# least-privilege block regardless, this is just the safety net for later.
permissions: {}

jobs:
  # ─── Phase 1: Discover ─────────────────────────────────────────────────────
  # Lists runs to audit and chunks them into matrix batches for parallel
  # scanning. Split from the scan loop so that a large run count (common
  # after the osac monorepo migration) no longer serializes into a single
  # 2h+ job that times out.
  discover:
    name: Discover runs to audit
    # workflow_dispatch lets anyone with write access pick *any* branch to
    # run this job against, executing that branch's own copy of this file
    # with this job's full Vault/GH_ORG_TOKEN access -- a same-file `if:`
    # guard can't close that gap, since an attacker dispatching against
    # their own branch controls that exact file and would just remove the
    # guard in their copy. Restricting the "audit-privileged" environment's
    # deployment branches to `main` (Settings -> Environments, org-admin
    # action -- see PR #182's follow-up item) is enforced server-side
    # regardless of the dispatched branch's file content, so it's a real
    # boundary rather than a cosmetic one. schedule: always runs off the
    # default branch already; this only actually changes workflow_dispatch.
    environment: audit-privileged
    # Still on osac-ci: audit needs Vault (GH_ORG_TOKEN + Slack path) at
    # 127.0.0.1. Per-run scan-workflow-logs.yml already moved to ubuntu-latest
    # + Docker; this job stays until audit secrets move off runner-local Vault.
    runs-on: osac-ci
    timeout-minutes: 10
    permissions:
      # Only needed to check out the shared scripts (scan-run-logs.sh,
      # discover-audit-runs.sh) this job invokes -- this job never pushes
      # back to the repo.
      contents: read  # checkout only, no push
    outputs:
      matrix: ${{ steps.chunk.outputs.matrix }}
      has-runs: ${{ steps.chunk.outputs.has-runs }}
      skipped-targets: ${{ steps.list.outputs.skipped-targets }}
      no-targets: ${{ steps.list.outputs.no-targets }}
      runs-truncated: ${{ steps.list.outputs.runs-truncated }}
      lookback-raw: ${{ steps.list.outputs.lookback-raw }}
      lookback-hours: ${{ steps.list.outputs.lookback-hours }}
      target-repo: ${{ steps.list.outputs.target-repo }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # --- Secret bootstrap (inline — must not run PR-controlled code) ---
      - name: Read AppRole credentials
        id: approle
        run: |
          APPROLE_DIR="${HOME}/.vault-server/.approle"
          echo "role-id=$(cat "${APPROLE_DIR}/role-id")" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$(cat "${APPROLE_DIR}/secret-id")"
          echo "secret-id=$(cat "${APPROLE_DIR}/secret-id")" >> "$GITHUB_OUTPUT"

      - name: Retrieve secrets from Vault
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: http://127.0.0.1:8200
          method: approle
          roleId: ${{ steps.approle.outputs.role-id }}
          secretId: ${{ steps.approle.outputs.secret-id }}
          exportEnv: false
          secrets: |
            secret/data/osac/e2e/audit-log-cleaner-pat token | GH_ORG_TOKEN

      - name: List recent e2e runs
        id: list
        env:
          GH_TOKEN: ${{ steps.vault.outputs.GH_ORG_TOKEN }}
          # schedule: inputs are empty → 27h / all. workflow_dispatch uses the form values.
          LOOKBACK: ${{ inputs.lookback || '27h' }}
          TARGET_REPO: ${{ inputs.target-repo || 'all' }}
        run: |
          OUTPUT_DIR="${RUNNER_TEMP}/discover"
          .github/scripts/discover-audit-runs.sh "${LOOKBACK}" "${OUTPUT_DIR}" "${TARGET_REPO}"
          # shellcheck disable=SC1091
          source "${OUTPUT_DIR}/status.env"

          echo "runs=$(cat "${OUTPUT_DIR}/runs.json")" >> "$GITHUB_OUTPUT"
          # Listing failures mean we never even knew about some runs, so they
          # can never show up as scan failures below -- tracked separately so
          # a partial audit still can't quietly report as a clean pass.
          echo "skipped-targets=${SKIPPED_TARGETS}" >> "$GITHUB_OUTPUT"
          # Zero resolved targets must not look like a clean "no leaks" pass
          # (empty runs.json + successful scan step).
          echo "no-targets=${NO_TARGETS}" >> "$GITHUB_OUTPUT"
          echo "runs-truncated=${RUNS_TRUNCATED:-false}" >> "$GITHUB_OUTPUT"
          echo "lookback-raw=${LOOKBACK_RAW}" >> "$GITHUB_OUTPUT"
          echo "lookback-hours=${LOOKBACK_HOURS}" >> "$GITHUB_OUTPUT"
          echo "target-repo=${TARGET_REPO}" >> "$GITHUB_OUTPUT"

      - name: Chunk runs into matrix batches
        id: chunk
        env:
          RUNS: ${{ steps.list.outputs.runs }}
        run: |
          # Split the flat run list into chunks of N so the scan phase can
          # process them in parallel matrix legs. Each chunk is a JSON string
          # (stringified array of {run_id, repo} objects) that the matrix leg
          # parses back into its RUNS env var.
          CHUNK_SIZE=20
          TOTAL=$(echo "${RUNS}" | jq 'length')

          if [[ "${TOTAL}" -eq 0 ]]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "has-runs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MATRIX=$(echo "${RUNS}" | jq -c --argjson size "${CHUNK_SIZE}" '
            . as $all |
            [ range(0; length; $size) | . as $start |
              { chunk_index: ($start / $size | floor),
                runs: ($all[$start:$start+$size] | tostring) }
            ] | {include: .}
          ')

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "has-runs=true" >> "$GITHUB_OUTPUT"
          echo "Generated $(echo "${MATRIX}" | jq '.include | length') matrix chunk(s) for ${TOTAL} run(s)."

  # ─── Phase 2: Scan (parallel matrix) ───────────────────────────────────────
  # Each matrix leg scans a subset of runs. The scan logic is identical to
  # the original monolithic "Scan each run's logs" step — only the input
  # RUNS array is smaller (one chunk instead of all discovered runs).
  scan:
    name: "Scan chunk ${{ matrix.chunk_index }}"
    needs: discover
    if: needs.discover.outputs.has-runs == 'true'
    environment: audit-privileged
    runs-on: osac-ci
    timeout-minutes: 45
    permissions:
      contents: read  # checkout only, no push
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # --- Secret bootstrap (inline — must not run PR-controlled code) ---
      - name: Read AppRole credentials
        id: approle
        run: |
          APPROLE_DIR="${HOME}/.vault-server/.approle"
          echo "role-id=$(cat "${APPROLE_DIR}/role-id")" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$(cat "${APPROLE_DIR}/secret-id")"
          echo "secret-id=$(cat "${APPROLE_DIR}/secret-id")" >> "$GITHUB_OUTPUT"

      - name: Retrieve secrets from Vault
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: http://127.0.0.1:8200
          method: approle
          roleId: ${{ steps.approle.outputs.role-id }}
          secretId: ${{ steps.approle.outputs.secret-id }}
          exportEnv: false
          secrets: |
            secret/data/osac/e2e/audit-log-cleaner-pat token | GH_ORG_TOKEN

      - name: Scan each run's logs
        id: scan
        env:
          GH_TOKEN: ${{ steps.vault.outputs.GH_ORG_TOKEN }}
          RUNS: ${{ matrix.runs }}
        run: |
          AUDIT_DIR="${RUNNER_TEMP}/audit"
          ALL_REDACTED_DIR="${RUNNER_TEMP}/all-redacted"
          SUMMARY_JSONL="${AUDIT_DIR}/summary.jsonl"
          mkdir -p "${AUDIT_DIR}" "${ALL_REDACTED_DIR}"
          : > "${SUMMARY_JSONL}"
          FLAGGED=0
          SKIPPED_SCANS=0
          PURGE_FAILURES=0
          PROCESSING_FAILURES=0

          # A single run's processing (scan-run-logs.sh itself, or the
          # cp/jq calls below) must not be able to abort this whole step --
          # under this run: block's default set -e, an unguarded failure on
          # run N would skip every run after it *and* lose the
          # flagged-count/etc. outputs entirely, silently dropping any
          # leaks already found on runs 1..N-1 from ever being reported.
          # Calling this via `if ! process_one_run; then` (not a plain call)
          # is what actually suspends errexit for the whole function body,
          # not just the final status check -- every command inside runs to
          # completion regardless of an earlier one failing, so each step
          # can be individually checked instead of the function dying
          # partway through. FLAGGED/SKIPPED_SCANS/etc. are deliberately
          # not `local` so updates here are visible after the loop.
          process_one_run() {
            local run_id="$1" repo="$2" output_dir="$3" slug="$4"
            # Do not bail before sourcing status.env -- the script's EXIT trap
            # can still record LEAKS_FOUND after a mid-run abort (e.g. after
            # an artifact was already purged). Dropping that would hide a
            # confirmed incident.
            if ! .github/scripts/scan-run-logs.sh "${run_id}" "${output_dir}" "${repo}"; then
              echo "::warning::scan-run-logs.sh exited non-zero for run ${run_id} (${repo}) -- checking status.env for any findings recorded before abort."
            fi
            if [[ ! -f "${output_dir}/status.env" ]]; then
              echo "::warning::status.env missing after scan-run-logs.sh for run ${run_id} (${repo})"
              SKIPPED_SCANS=$((SKIPPED_SCANS + 1))
              return 0
            fi
            # shellcheck disable=SC1091
            source "${output_dir}/status.env"

            # Partial scans (SCAN_OK=false) can still find real leaks
            # (e.g. log hit + oversize artifact skip). Always surface
            # LEAKS_FOUND; also count the run as skipped so the audit
            # cannot look fully clean.
            if [[ "${SCAN_OK}" != "true" ]]; then
              SKIPPED_SCANS=$((SKIPPED_SCANS + 1))
            fi
            if [[ "${LEAKS_FOUND}" != "true" ]]; then
              return 0
            fi

            FLAGGED=$((FLAGGED + 1))
            # A purge failure here means the exposure window for this run
            # is still open on GitHub -- tracked separately from
            # SKIPPED_SCANS (which means "never fully checked") since this
            # run *did* find something, it just couldn't close the loop.
            [[ "${PURGE_OK}" != "true" ]] && PURGE_FAILURES=$((PURGE_FAILURES + 1))
            # cp and jq are independent of each other -- the redacted-copy
            # artifact vs. the tracking-issue summary entry -- so a failed
            # cp must not skip the jq attempt too; only count this run once
            # under PROCESSING_FAILURES even if both happen to fail.
            local run_processing_failed=0
            mkdir -p "${ALL_REDACTED_DIR}/${slug}"
            if [[ -d "${output_dir}/redacted" ]]; then
              if ! cp -r "${output_dir}/redacted/." "${ALL_REDACTED_DIR}/${slug}/"; then
                echo "::warning::Failed to copy redacted logs/artifacts for run ${run_id} (${repo}) into the combined artifact -- leak was still detected and counted."
                run_processing_failed=1
              fi
            else
              echo "::warning::No redacted/ dir for flagged run ${run_id} (${repo}) -- leak was still detected and counted."
              run_processing_failed=1
            fi
            if ! jq -c --arg run_id "${run_id}" --arg repo "${repo}" --arg count "${FINDINGS_COUNT}" --argjson purge_ok "${PURGE_OK}" \
              '{run_id: $run_id, repo: $repo, findings_count: ($count | tonumber), purge_ok: $purge_ok, findings: [.[] | {rule: .RuleID, file: .File, line: .StartLine}]}' \
              "${output_dir}/findings.json" >> "${SUMMARY_JSONL}"; then
              echo "::warning::Failed to append findings for run ${run_id} (${repo}) to the summary -- leak was still detected and counted."
              run_processing_failed=1
            fi
            [[ "${run_processing_failed}" -eq 1 ]] && PROCESSING_FAILURES=$((PROCESSING_FAILURES + 1))
            # Explicit, unconditional return: without this, the function's
            # exit status is whatever the `[[ ... ]] && ...` line above
            # evaluated to, which is 1 (false) on the common/successful path
            # (run_processing_failed=0). Called as a bare statement below
            # under this step's default `set -e`, that would abort the
            # entire loop after the very first cleanly-processed flagged run
            # -- silently skipping every remaining run.
            return 0
          }

          # Validate + materialize RUNS *before* the loop. Feeding
          # `jq -c '.[]'` via process substitution hides parse/schema
          # failures (jq exits non-zero in the process-sub shell while
          # this shell sees an empty stream and happily "audits" zero
          # runs). Fail the step outright on a bad payload instead.
          # Validate separately from materialize: `jq -e` + `.[]` would
          # also reject a legitimate empty array (no output => -e fails).
          VALIDATED_RUNS="${AUDIT_DIR}/runs.validated.jsonl"
          if ! echo "${RUNS}" | jq -e '
            (type == "array")
            and all(
              (type == "object")
              and ((.run_id | type == "string") or (.run_id | type == "number"))
              and ((.run_id | tostring | length) > 0)
              and (.repo | type == "string")
              and (.repo | length > 0)
            )
          ' >/dev/null; then
            echo "::error::Invalid RUNS input -- refusing to audit with an unverified run list"
            exit 1
          fi
          echo "${RUNS}" | jq -c '.[] | {run_id: (.run_id | tostring), repo, event}' > "${VALIDATED_RUNS}"

          # Reading a file (not a trailing pipe) so the loop runs in this
          # shell, not a subshell -- otherwise FLAGGED/SKIPPED_SCANS
          # wouldn't survive past the loop.
          while IFS= read -r ITEM; do
            RUN_ID=$(echo "${ITEM}" | jq -r '.run_id')
            REPO=$(echo "${ITEM}" | jq -r '.repo')
            RUN_EVENT=$(echo "${ITEM}" | jq -r '.event // ""')
            SKIP_PURGE=$( [[ "${RUN_EVENT}" != "pull_request" && "${RUN_EVENT}" != "merge_group" ]] && echo true || echo false )
            export SKIP_PURGE
            SLUG="${REPO//\//_}-${RUN_ID}"
            echo "::group::Auditing run ${RUN_ID} (${REPO}) [event=${RUN_EVENT}, skip_purge=${SKIP_PURGE}]"
            OUTPUT_DIR="${AUDIT_DIR}/${SLUG}"
            # `if ! process_one_run ...; then` (not a bare call), matching
            # this skill's own documented pattern for calling a function
            # whose body relies on suspended errexit: belt-and-suspenders
            # alongside the function's own explicit `return 0` above, so a
            # future edit that reintroduces a bad last-statement inside the
            # function still can't abort the whole loop from here.
            if ! process_one_run "${RUN_ID}" "${REPO}" "${OUTPUT_DIR}" "${SLUG}"; then
              echo "::warning::process_one_run returned non-zero unexpectedly for run ${RUN_ID} (${REPO})"
            fi
            echo "::endgroup::"
          done < "${VALIDATED_RUNS}"

          echo "flagged-count=${FLAGGED}" >> "$GITHUB_OUTPUT"
          echo "skipped-scans=${SKIPPED_SCANS}" >> "$GITHUB_OUTPUT"
          echo "processing-failures=${PROCESSING_FAILURES}" >> "$GITHUB_OUTPUT"
          echo "purge-failures=${PURGE_FAILURES}" >> "$GITHUB_OUTPUT"
          echo "SUMMARY_JSONL=${SUMMARY_JSONL}" >> "$GITHUB_ENV"
          echo "ALL_REDACTED_DIR=${ALL_REDACTED_DIR}" >> "$GITHUB_ENV"

          # Persist counters for the report job to aggregate across chunks.
          COUNTERS_FILE="${AUDIT_DIR}/counters.json"
          jq -n --argjson f "${FLAGGED}" --argjson s "${SKIPPED_SCANS}" \
            --argjson pf "${PURGE_FAILURES}" --argjson proc "${PROCESSING_FAILURES}" \
            '{flagged: $f, skipped_scans: $s, purge_failures: $pf, processing_failures: $proc}' \
            > "${COUNTERS_FILE}"
          echo "COUNTERS_FILE=${COUNTERS_FILE}" >> "$GITHUB_ENV"

      - name: Upload chunk redacted logs
        if: steps.scan.outputs.flagged-count != '' && steps.scan.outputs.flagged-count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-redacted-chunk-${{ matrix.chunk_index }}-${{ github.run_id }}
          path: ${{ env.ALL_REDACTED_DIR }}
          retention-days: 30
          if-no-files-found: ignore

      - name: Rename chunk summary for merge-safe download
        if: always()
        id: rename-summary
        run: |
          # merge-multiple flattens all artifacts into one dir; avoid
          # filename collisions across chunks by giving each a unique name.
          UPLOAD_DIR="${RUNNER_TEMP}/chunk-upload"
          mkdir -p "${UPLOAD_DIR}"
          if [[ -f "${SUMMARY_JSONL}" ]]; then
            cp "${SUMMARY_JSONL}" "${UPLOAD_DIR}/summary-chunk-${{ matrix.chunk_index }}.jsonl"
          fi
          if [[ -f "${COUNTERS_FILE}" ]]; then
            cp "${COUNTERS_FILE}" "${UPLOAD_DIR}/counters-chunk-${{ matrix.chunk_index }}.json"
          fi
          echo "path=${UPLOAD_DIR}" >> "$GITHUB_OUTPUT"

      - name: Upload chunk summary
        if: always() && steps.rename-summary.outputs.path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-summary-chunk-${{ matrix.chunk_index }}-${{ github.run_id }}
          path: ${{ steps.rename-summary.outputs.path }}
          retention-days: 7
          if-no-files-found: ignore

  # ─── Phase 3: Report ───────────────────────────────────────────────────────
  # Aggregates results from all scan matrix legs, writes the job summary,
  # files/updates the tracking issue, and notifies Slack. Runs even when
  # some scan legs fail (always() + explicit outcome checks).
  report:
    name: Aggregate and report
    needs: [discover, scan]
    # !cancelled(): must run even when scan legs fail -- that's exactly when
    # reporting matters most (partial results, skipped scans, etc.) -- but a
    # manual cancel is not an audit finding worth paging on.
    if: ${{ !cancelled() }}
    environment: audit-privileged
    runs-on: osac-ci
    timeout-minutes: 10
    permissions:
      contents: read  # checkout only, no push
      # The tracking issue lives in this repo, so issues:write is enough at
      # the job-permissions level for that part. Cross-repo run listing and
      # log fetch/delete use the Actions-scoped audit PAT from Vault instead
      # (see scan job above), not this job's own token.
      issues: write  # create/update the credential-leak tracking issue
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # --- Secret bootstrap (inline — must not run PR-controlled code) ---
      - name: Read AppRole credentials
        id: approle
        run: |
          APPROLE_DIR="${HOME}/.vault-server/.approle"
          echo "role-id=$(cat "${APPROLE_DIR}/role-id")" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$(cat "${APPROLE_DIR}/secret-id")"
          echo "secret-id=$(cat "${APPROLE_DIR}/secret-id")" >> "$GITHUB_OUTPUT"

      - name: Retrieve secrets from Vault
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: http://127.0.0.1:8200
          method: approle
          roleId: ${{ steps.approle.outputs.role-id }}
          secretId: ${{ steps.approle.outputs.secret-id }}
          exportEnv: false
          secrets: |
            secret/data/osac/e2e/slack-webhook-url url | SLACK_WEBHOOK_URL

      - name: Download all chunk summaries
        id: download-summaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: audit-summary-chunk-*-${{ github.run_id }}
          path: ${{ runner.temp }}/summaries
          merge-multiple: true
        continue-on-error: true

      - name: Download all chunk redacted logs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: audit-redacted-chunk-*-${{ github.run_id }}
          path: ${{ runner.temp }}/all-redacted
          merge-multiple: true
        continue-on-error: true

      - name: Aggregate scan results
        id: aggregate
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          DOWNLOAD_SUMMARIES_OUTCOME: ${{ steps.download-summaries.outcome }}
          MATRIX_JSON: ${{ needs.discover.outputs.matrix }}
          HAS_RUNS: ${{ needs.discover.outputs.has-runs }}
        run: |
          SUMMARY_DIR="${RUNNER_TEMP}/summaries"
          MERGED="${RUNNER_TEMP}/merged-summary.jsonl"
          : > "${MERGED}"

          if [[ -d "${SUMMARY_DIR}" ]]; then
            find "${SUMMARY_DIR}" -name 'summary*.jsonl' -exec cat {} + >> "${MERGED}" 2>/dev/null || true
          fi

          # Sum per-chunk counters (authoritative) rather than inferring
          # from JSONL line count (which misses runs where jq append failed).
          FLAGGED_COUNT=0
          SKIPPED_SCANS=0
          PURGE_FAILURES=0
          PROCESSING_FAILURES=0
          if [[ -d "${SUMMARY_DIR}" ]]; then
            while IFS= read -r cfile; do
              if ! VALUES=$(jq -r '[(.flagged // 0), (.skipped_scans // 0), (.purge_failures // 0), (.processing_failures // 0)] | @tsv' "${cfile}"); then
                echo "::warning::Unreadable counters file ${cfile} -- counting the chunk as unscanned."
                SKIPPED_SCANS=$((SKIPPED_SCANS + 1))
                continue
              fi
              read -r C_FLAGGED C_SKIPPED C_PURGE C_PROC <<< "${VALUES}"
              FLAGGED_COUNT=$((FLAGGED_COUNT + C_FLAGGED))
              SKIPPED_SCANS=$((SKIPPED_SCANS + C_SKIPPED))
              PURGE_FAILURES=$((PURGE_FAILURES + C_PURGE))
              PROCESSING_FAILURES=$((PROCESSING_FAILURES + C_PROC))
            done < <(find "${SUMMARY_DIR}" -name 'counters-chunk-*.json' 2>/dev/null)
          fi

          # Fail closed: if scan succeeded but summary download failed, we
          # cannot verify whether leaks were found -- mark as incomplete so
          # the audit cannot look clean when it isn't.
          if [[ "${SCAN_RESULT}" == "success" && "${DOWNLOAD_SUMMARIES_OUTCOME}" != "success" ]]; then
            echo "::warning::Chunk summary download failed after successful scan -- cannot verify results, marking incomplete."
            SKIPPED_SCANS=$((SKIPPED_SCANS + 1))
          fi

          # Detect missing chunk counters: if discover produced N chunks but
          # we only found fewer counter files, the missing chunks were never
          # aggregated (upload failure, leg timeout before counters written).
          if [[ "${HAS_RUNS}" == "true" && -n "${MATRIX_JSON}" ]]; then
            EXPECTED_CHUNKS=$(echo "${MATRIX_JSON}" | jq '.include | length')
            FOUND_CHUNKS=$(find "${SUMMARY_DIR}" -name 'counters-chunk-*.json' 2>/dev/null | wc -l)
            if (( FOUND_CHUNKS < EXPECTED_CHUNKS )); then
              MISSING=$((EXPECTED_CHUNKS - FOUND_CHUNKS))
              echo "::warning::${MISSING} chunk counter file(s) missing -- counting those chunks as unscanned."
              SKIPPED_SCANS=$((SKIPPED_SCANS + MISSING))
            fi
          fi

          # If the scan matrix itself failed (not just individual runs),
          # mark as incomplete so the summary can't look clean.
          if [[ "${SCAN_RESULT}" != "success" && "${SCAN_RESULT}" != "skipped" ]]; then
            SKIPPED_SCANS=$((SKIPPED_SCANS + 1))
          fi

          echo "flagged-count=${FLAGGED_COUNT}" >> "$GITHUB_OUTPUT"
          echo "skipped-scans=${SKIPPED_SCANS}" >> "$GITHUB_OUTPUT"
          echo "purge-failures=${PURGE_FAILURES}" >> "$GITHUB_OUTPUT"
          echo "processing-failures=${PROCESSING_FAILURES}" >> "$GITHUB_OUTPUT"
          echo "SUMMARY_JSONL=${MERGED}" >> "$GITHUB_ENV"
          echo "ALL_REDACTED_DIR=${RUNNER_TEMP}/all-redacted" >> "$GITHUB_ENV"

      - name: Upload combined redacted logs
        id: upload-redacted
        if: steps.aggregate.outputs.flagged-count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-redacted-logs-${{ github.run_id }}
          path: ${{ env.ALL_REDACTED_DIR }}
          retention-days: 30

      - name: Write job summary
        if: always()
        id: summary
        env:
          # Not '|| success/failure' fallback -- needs.scan.result always
          # resolves to one of success/failure/cancelled/skipped by the time
          # this step (always()) runs.
          SCAN_OUTCOME: ${{ needs.scan.result }}
          DISCOVER_OUTCOME: ${{ needs.discover.result }}
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
          FLAGGED_COUNT: ${{ steps.aggregate.outputs.flagged-count || '0' }}
          # GitHub Actions expressions have no arithmetic operators, so the
          # two skip counters are added in bash below, not here.
          SKIPPED_TARGETS: ${{ needs.discover.outputs.skipped-targets || '0' }}
          SKIPPED_SCANS: ${{ steps.aggregate.outputs.skipped-scans || '0' }}
          PURGE_FAILURES: ${{ steps.aggregate.outputs.purge-failures || '0' }}
          PROCESSING_FAILURES: ${{ steps.aggregate.outputs.processing-failures || '0' }}
          NO_TARGETS: ${{ needs.discover.outputs.no-targets || 'false' }}
          RUNS_TRUNCATED: ${{ needs.discover.outputs.runs-truncated || 'false' }}
          # Fall back to the dispatch inputs (empty on schedule => 27h/all) so a
          # failed list step can't misreport the requested window/scope.
          # LOOKBACK_HOURS stays empty when never computed -- don't invent 27.
          LOOKBACK_RAW: ${{ needs.discover.outputs.lookback-raw || inputs.lookback || '27h' }}
          LOOKBACK_HOURS: ${{ needs.discover.outputs.lookback-hours || '' }}
          TARGET_REPO: ${{ needs.discover.outputs.target-repo || inputs.target-repo || 'all' }}
          # 'skipped' (not just 'failure') when flagged-count is '0' -- the
          # upload step's own `if:` never runs it in that case. Only
          # meaningful when FLAGGED_COUNT != '0' below.
          UPLOAD_OUTCOME: ${{ steps.upload-redacted.outcome || 'skipped' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SKIPPED_TOTAL=$((SKIPPED_TARGETS + SKIPPED_SCANS))
          {
            echo "## Workflow log/artifact audit"
            echo ""
            if [[ -n "${LOOKBACK_HOURS}" ]]; then
              echo "- **Lookback:** \`${LOOKBACK_RAW}\` (${LOOKBACK_HOURS}h)"
            else
              echo "- **Lookback:** \`${LOOKBACK_RAW}\` (requested; never validated -- list step did not complete)"
            fi
            echo "- **Target repo:** \`${TARGET_REPO}\`"
            echo ""
            # "skipped" here means an earlier step (secrets bootstrap or run
            # listing) failed, so "Scan each run's logs" never ran at all --
            # FLAGGED_COUNT/SKIPPED_TOTAL would misleadingly read all-zero in
            # that case (nothing to flag if nothing was scanned), so this must
            # be checked *before* falling back to the "no leaks" message.
            # Same for NO_TARGETS: zero resolved workflows means we never
            # checked anything -- not "checked, clean."
            if [[ "${DISCOVER_OUTCOME}" != "success" ]]; then
              echo ":x: Discover step failed -- no runs were scanned. This is **not** a clean pass -- see job logs."
            elif [[ "${AGGREGATE_OUTCOME}" != "success" ]]; then
              echo ":x: Result aggregation failed -- cannot determine whether leaks were found. This is **not** a clean pass -- see job logs."
            elif [[ "${SCAN_OUTCOME}" != "success" && "${SCAN_OUTCOME}" != "skipped" ]]; then
              echo ":x: Audit did not fully complete -- scan matrix ended in **${SCAN_OUTCOME}**. Results below are incomplete, not a clean pass -- see job logs."
            elif [[ "${NO_TARGETS}" == "true" ]]; then
              echo ":x: No audit targets resolved for \`${TARGET_REPO}\` -- nothing was scanned. This is **not** a clean pass (check EXTERNAL_CALLERS / target-repo selection)."
            elif [[ "${FLAGGED_COUNT}" == "0" && "${SKIPPED_TOTAL}" == "0" ]]; then
              echo "No leaked credentials found in this audit window (logs + artifacts)."
            elif [[ "${FLAGGED_COUNT}" == "0" ]]; then
              echo ":warning: No leaked credentials found in runs that were successfully scanned, but **${SKIPPED_TOTAL}** target(s)/run(s) could not be fully verified -- this is **not** a confirmed clean pass."
            elif [[ "${UPLOAD_OUTCOME}" == "success" ]]; then
              echo ":rotating_light: **${FLAGGED_COUNT}** run(s) had leaked credential(s) in logs and/or artifacts -- see the tracking issue and \`audit-redacted-logs-${RUN_ID}\` artifact."
            else
              # Don't promise an artifact that isn't there -- the upload
              # step's own outcome (not just "did we try") tells us whether
              # it actually landed.
              echo ":rotating_light: **${FLAGGED_COUNT}** run(s) had leaked credential(s) in logs and/or artifacts -- see the tracking issue. :warning: The \`audit-redacted-logs-${RUN_ID}\` artifact upload did not succeed (outcome: **${UPLOAD_OUTCOME}**) -- redacted copies are not available from this run."
            fi
            if [[ "${SKIPPED_TOTAL}" != "0" ]]; then
              echo ""
              echo ":warning: **${SKIPPED_TOTAL}** target(s)/run(s) could not be listed or scanned this time (see \`::warning::\` annotations above) -- this audit is partial, not a clean pass."
            fi
            if [[ "${RUNS_TRUNCATED}" == "true" ]]; then
              echo ""
              echo ":warning: Aggregate run cap reached -- some in-window runs were not listed for scanning (partial audit, not a clean pass)."
            fi
            if [[ "${PURGE_FAILURES}" != "0" ]]; then
              echo ""
              echo ":rotating_light: **${PURGE_FAILURES}** flagged run(s) could not have their raw logs and/or tainted artifacts deleted -- the exposure window is **NOT** closed for those runs (see the tracking issue's \"Purged\" column)."
            fi
            if [[ "${PROCESSING_FAILURES}" != "0" ]]; then
              echo ""
              echo ":warning: **${PROCESSING_FAILURES}** flagged run(s) were detected but couldn't be fully recorded (redacted-copy or summary write failed) -- they still count toward the total above, but may be missing from the tracking issue table or combined artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "skipped-total=${SKIPPED_TOTAL}" >> "$GITHUB_OUTPUT"

          NOTIFY_PARTS=("lookback=${LOOKBACK_RAW}" "target=${TARGET_REPO}")
          [[ "${DISCOVER_OUTCOME}" != "success" ]] && NOTIFY_PARTS+=("discover failed -- nothing scanned")
          [[ "${AGGREGATE_OUTCOME}" != "success" ]] && NOTIFY_PARTS+=("aggregation failed -- cannot confirm clean pass")
          [[ "${SCAN_OUTCOME}" != "success" && "${SCAN_OUTCOME}" != "skipped" ]] && NOTIFY_PARTS+=("scan matrix incomplete (${SCAN_OUTCOME})")
          [[ "${NO_TARGETS}" == "true" ]] && NOTIFY_PARTS+=("no audit targets resolved (nothing scanned)")
          [[ "${FLAGGED_COUNT}" != "0" ]] && NOTIFY_PARTS+=("${FLAGGED_COUNT} run(s) with leaked credential(s) in logs/artifacts")
          [[ "${SKIPPED_TOTAL}" != "0" ]] && NOTIFY_PARTS+=("${SKIPPED_TOTAL} target(s)/run(s) not scanned (partial audit)")
          [[ "${RUNS_TRUNCATED}" == "true" ]] && NOTIFY_PARTS+=("aggregate run cap reached (partial audit)")
          [[ "${PURGE_FAILURES}" != "0" ]] && NOTIFY_PARTS+=("${PURGE_FAILURES} run(s) with unclosed exposure window (purge failed)")
          [[ "${PROCESSING_FAILURES}" != "0" ]] && NOTIFY_PARTS+=("${PROCESSING_FAILURES} run(s) detected but not fully recorded")
          # "${arr[*]}" with IFS set only honors the *first* IFS character
          # when joining, so a ", " separator needs an explicit printf join
          # instead.
          NOTIFY_MESSAGE=$(printf ', %s' "${NOTIFY_PARTS[@]}")
          NOTIFY_MESSAGE="${NOTIFY_MESSAGE#, }"
          echo "notify-message=${NOTIFY_MESSAGE}" >> "$GITHUB_OUTPUT"

      - name: Report findings
        # always(): a bare condition implicitly ANDs with success() of every
        # prior step in the job, so if "Upload combined redacted logs" fails
        # *after* findings were already detected, incident reporting would
        # otherwise be skipped too -- exactly when it matters most. Gate on
        # aggregate outcome explicitly rather than relying on always() alone,
        # so this doesn't also fire (and blow up on a missing SUMMARY_JSONL)
        # if the aggregate step itself never got that far.
        if: >
          always() &&
          steps.aggregate.outcome == 'success' &&
          steps.aggregate.outputs.flagged-count != '0'
        env:
          # This repo's own token is enough here: the tracking issue is
          # always created/updated in this repo, regardless of which repo
          # a flagged run came from (unlike run listing/log fetch above,
          # which need the org-scoped token to reach other repos).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLAGGED_COUNT: ${{ steps.aggregate.outputs.flagged-count }}
          UPLOAD_OUTCOME: ${{ steps.upload-redacted.outcome || 'skipped' }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
        run: |
          echo "::group::Build findings body"
          BODY_FILE="${RUNNER_TEMP}/issue-body.md"
          {
            echo "Automated audit found leaked credential(s) in **${FLAGGED_COUNT}** e2e workflow run(s) (logs and/or artifacts)."
            echo ""
            if [[ "${UPLOAD_OUTCOME}" == "success" ]]; then
              echo "A redacted copy of each is in the"
              echo "[\`audit-redacted-logs-${RUN_ID}\`](${ARTIFACT_URL}) artifact from [this audit run](${RUN_URL})."
            else
              echo ":warning: The \`audit-redacted-logs-${RUN_ID}\` artifact upload did not succeed (outcome: **${UPLOAD_OUTCOME}**) --"
              echo "redacted copies are not available from this run; see [the run logs](${RUN_URL}) instead."
            fi
            echo "Raw logs and tainted artifacts were deleted for runs marked :white_check_mark: below -- for any marked :x:,"
            echo "the exposure window is still open and content needs to be deleted manually."
            echo ""
            echo "| Repo | Run | Findings | Rule(s) | Purged |"
            echo "|---|---|---|---|---|"
            jq -r '"| \(.repo) | [\(.run_id)](https://github.com/\(.repo)/actions/runs/\(.run_id)) | \(.findings_count) | " + ([.findings[].rule] | unique | join(", ")) + " | " + (if .purge_ok then ":white_check_mark:" else ":x:" end) + " |"' "${SUMMARY_JSONL}"
            echo ""
            echo "Rotate any credential(s) above that are real (not test/dev-only values)."
          } > "${BODY_FILE}"
          echo "::endgroup::"

          echo "::group::Create or update tracking issue"
          # --connect-timeout/--max-time on all three calls: without them, a
          # stuck GitHub API can tie up this (self-hosted, persistent) audit
          # runner until the job hits its own timeout, blocking later audits
          # from ever starting instead of failing this one fast.
          EXISTING=$(curl -sL --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues?state=open&labels=credential-leak&per_page=1")
          ISSUE_NUMBER=$(echo "${EXISTING}" | jq -r '.[0].number // empty')

          # --fail-with-body: without it, curl exits 0 (and this step "succeeds")
          # even on a 4xx/5xx response, so a permission/label/validation problem
          # would silently skip incident reporting entirely.
          if [[ -n "${ISSUE_NUMBER}" ]]; then
            echo "Appending to existing issue #${ISSUE_NUMBER}."
            curl -sL --fail-with-body --connect-timeout 10 --max-time 30 -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -d "$(jq -n --rawfile body "${BODY_FILE}" '{body: $body}')"
          else
            echo "Creating new tracking issue."
            curl -sL --fail-with-body --connect-timeout 10 --max-time 30 -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues" \
              -d "$(jq -n --rawfile body "${BODY_FILE}" \
                '{title: "OSAC-1684: Leaked credentials detected in e2e workflow logs/artifacts", body: $body, labels: ["credential-leak"]}')"
          fi
          echo "::endgroup::"

      - name: Notify Slack
        # always(): a bare boolean condition implicitly ANDs with success(),
        # so without this, a hard failure upstream (not just a tracked
        # SCAN_OK=false) would skip this notification -- exactly the failure
        # most worth alerting on. steps.vault.outcome == 'success' is required
        # too: if Vault/AppRole itself is what failed, SLACK_WEBHOOK_URL is
        # empty and posting to it would just fail a second time with a
        # confusing curl error, so we don't attempt it -- the job's own
        # failed status is the fallback signal in that specific case. This is
        # an accepted gap (no secrets channel independent of Vault exists in
        # this project by design) rather than a fix.
        # steps.aggregate.outputs.purge-failures isn't listed separately here --
        # a purge failure can only happen on a run that's already flagged
        # (flagged-count != '0'), so it's already implied by that condition.
        # steps.summary.outcome != 'success' is listed explicitly, though:
        # "Write job summary" can itself fail after an otherwise-clean scan,
        # which would leave every other predicate here false and silently
        # skip the alert on exactly the step that's supposed to catch this.
        if: >
          always() &&
          steps.vault.outcome == 'success' &&
          (needs.discover.result != 'success' || steps.aggregate.outcome != 'success' || (needs.scan.result != 'success' && needs.scan.result != 'skipped') || steps.summary.outcome != 'success' || steps.aggregate.outputs.flagged-count != '0' || steps.summary.outputs.skipped-total != '0' || needs.discover.outputs.no-targets == 'true' || needs.discover.outputs.runs-truncated == 'true')
        uses: ./.github/actions/notify-slack
        with:
          status: failure
          workflow-name: "Workflow log/artifact audit"
          failed-step: "${{ steps.summary.outputs.notify-message || 'Audit incomplete -- see run logs' }}"
          slack-webhook-url: ${{ steps.vault.outputs.SLACK_WEBHOOK_URL }}
          workflow-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch-name: ${{ github.ref_name }}
          commit-sha: ${{ github.sha }}
          artifact-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
