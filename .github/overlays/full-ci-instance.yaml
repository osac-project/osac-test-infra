# Merged into osac-installer values/full-ci/instance.yaml at e2e install time.
# Upstream full-ci is missing pieces the per-suite CI profiles already have:
#   - storageFulfillment: per-tenant StorageClasses (ClusterStorageReady)
#   - lvms: register StorageBackend + StorageTier named "local" (VMaaS disk tests)
#   - echoAdapter: metering tests and the workflow metering-adapter step
# Keep full-ci's custom ci.steps cluster-fulfillment backend.
# Provider networking stays at the profile's setting (provisioningEnabled:
# false). global.networking.netris no longer exists in the chart schema, and
# the network-fulfillment instance group reads its Netris password only from
# the Secret that the installer writes from values, never from the optional
# netris-credentials Secret (that one is mounted by cluster fulfillment only).
# Turning provisioning on here would need a password in values.
aap:
  instanceGroups:
    storageFulfillment:
      enabled: true

lvms:
  enabled: true

metering:
  echoAdapter:
    enabled: true
    image:
      repository: ghcr.io/osac-project/metering-echo-adapter
      tag: latest
      pullPolicy: Always
