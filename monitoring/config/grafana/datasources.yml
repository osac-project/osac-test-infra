# Grafana datasource provisioning for OSAC CI monitoring
# Deployed by monitoring-setup.sh
# Auto-provisions Prometheus as the default datasource.

apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Workflow Exporter API
    orgId: 1
  - name: CI Observe Traces
    orgId: 1
  - name: CI Observe Logs
    orgId: 1
  - name: CI Observe Metrics
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9091
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  # The ci-observe telemetry backend (monitoring/scripts/ci-observe.py up),
  # kept in sync by the scheduled .github/workflows/ci-observe-sync.yml on
  # this machine. This Grafana runs with host networking, so it reaches the
  # backend's loopback-published ports directly.
  #
  # Live traces: Tempo 2.10 (ci-observe-tempo210). The otelcol-router host
  # service has routed all new traces here since 2026-11-01 -- Tempo 3.1.1 in
  # the LGTM bundle has a search bug (grafana/tempo#8054) that returns only
  # ~2/3 of matching spans.
  - name: CI Observe Traces
    uid: ci-observe-traces
    type: tempo
    access: proxy
    url: http://127.0.0.1:3210
    editable: false

  # Read-only archive: traces ingested into the LGTM bundle's Tempo 3.1.1
  # before the 2026-11-01 cutover to Tempo 2.10. No new data lands here.
  - name: CI Observe Traces Archive
    uid: ci-observe-traces-archive
    type: tempo
    access: proxy
    url: http://127.0.0.1:3200
    editable: false

  - name: CI Observe Logs
    uid: ci-observe-logs
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    editable: false

  - name: CI Observe Metrics
    uid: ci-observe-metrics
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9092
    editable: false
    jsonData:
      timeInterval: 60s

  - name: Workflow Exporter API
    uid: workflow-api
    type: yesoreyeram-infinity-datasource
    access: proxy
    editable: false
    jsonData:
      global_queries: []
