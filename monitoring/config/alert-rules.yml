# Prometheus alerting rules for OSAC CI runner monitoring
# Deployed by monitoring-setup.sh to ~/.monitoring-server/config/alert-rules.yml

groups:
  - name: runner-health
    rules:
      # RunnerDown -- node_exporter target unreachable for >2 minutes.
      # Fires when Prometheus can't scrape a runner's node_exporter,
      # indicating the machine is down or the exporter crashed.
      - alert: RunnerDown
        expr: up{job=~"node-exporter.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Runner {{ $labels.instance }} is down"
          description: "node_exporter on {{ $labels.instance }} has been unreachable for more than 2 minutes."

      # DiskAlmostFull -- filesystem usage >80% on any runner.
      # Uses the rootfs mountpoint which represents the main disk.
      - alert: DiskAlmostFull
        expr: |
          (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) * 100 > 80
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk almost full on {{ $labels.instance }}"
          description: "Root filesystem on {{ $labels.instance }} is {{ $value | printf \"%.1f\" }}% full."

      # HighMemoryUsage -- memory usage >90% for >5 minutes.
      - alert: HighMemoryUsage
        expr: |
          (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage on {{ $labels.instance }} is {{ $value | printf \"%.1f\" }}% for more than 5 minutes."

  - name: github-runners
    rules:
      # GitHubRunnerOffline -- org-runner-exporter reports a runner as offline.
      - alert: GitHubRunnerOffline
        expr: github_runner_org_status{status="offline"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "GitHub runner {{ $labels.name }} is offline"
          description: "Runner {{ $labels.name }} (id={{ $labels.id }}) has been reported offline by GitHub for more than 5 minutes."

  - name: workflow-queue
    rules:
      # SustainedQueueBacklog -- queue has been non-empty for >10 minutes.
      # Indicates runners are continuously busy and cannot drain the queue.
      - alert: SustainedQueueBacklog
        expr: github_actions_queued_runs_org > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sustained queue backlog: {{ $value }} runs queued for >10 minutes"
          description: "The workflow queue in osac-project has been non-empty for more than 10 minutes. All active runners may be busy."

      # HighQueueDepth -- many workflow runs queued simultaneously.
      # Fires immediately at 5+ queued runs to flag capacity issues.
      - alert: HighQueueDepth
        expr: github_actions_queued_runs_org >= 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High queue depth: {{ $value }} runs waiting"
          description: "{{ $value }} workflow runs have been queued in osac-project for more than 5 minutes. Consider adding runners or investigating stuck jobs."

  - name: exporter-health
    rules:
      # ExporterDown -- any exporter stops reporting metrics.
      # Catches silent failures from log format changes or exporter crashes.
      - alert: ExporterDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Exporter {{ $labels.job }} is down on {{ $labels.instance }}"
          description: "The {{ $labels.job }} exporter on {{ $labels.instance }} has been unreachable for more than 5 minutes."

  - name: ci-observe
    rules:
      # CiObservePollStalled -- the workflow exporter's poll cycle has not
      # finished in 15 minutes (it normally runs every 90 seconds; the gauge
      # is pinned at the end of a cycle, so a cycle that raised anywhere
      # leaves it aging).
      - alert: CiObservePollStalled
        expr: time() - ci_observe_store_last_success{store="jobs"} > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The workflow exporter poll has not finished in 15 minutes"
          description: "The exporter's collect cycle last completed at {{ $value | printf \"%.0f\" }} seconds ago. Check `podman logs workflow-exporter` and the journal of workflow-exporter.service."

      # CiObserveJobHistoryGap -- the hourly gap check proved runs missing
      # from the 30-day job history, or could not get an answer for a day.
      - alert: CiObserveJobHistoryGap
        expr: |
          max(github_actions_gap_check_missing_runs) > 0
          or max(github_actions_gap_check_days{state=~"gapped|error"}) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The ci-observe job history has a gap the reconciliation did not heal"
          description: "The gap check found days with runs verified missing (github_actions_gap_check_missing_runs) or days GitHub would not answer (github_actions_gap_check_days{state=\"gapped|error\"}). See the day_checks table in workflow-exporter.db."

      # CiObserveHourlyStoreStale -- an hourly store (test results, span
      # rollup, pull requests) has not completed a pass in 90 minutes.
      # The 2026-11-16 to 2026-11-21 pull-request stall looked like this.
      - alert: CiObserveHourlyStoreStale
        expr: time() - ci_observe_store_last_success{store=~"trends|spans|prs"} > 5400
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The ci-observe {{ $labels.store }} store has not advanced in 90 minutes"
          description: "The last completed {{ $labels.store }} pass is older than 90 minutes. Check the matching ci-observe-{{ $labels.store }} service in `systemctl --user` and its journal."

      # CiObserveAuditStale -- the daily check against GitHub has not
      # written its JSON in 26 hours (timer runs 03:35 UTC; the unit exits
      # non-zero when the check itself crashes, which leaves the old file).
      - alert: CiObserveAuditStale
        expr: time() - ci_observe_store_last_success{store="audit"} > 93600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The ci-observe daily audit has not completed in 26 hours"
          description: "ci-observe-audit.json is older than 26 hours. Run `podman exec workflow-exporter python3 /app/ci_observe_audit.py --days 30 --sample 60 --e2e-sample 30 --out /data/ci-observe-audit.json` by hand and read its output; every page is showing a stale audit line."

  - name: service-health
    rules:
      # ServiceDown -- a machine-level service (GitHub Actions runner agent,
      # libvirtd, haproxy, podman.socket) is inactive for >5 minutes.
      # Sourced from the service-health-textfile.sh collector, since these
      # are system-level systemd units this rootless stack can't reach via
      # node_exporter's built-in --collector.systemd.
      - alert: ServiceDown
        expr: osac_service_active == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.unit }} is down on {{ $labels.instance }}"
          description: "The systemd unit {{ $labels.unit }} on {{ $labels.instance }} has been inactive for more than 5 minutes."
