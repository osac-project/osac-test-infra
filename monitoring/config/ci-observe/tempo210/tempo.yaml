server:
  http_listen_port: 3210
  # A full-install capture pushes trace batches large enough to exceed the
  # 16 MiB default. The distributor then failed to hand them to the
  # ingester ("ResourceExhausted ... larger than max 16777216"), which
  # backed up the router and the gateway and cost the capture its pytest
  # spans. 64 MiB accepts the batch; the router also caps its batch size.
  grpc_server_max_recv_msg_size: 67108864
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4418
        grpc:
          endpoint: 0.0.0.0:4417
storage:
  trace:
    backend: local
    wal:
      path: /data/wal
    local:
      path: /data/blocks
    block:
      version: vParquet4
    blocklist_poll: 30s
overrides:
  defaults:
    ingestion:
      max_traces_per_user: 0
      rate_limit_bytes: 300000000
      burst_size_bytes: 300000000
    global:
      max_bytes_per_trace: 100000000
compactor:
  compaction:
    block_retention: 720h
