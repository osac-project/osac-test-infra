# Loki override for the ci-observe local development stack.
#
# This is the stock grafana/otel-lgtm 0.38.1 loki-config.yaml (Loki 3.7.9) with
# six changes:
#   - max_chunk_age 168h: Loki accepts out-of-order entries at most max_chunk_age/2
#     behind the newest entry in a stream; the stock 2h (1h window) silently
#     discarded replayed day-old logs that shared stream labels with newer logs.
#   - chunk_idle_period 1m: replayed logs with old timestamps are stored but stay
#     invisible to queries until their chunk is flushed, and the max-chunk-age
#     flush never fires for them, so freshly imported old captures looked empty.
#     The tool also forces a flush after each successful import.
#   - limits_config.otlp_config: Loki promotes only a curated default set of OTLP
#     resource attributes to index labels, so the capture's osac.ci.* attributes
#     were dropped and the ci-observe-runs dashboard's capture_id variable (a Loki
#     label-values query on osac_ci_capture_id) stayed empty: every panel filtered
#     on an empty variable and showed no data. The list below replaces the
#     defaults, so it repeats them and adds the osac.ci attributes (capture id,
#     observed namespace, suite, PR, and the run's own id, attempt and workflow:
#     without run_id in the list it displays on every stream but no selector can
#     filter on it).
#   - limits_config.max_query_series 50000 (stock 500): the artifact-log rollup
#     labels error lines by normalized signature, and any aggregate over a week
#     of them reads more than 500 streams, which the stock bound refuses.
#   - limits_config.max_global_streams_per_user 500000 and a raised ingestion
#     rate (stock 5000 streams, 4 MB/s): the rollup creates one stream per
#     (run, signature) and the stock bound refused its pushes after two days
#     of bundles.
#   - server.grpc_server_max_recv_msg_size and grpc_server_max_send_msg_size 32 MiB
#     (stock 4 MiB): a query over a whole 20-minute capture returns a response
#     larger than 4 MiB and Loki failed with ResourceExhausted (4505394 vs.
#     4194304); a 5-minute window or a line filter fit under the stock limit.
#   - 30-day retention: ci-observe keeps logs for the same 30 days as traces
#     and cluster metrics.
#
# This is a local development stack setting, not a fleet production setting. Keep
# the remaining defaults in sync with the pinned image when it changes.
auth_enabled: false

server:
  http_listen_port: 3100
  # A query over a whole 20-minute capture failed with ResourceExhausted
  # (4505394 vs. 4194304). The response crosses the internal gRPC 4 MiB message
  # limit, not a query-length limit; a 5-minute window or a line filter stays
  # under it. 32 MiB accepts the full-capture response.
  grpc_server_max_recv_msg_size: 33554432
  grpc_server_max_send_msg_size: 33554432

common:
  instance_addr: 127.0.0.1
  path_prefix: /data/loki
  storage:
    filesystem:
      chunks_directory: /data/loki/chunks
      rules_directory: /data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://127.0.0.1:9093

pattern_ingester:
  lifecycler:
    min_ready_duration: 1s

ingester:
  lifecycler:
    min_ready_duration: 1s
  # Loki accepts out-of-order entries at most max_chunk_age/2 behind the newest entry
  # already in a stream ("too far behind" otherwise; stock 2h means a 1h window, which
  # silently dropped replayed day-old logs sharing stream labels with newer logs).
  # 168h widens that to 84h; chunk_idle_period below still flushes chunks quickly.
  max_chunk_age: 168h
  # 1m: replayed logs with old timestamps are not covered by the max-chunk-age
  # flush, so without this they stay invisible to queries until the stock 30m
  # idle period elapses. Short idle makes imports visible and durable quickly.
  chunk_idle_period: 1m

frontend:
  scheduler_dns_lookup_period: 1s
  address: 127.0.0.1

query_scheduler:
  use_scheduler_ring: false

compactor:
  working_directory: /data/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: 720h
  # The artifact-log rollup labels every error line with its normalized
  # signature: a week of failed runs holds tens of thousands of streams,
  # and the stock 500-series query bound refuses any aggregate over them
  # ("maximum number of series (500) reached"). This stack is single-user
  # and localhost-only, so the bound protects nothing here.
  max_query_series: 50000
  # The same rollup creates one stream per (run, signature); the live
  # capture lane already runs thousands. The stock 5000 active-stream bound
  # refused the pushes ("maximum active stream limit exceeded") after two
  # days of bundles. Single user, localhost-only: raise it out of the way.
  max_global_streams_per_user: 500000
  ingestion_rate_mb: 50
  ingestion_burst_size_mb: 100
  # The artifact-log backfill pushes the regression window's bundles with
  # their real timestamps, and Loki's default oldest-acceptable age is
  # max_chunk_age (168h here), so it refused lines older than a week
  # ("timestamp too old"). The timestamps come from the logs themselves,
  # not from a skewed clock; the bound protects nothing here. 720h is the
  # retention: nothing older can be stored anyway.
  reject_old_samples_max_age: 720h
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - service.name
            - service.namespace
            - service.instance.id
            - deployment.environment
            - deployment.environment.name
            - cloud.region
            - cloud.availability_zone
            - k8s.cluster.name
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
            - container.name
            - k8s.replicaset.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
            - osac.ci.capture_id
            - osac.ci.observed_namespace
            - osac.ci.suite
            - osac.ci.pr
            # The run's own identity: without run_id here it arrives as
            # structured metadata, which every query result displays but no
            # selector can filter on, so "the logs of run X" answered
            # nothing until capture_id (which embeds it) was used instead.
            - osac.ci.run_id
            - osac.ci.run_attempt
            - osac.ci.workflow
