# Loki override for the ci-observe local development stack.
#
# This is the stock grafana/otel-lgtm 0.38.1 loki-config.yaml with three changes:
#   - max_chunk_age 168h: Loki accepts out-of-order entries at most max_chunk_age/2
#     behind the newest entry in a stream; the stock 2h (1h window) silently
#     discarded replayed day-old logs that shared stream labels with newer logs.
#   - chunk_idle_period 1m: replayed logs with old timestamps are stored but stay
#     invisible to queries until their chunk is flushed, and the max-chunk-age
#     flush never fires for them, so freshly imported old captures looked empty.
#     The tool also forces a flush after each successful import.
#   - limits_config.otlp_config: Loki promotes only a curated default set of OTLP
#     resource attributes to index labels, so the capture's osac.ci.* attributes
#     were dropped and the ci-observe-runs dashboard's capture_id variable (a Loki
#     label-values query on osac_ci_capture_id) stayed empty: every panel filtered
#     on an empty variable and showed no data. The list below replaces the
#     defaults, so it repeats them and adds the two osac.ci attributes.
#
# This is a local development stack setting, not a fleet production setting. Keep
# the remaining defaults in sync with the pinned image when it changes.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /data/loki
  storage:
    filesystem:
      chunks_directory: /data/loki/chunks
      rules_directory: /data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://127.0.0.1:9093

pattern_ingester:
  lifecycler:
    min_ready_duration: 1s

ingester:
  lifecycler:
    min_ready_duration: 1s
  # Loki accepts out-of-order entries at most max_chunk_age/2 behind the newest entry
  # already in a stream ("too far behind" otherwise; stock 2h means a 1h window, which
  # silently dropped replayed day-old logs sharing stream labels with newer logs).
  # 168h widens that to 84h; chunk_idle_period below still flushes chunks quickly.
  max_chunk_age: 168h
  # 1m: replayed logs with old timestamps are not covered by the max-chunk-age
  # flush, so without this they stay invisible to queries until the stock 30m
  # idle period elapses. Short idle makes imports visible and durable quickly.
  chunk_idle_period: 1m

frontend:
  scheduler_dns_lookup_period: 1s
  address: 127.0.0.1

query_scheduler:
  use_scheduler_ring: false

limits_config:
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - service.name
            - service.namespace
            - service.instance.id
            - deployment.environment
            - deployment.environment.name
            - cloud.region
            - cloud.availability_zone
            - k8s.cluster.name
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
            - container.name
            - k8s.replicaset.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
            - osac.ci.capture_id
            - osac.ci.observed_namespace
