# ci-observe canary manifests for namespace ci-observability-canary.
#
# Render before apply: the coordinator substitutes the plain ${...} tokens
# (envsubst-style; no custom template framework):
#   CI_OBSERVE_CAPTURE_ID        capture identity; also names the PVC
#   CI_OBSERVE_NAMESPACE         observed OSAC namespace, e.g. osac-e2e-ci
#   CI_OBSERVE_CLUSTER_UID       cluster identity
#   CI_OBSERVE_KUBELET_ENDPOINT  https://<node-ip>:10250
#   CI_OBSERVE_SUITE             test suite (vmaas/caas/bmaas); may be empty
#   CI_OBSERVE_PR                pull request number; empty for non-PR runs
#
# Images are pinned by digest (verified against the remote registries):
#   gateway/replay: opentelemetry-collector-contrib 0.164.0
#     ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
#     @sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
#   Beyla 3.40.0 + Red Hat Go version-string fix: quay.io/osac-project/beyla
#   (see .github/actions/ci-observe-capture/action.yml's beyla-image input)
#
# The gateway config comes from monitoring/config/ci-observe/collector.yaml;
# create it before applying:
#   kubectl -n ci-observability-canary create configmap ci-observe-collector \
#     --from-file=config.yaml=monitoring/config/ci-observe/collector.yaml
# The collector expands ${env:...} placeholders itself from the container env.
#
# SCC GATE (parent approval before deployment): Beyla needs hostPID, UID 0 and
# BPF capabilities inside the OpenShift guest; the required SCC is commented
# out at the bottom of this file. Apply and bind it only after approval. The
# gateway also reads hostPath /var/log/pods; if the node denies that read to
# the unprivileged collector UID, pod log collection stays empty (named gap).
---
apiVersion: v1
kind: Namespace
metadata:
  name: ci-observability-canary
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-observe-gateway
  namespace: ci-observability-canary
---
# Read-only, namespaced, in the observed namespace. No Secrets or
# ConfigMaps are readable; object specs are removed by the collector
# transform before capture.
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ci-observe-gateway
  namespace: ${CI_OBSERVE_NAMESPACE}
rules:
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [osac.openshift.io]
    resources: [computeinstances, virtualnetworks, subnets, clusterorders]
    verbs: [get, list, watch]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ci-observe-gateway
  namespace: ${CI_OBSERVE_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-observe-gateway
subjects:
  - kind: ServiceAccount
    name: ci-observe-gateway
    namespace: ci-observability-canary
---
# Kubelet stats only (CPU/memory/pressure metrics). Read-only, single
# subresource, nothing else. Do NOT add nodes/proxy for kubelet metadata:
# collector.yaml must stay free of extra_metadata_labels (see its
# kubelet_stats comment), so nothing the gateway runs ever needs it.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ci-observe-kubelet-stats
rules:
  - apiGroups: [""]
    resources: [nodes/stats]
    verbs: [get]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ci-observe-kubelet-stats
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ci-observe-kubelet-stats
subjects:
  - kind: ServiceAccount
    name: ci-observe-gateway
    namespace: ci-observability-canary
---
# One capture volume per execution; survives gateway shutdown for the
# parent-owned copy/readout step.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ci-observe-capture-${CI_OBSERVE_CAPTURE_ID}
  namespace: ci-observability-canary
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-observe-gateway
  namespace: ci-observability-canary
  labels:
    app: ci-observe-gateway
spec:
  # One replica: single writer for the capture files and one k8s_objects
  # watch, so observations are not duplicated.
  replicas: 1
  selector:
    matchLabels:
      app: ci-observe-gateway
  template:
    metadata:
      labels:
        app: ci-observe-gateway
    spec:
      serviceAccountName: ci-observe-gateway
      containers:
        - name: gateway
          image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
          args: ["--config=/etc/ci-observe/config.yaml"]
          env:
            - name: CI_OBSERVE_CAPTURE_ID
              value: "${CI_OBSERVE_CAPTURE_ID}"
            - name: CI_OBSERVE_NAMESPACE
              value: "${CI_OBSERVE_NAMESPACE}"
            - name: CI_OBSERVE_CLUSTER_UID
              value: "${CI_OBSERVE_CLUSTER_UID}"
            - name: CI_OBSERVE_KUBELET_ENDPOINT
              value: "${CI_OBSERVE_KUBELET_ENDPOINT}"
            - name: CI_OBSERVE_SUITE
              value: "${CI_OBSERVE_SUITE}"
            - name: CI_OBSERVE_PR
              value: "${CI_OBSERVE_PR}"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: self-metrics
              containerPort: 8888
            - name: health
              containerPort: 13133
          # Liveness only proves the process. Real data counters are the
          # otelcol_receiver_accepted/refused and otelcol_exporter_sent
          # metrics on :8888.
          livenessProbe:
            httpGet:
              path: /
              port: health
          readinessProbe:
            httpGet:
              path: /
              port: health
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/ci-observe
              readOnly: true
            - name: capture
              mountPath: /capture
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: ci-observe-collector
        - name: capture
          persistentVolumeClaim:
            claimName: ci-observe-capture-${CI_OBSERVE_CAPTURE_ID}
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: ci-observe-gateway
  namespace: ci-observability-canary
spec:
  selector:
    app: ci-observe-gateway
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: self-metrics
      port: 8888
      targetPort: self-metrics
    - name: health
      port: 13133
      targetPort: health
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ci-observe-beyla
  namespace: ci-observability-canary
data:
  beyla.yml: |
    # Traces unsampled. Discovery limited to the OSAC namespace; the
    # namespace token is rendered by the coordinator, not by Beyla.
    discovery:
      instrument:
        - k8s_namespace: ${CI_OBSERVE_NAMESPACE}
    otel_traces_export:
      endpoint: http://ci-observe-gateway.ci-observability-canary.svc.cluster.local:4317
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-observe-beyla
  namespace: ci-observability-canary
---
# Read-only, list/watch only; needed for Kubernetes metadata decoration on
# Beyla spans.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ci-observe-beyla
rules:
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [list, watch]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ci-observe-beyla
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ci-observe-beyla
subjects:
  - kind: ServiceAccount
    name: ci-observe-beyla
    namespace: ci-observability-canary
---
# Node agent inside the OpenShift guest (where the OSAC processes run), not
# on the baremetal host. hostPID and the capability list are the minimum
# Beyla reports it needs for eBPF discovery; no privileged: true.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ci-observe-beyla
  namespace: ci-observability-canary
spec:
  selector:
    matchLabels:
      app: ci-observe-beyla
  template:
    metadata:
      labels:
        app: ci-observe-beyla
    spec:
      serviceAccountName: ci-observe-beyla
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: beyla
          image: quay.io/osac-project/beyla@sha256:4896c8963342919a51dd403a7bdb8a58ad44de04bd455e9f641e91b1d9c6881b
          env:
            - name: BEYLA_CONFIG_PATH
              value: /etc/beyla/beyla.yml
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            capabilities:
              add: [BPF, SYS_PTRACE, NET_RAW, CHECKPOINT_RESTORE, DAC_READ_SEARCH, PERFMON, SYS_ADMIN]
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/beyla
              readOnly: true
            - name: var-run-beyla
              mountPath: /var/run/beyla
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: ci-observe-beyla
        - name: var-run-beyla
          emptyDir: {}
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
# ---
# SCC GATE: requires parent approval before deployment. Uncomment, apply and
# bind ONLY after that approval (Beyla 3.40 docs, OpenShift section):
#   oc adm policy add-scc-to-user ci-observe-beyla -z ci-observe-beyla -n ci-observability-canary
# apiVersion: security.openshift.io/v1
# kind: SecurityContextConstraints
# metadata:
#   name: ci-observe-beyla
# allowHostDirVolumePlugin: true
# allowHostPID: true
# allowPrivilegedContainer: false
# allowedCapabilities: [BPF, SYS_PTRACE, NET_RAW, CHECKPOINT_RESTORE, DAC_READ_SEARCH, PERFMON, SYS_ADMIN]
# readOnlyRootFilesystem: true
# runAsUser:
#   type: MustRunAs
#   uid: 0
# seLinuxContext:
#   type: RunAsAny
# fsGroup:
#   type: RunAsAny
# supplementalGroups:
#   type: RunAsAny
